<!DOCTYPE html>
<!-- Aruna's Classes · ChineseFrench — New HSK 3 · Lessons 1–3 Listening Test (10). © 2026 RRAruna Enterprises. -->
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aruna's Classes — HSK3 Listening Test</title>
<style>
:root{--red:#a2231d;--red-dark:#7a1a15;--gold:#c99a2e;--gold-light:#f3e3b3;--cream:#fbf6ea;--ink:#2b1a12;--green:#2e7d32;--green-bg:#e3f5e1;--gray:#8a7f6e;--blue:#4a86c8;--shadow:0 4px 14px rgba(122,26,21,.15);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);}
.app-header{background:linear-gradient(135deg,var(--red),var(--red-dark));padding:14px 14px 12px;text-align:center;border-bottom:4px solid var(--gold);}
.logo-wrap{max-width:460px;margin:0 auto 8px;} .logo-wrap svg{width:100%;height:auto;display:block;}
.app-header .sub{color:#fff;font-size:.92rem;margin-top:4px;font-weight:600;}
.student-bar{max-width:720px;margin:8px auto 0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
.student-bar input{padding:8px 12px;border-radius:20px;border:none;font-size:.9rem;width:190px;}
.badge{background:var(--gold);color:var(--red-dark);font-weight:800;padding:6px 14px;border-radius:20px;font-size:.85rem;}
main{max-width:680px;margin:0 auto;padding:16px 14px 80px;}
.card{background:#fff;border:1px solid var(--gold-light);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.howto{background:#eef6ff;border:1px solid #b9d5f2;border-left:5px solid var(--blue);border-radius:8px;padding:11px 13px;margin-bottom:14px;font-size:.88rem;color:#243b52;}
.howto b{color:#1c4587;}
.warn{background:#fff3cd;border:1px solid var(--gold);color:#7a5b00;padding:8px 10px;border-radius:8px;font-size:.82rem;margin-bottom:10px;display:none;}
.warn.show{display:block;}
.qcount{font-size:.8rem;color:var(--gray);margin-bottom:6px;}
.progress-wrap{height:8px;background:var(--gold-light);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.progress-bar{height:100%;background:var(--red);width:0;transition:width .25s;}
.play-btn{font-size:1.05rem;background:var(--gold);color:var(--red-dark);border:none;border-radius:30px;padding:13px 26px;font-weight:800;cursor:pointer;margin:4px;}
.play-line{display:inline-block;background:#fff;border:1.5px solid var(--gold);border-radius:16px;padding:6px 12px;margin:3px;font-size:.85rem;cursor:pointer;color:var(--red-dark);font-weight:700;}
.play-line:hover{background:var(--gold-light);}.play-line .m{color:var(--blue);}
.stage{background:var(--cream);border:2px dashed var(--gold);border-radius:12px;padding:16px;margin-bottom:14px;text-align:center;}
.q-txt{font-size:1.25rem;font-weight:800;color:var(--red-dark);margin:6px 0 2px;}
.mc-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--gold-light);border-radius:10px;padding:13px 14px;margin:8px 0;cursor:pointer;font-size:1.05rem;font-family:inherit;color:var(--ink);}
.mc-opt:hover:not(:disabled){border-color:var(--gold);}
.mc-opt.chosen{background:var(--gold-light);border-color:var(--gold);font-weight:700;}
.mc-opt:focus-visible{outline:3px solid var(--gold);}
.btn{background:var(--red);color:#fff;border:none;padding:11px 20px;border-radius:18px;font-size:.95rem;cursor:pointer;font-weight:700;margin:4px;}
.btn:hover{background:var(--red-dark);}.btn.gold{background:var(--gold);color:var(--red-dark);}.btn.outline{background:#fff;color:var(--red);border:2px solid var(--red);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.result{text-align:center;padding:20px 10px;}
.gauge{font-size:2.6rem;font-weight:800;color:var(--red-dark);}
.note{font-size:.8rem;color:var(--gray);margin-top:8px;}
.footer-copy{text-align:center;color:var(--gray);font-size:.72rem;padding:16px 10px 40px;}
.watermark{position:fixed;bottom:6px;right:10px;font-size:.62rem;color:rgba(122,26,21,.3);pointer-events:none;}
@media (max-width:520px){.q-txt{font-size:1.08rem;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style></head>
<body>
<div class="watermark">© 2026 ChineseFrench · Aruna's Classes</div>
<header class="app-header">
  <div class="logo-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a2231d"/><stop offset="1" stop-color="#7a1a15"/></linearGradient></defs>
  <rect x="6" y="6" width="988" height="288" rx="34" fill="url(#red)" stroke="#c99a2e" stroke-width="7"/>
  <circle cx="150" cy="150" r="98" fill="none" stroke="#c99a2e" stroke-width="6"/>
  <circle cx="150" cy="150" r="86" fill="#fbf6ea"/>
  <text x="150" y="150" font-family="Noto Serif CJK SC, serif" font-size="118" font-weight="700" fill="#a2231d" text-anchor="middle" dominant-baseline="central">语</text>
  <text x="290" y="118" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#fbf6ea">ChineseFrench</text>
  <line x1="292" y1="150" x2="900" y2="150" stroke="#c99a2e" stroke-width="2"/>
  <text x="290" y="196" font-family="Noto Serif CJK SC, serif" font-size="40" font-weight="700" fill="#f3e3b3">爱睿娜的课堂 · Aruna's Classes</text>
  <text x="292" y="238" font-family="Georgia, serif" font-size="27" fill="#e8c98f">中文 Mandarin · Français · Deutsch · HSK Preparation</text>
</svg>
</div>
  <div class="sub">新 HSK 3.0 · 三级 · 第1–3课 · 听力测试 Listening Test (10)</div>
  <div class="student-bar"><input id="sname" placeholder="Enter your name..." aria-label="name">
    <span class="badge" id="prog">0 / 10</span>
    <button class="btn outline" style="padding:6px 12px;font-size:.78rem;" onclick="restart()">↺ Start fresh</button></div>
</header>
<main id="main"></main>
<div class="footer-copy">© 2026 RRAruna Enterprises · ChineseFrench · Aruna's Classes. All Rights Reserved.<br>
Man = male voice · Woman = female voice. Answers are in the teacher's key, not shown here.</div>
<script>
const ITEMS=[{"lines":[["男","你看，那个高个子、短头发的人是不是李文？"],["女","好像是他，不过他比照片上瘦一点儿。"]],"q":"李文长什么样？","opts":["高个子、短头发","矮个子、长头发","高个子、长头发"],"ans":0},{"lines":[["女","我的行李箱怎么还没出来？是不是丢了？"],["男","别着急，我们拿着护照去服务台问问。"]],"q":"他们要去哪儿？","opts":["银行","服务台","医院"],"ans":1},{"lines":[["男","那个人是杨同乐吗？"],["女","不是，他叫李文，他们只是长得有点儿像。"]],"q":"那个人是谁？","opts":["杨同乐","李文","刘明"],"ans":1},{"lines":[["女","服务员，再给我们拿一双筷子和一个碗。"],["男","好的，请等一下，我马上拿。"]],"q":"女的要什么？","opts":["筷子和碗","勺子和碗","筷子和勺子"],"ans":0},{"lines":[["男","这家饭馆能送外卖吗？"],["女","能，现在很多饭馆都能送，想吃什么就点什么。"]],"q":"关于这家饭馆，可以知道什么？","opts":["不能送外卖","能送外卖","菜很贵"],"ans":1},{"lines":[["女","你尝尝这个鸡肉饭，好吃吗？"],["男","真不错，又便宜又好吃。"]],"q":"男的觉得鸡肉饭怎么样？","opts":["太贵了","不好吃","又便宜又好吃"],"ans":2},{"lines":[["男","你觉得这个小区怎么样？"],["女","环境挺好的，离地铁站也不远。"]],"q":"女的觉得这个小区怎么样？","opts":["环境挺好","太远了","没有地铁"],"ans":0},{"lines":[["女","灯怎么开着？"],["男","可能我走的时候忘关了。"]],"q":"灯为什么开着？","opts":["灯坏了","男的忘关了","女的打开的"],"ans":1},{"lines":[["男","咱们去银行办张信用卡吧，走路几分钟就到。"],["女","好，可是我下午要去医院，很晚才能回来。"]],"q":"女的下午要去哪儿？","opts":["银行","医院","商店"],"ans":1},{"lines":[["女","这么多东西，我们自己搬太累了。"],["男","那找一家搬家公司吧，又快又方便。"]],"q":"男的想怎么搬家？","opts":["请朋友帮忙","自己搬","找搬家公司"],"ans":2}];

/* ---------- two-voice TTS ---------- */
let zhVoices=[],femaleVoice=null,maleVoice=null;
function pickVoice(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  zhVoices=vs.filter(v=>/zh(-|_)?(CN|Hans)/i.test(v.lang))||[];
  if(!zhVoices.length)zhVoices=vs.filter(v=>/zh/i.test(v.lang));
  const fem=/female|woman|xiaoxiao|xiaoyi|meijia|tingting|huihui|yaoyao|婷婷|美佳|女/i;
  const male=/male|man|yunyang|yunxi|yunjian|kangkang|zhiwei|男/i;
  femaleVoice=zhVoices.find(v=>fem.test(v.name))||zhVoices[0]||null;
  maleVoice=zhVoices.find(v=>male.test(v.name))||zhVoices.find(v=>v!==femaleVoice)||zhVoices[0]||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function utter(txt,who){const u=new SpeechSynthesisUtterance(txt);u.lang="zh-CN";
  const male=(who==="男");const v=male?maleVoice:femaleVoice;if(v)u.voice=v;
  const two=femaleVoice&&maleVoice&&femaleVoice!==maleVoice;
  if(two){u.pitch=male?0.85:1.15;u.rate=male?0.8:0.86;}else{u.pitch=male?0.55:1.6;u.rate=male?0.78:0.9;}
  return u;}
function playConv(i){if(!window.speechSynthesis)return;speechSynthesis.cancel();ITEMS[i].lines.forEach(ln=>speechSynthesis.speak(utter(ln[1],ln[0])));}
function playLine(i,li){if(!window.speechSynthesis)return;speechSynthesis.cancel();const ln=ITEMS[i].lines[li];speechSynthesis.speak(utter(ln[1],ln[0]));}
function ttsOK(){return !!window.speechSynthesis;}
/* ---------- state ---------- */
let idx=0, picks=Array(ITEMS.length).fill(null);
function restart(){picks=Array(ITEMS.length).fill(null);idx=0;render();}
const OPT=["A","B","C","D"];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
  if(idx>=ITEMS.length){return finish();}
  const it=ITEMS[idx];
  const answered=picks.filter(x=>x!==null).length;
  document.getElementById('prog').textContent=answered+" / "+ITEMS.length;
  const lineBtns=it.lines.map((ln,li)=>`<button class="play-line" onclick="playLine(${idx},${li})"><span class="${ln[0]==='男'?'m':''}">${ln[0]==='男'?'👨 男':'👩 女'}</span> ▶</button>`).join(' ');
  document.getElementById('main').innerHTML=`<div class="card">
    <div class="howto"><b>How to do this:</b> Press ▶ to hear a short conversation between a man and a woman. You may replay it. Then choose the best answer. Your answers are <b>not marked here</b> — you'll get your total at the end. (10 questions)</div>
    <div class="warn ${ttsOK()?'':'show'}">This browser has no Chinese voice — ask your teacher to play the audio.</div>
    <div class="qcount">Question ${idx+1} of ${ITEMS.length}</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${idx/ITEMS.length*100}%"></div></div>
    <div class="stage">
      <button class="play-btn" onclick="playConv(${idx})">▶ 播放对话 Play conversation</button>
      <div class="note">👩 woman = female voice · 👨 man = male voice</div>
      <div style="margin-top:8px;">${lineBtns}</div>
    </div>
    <div class="q-txt">${esc(it.q)}</div>
    <div id="opts">${it.opts.map((o,oi)=>`<button class="mc-opt ${picks[idx]===oi?'chosen':''}" onclick="choose(${oi})">${OPT[oi]}. ${esc(o)}</button>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;margin-top:14px;">
      <button class="btn outline" onclick="prev()" ${idx===0?'disabled':''}>← Back</button>
      <button class="btn" onclick="next()">${idx===ITEMS.length-1?'Finish ✓':'Next →'}</button>
    </div></div>`;
}
function choose(oi){picks[idx]=oi;render();}
function next(){idx++;render();}
function prev(){if(idx>0)idx--;render();}
function finish(){
  const score=picks.reduce((n,p,i)=>n+(p===ITEMS[i].ans?1:0),0);
  const done=picks.filter(x=>x!==null).length;
  document.getElementById('prog').textContent=ITEMS.length+" / "+ITEMS.length;
  if(window.speechSynthesis)speechSynthesis.cancel();
  document.getElementById('main').innerHTML=`<div class="card"><div class="result">
    <div style="font-size:1.1rem;color:var(--red-dark);font-weight:800;margin-bottom:8px;">听力测试完成 · Listening test complete</div>
    <div class="gauge">${score} / ${ITEMS.length}</div>
    <div class="note">${done<ITEMS.length?('You left '+(ITEMS.length-done)+' unanswered. '):''}This is your total only — which answers were right is in the teacher's answer key.</div>
    <div style="margin-top:16px;"><button class="btn" onclick="restart()">↺ Try again</button></div>
  </div></div>`;
}
document.addEventListener('DOMContentLoaded',()=>{render();
  console.log("© 2026 RRAruna Enterprises · ChineseFrench · Aruna's Classes.");});
</script></body></html>
