<script>
const SENT=[{"zh":"请问，这儿有到北京大学的公交车吗？","py":"Qǐngwèn, zhèr yǒu dào Běijīng Dàxué de gōngjiāochē ma?","en":"Excuse me, is there a bus from here to Peking University?"},{"zh":"有，但车站有点儿远。","py":"Yǒu, dàn chēzhàn yǒudiǎnr yuǎn.","en":"Yes, but the bus stop is a bit far."},{"zh":"这儿好打车吗？","py":"Zhèr hǎo dǎchē ma?","en":"Is it easy to get a taxi around here?"},{"zh":"谢谢，我们还是打车去吧。","py":"Xièxie, wǒmen háishi dǎchē qù ba.","en":"Thank you — let's take a taxi instead."},{"zh":"好，没问题。","py":"Hǎo, méi wèntí.","en":"All right, no problem."},{"zh":"学校里人真多啊！","py":"Xuéxiào li rén zhēn duō a!","en":"It's so crowded on campus!"},{"zh":"北京大学有四万多名学生呢！","py":"Běijīng Dàxué yǒu sìwàn duō míng xuésheng ne!","en":"Peking University has over forty thousand students!"},{"zh":"你是怎么知道的？","py":"Nǐ shì zěnme zhīdào de?","en":"How do you know?"},{"zh":"是网上说的。","py":"Shì wǎngshang shuō de.","en":"I read it online."},{"zh":"网上还说北京大学有三千多名外国学生。","py":"Wǎngshang hái shuō Běijīng Dàxué yǒu sānqiān duō míng wàiguó xuésheng.","en":"It also says online that Peking University has more than three thousand international students."},{"zh":"我也想来这儿学习。","py":"Wǒ yě xiǎng lái zhèr xuéxí.","en":"I'd love to study here too."},{"zh":"那边就有一间教室。","py":"Nàbiān jiù yǒu yì jiān jiàoshì.","en":"There's a classroom right over there."},{"zh":"我们去看一下吧。","py":"Wǒmen qù kàn yíxià ba.","en":"Let's go and have a look."},{"zh":"家月，你看，学校里有家电影院！","py":"Jiāyuè, nǐ kàn, xuéxiào li yǒu jiā diànyǐngyuàn!","en":"Jiayue, look — there's a cinema on campus!"},{"zh":"是啊，电影院还不小。","py":"Shì a, diànyǐngyuàn hái bù xiǎo.","en":"Yes, and the cinema is not small either."},{"zh":"他们卖的电影票也很便宜。","py":"Tāmen mài de diànyǐngpiào yě hěn piányi.","en":"The film tickets they sell are very cheap too."},{"zh":"天啊！有的还不到二十块钱。","py":"Tiān a! Yǒude hái bú dào èrshí kuài qián.","en":"Goodness! Some are less than twenty yuan."},{"zh":"那你想不想去看个电影？","py":"Nà nǐ xiǎng bu xiǎng qù kàn ge diànyǐng?","en":"So do you want to go and see a film?"},{"zh":"还是别看电影了。","py":"Háishi bié kàn diànyǐng le.","en":"Let's not watch a film after all."},{"zh":"北京大学就很好看！","py":"Běijīng Dàxué jiù hěn hǎokàn!","en":"Peking University itself is well worth seeing!"},{"zh":"北京大学很大，有四万多名学生。","py":"Běijīng Dàxué hěn dà, yǒu sìwàn duō míng xuésheng.","en":"Peking University is big; it has over forty thousand students."},{"zh":"学校很漂亮，里边还有家电影院。","py":"Xuéxiào hěn piàoliang, lǐbian hái yǒu jiā diànyǐngyuàn.","en":"The campus is beautiful, and there is even a cinema inside."},{"zh":"电影票也不贵。","py":"Diànyǐngpiào yě bú guì.","en":"The film tickets are not expensive either."},{"zh":"我们有时间还想再过来看个电影。","py":"Wǒmen yǒu shíjiān hái xiǎng zài guòlái kàn ge diànyǐng.","en":"When we have time we'd like to come back again to see a film."},{"zh":"教室里有二十多个学生。","py":"Jiàoshì li yǒu èrshí duō ge xuésheng.","en":"There are more than twenty students in the classroom."},{"zh":"那件衣服很好看，还是买那件吧。","py":"Nà jiàn yīfu hěn hǎokàn, háishi mǎi nà jiàn ba.","en":"That piece of clothing looks good — better buy that one."},{"zh":"你第一次去北京，还是找个人接你吧。","py":"Nǐ dì-yī cì qù Běijīng, háishi zhǎo ge rén jiē nǐ ba.","en":"It's your first time in Beijing — better find someone to meet you."},{"zh":"现在学中文的学生很多。","py":"Xiànzài xué Zhōngwén de xuésheng hěn duō.","en":"There are a lot of students learning Chinese nowadays."},{"zh":"打车太贵了，还是坐公交车吧。","py":"Dǎchē tài guì le, háishi zuò gōngjiāochē ba.","en":"A taxi is too expensive — let's take the bus instead."},{"zh":"我们还是明天再过来吧。","py":"Wǒmen háishi míngtiān zài guòlái ba.","en":"Let's come back again tomorrow instead."}];
const WORD=[{"zh":"请问","py":"qǐngwèn","en":"excuse me; may I ask"},{"zh":"您好","py":"nín hǎo","en":"hello (polite)"},{"zh":"表姐","py":"biǎojiě","en":"elder female cousin"},{"zh":"学生","py":"xuésheng","en":"student"},{"zh":"老师","py":"lǎoshī","en":"teacher"},{"zh":"学校","py":"xuéxiào","en":"school"},{"zh":"电话","py":"diànhuà","en":"telephone"},{"zh":"旅游","py":"lǚyóu","en":"to travel"},{"zh":"介绍","py":"jièshào","en":"to introduce"},{"zh":"东西","py":"dōngxi","en":"thing"},{"zh":"意思","py":"yìsi","en":"meaning"},{"zh":"已经","py":"yǐjīng","en":"already"},{"zh":"时间","py":"shíjiān","en":"time"},{"zh":"时候","py":"shíhou","en":"moment; time"},{"zh":"明天","py":"míngtiān","en":"tomorrow"},{"zh":"今天","py":"jīntiān","en":"today"},{"zh":"早上","py":"zǎoshang","en":"morning"},{"zh":"什么","py":"shénme","en":"what"},{"zh":"可以","py":"kěyǐ","en":"can; may"},{"zh":"帮忙","py":"bāngmáng","en":"to help out"},{"zh":"再见","py":"zàijiàn","en":"goodbye"},{"zh":"谢谢","py":"xièxie","en":"thank you"},{"zh":"客气","py":"kèqi","en":"polite; formal"},{"zh":"烤鸭","py":"kǎoyā","en":"roast duck"},{"zh":"北京","py":"Běijīng","en":"Beijing"},{"zh":"中文","py":"Zhōngwén","en":"Chinese (language)"},{"zh":"好吃","py":"hǎochī","en":"tasty"},{"zh":"第一","py":"dì-yī","en":"first"},{"zh":"你们","py":"nǐmen","en":"you (plural)"},{"zh":"我们","py":"wǒmen","en":"we; us"},{"zh":"他们","py":"tāmen","en":"they; them"},{"zh":"安妮","py":"Ānnī","en":"Annie"},{"zh":"这个","py":"zhège","en":"this one"},{"zh":"那个","py":"nàge","en":"that one"},{"zh":"很多","py":"hěn duō","en":"many; a lot"},{"zh":"不忙","py":"bù máng","en":"not busy"},{"zh":"有事","py":"yǒu shì","en":"to have something on"},{"zh":"在家","py":"zài jiā","en":"at home"},{"zh":"想来","py":"xiǎng lái","en":"to want to come"},{"zh":"一天","py":"yì tiān","en":"one day"}];
const MAXPTS=700;

/* ---------- pinyin grading: tones optional, spelling must be right ---------- */
const TONE={'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v','ń':'n','ň':'n','ǹ':'n','ḿ':'m'};
function norm(s){
  let t=String(s||'').toLowerCase().replace(/u:/g,'v');
  let o='';
  for(const ch of t) o += (TONE[ch]!==undefined?TONE[ch]:ch);
  o=o.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return o.replace(/[^a-z]/g,'');
}
function firstDiff(good,got){
  const n=Math.min(good.length,got.length);
  for(let i=0;i<n;i++) if(good[i]!==got[i]) return i;
  return good.length===got.length?-1:n;
}

/* ---------- state: 10 pts first try, 5 pts after a retry, 0 if revealed ---------- */
const sRes=SENT.map(()=>({st:null,pts:0}));   // st: null | 'ok' | 'miss' | 'shown'
const wRes=WORD.map(()=>({st:null,pts:0}));
function score(){let p=0;sRes.forEach(r=>p+=r.pts);wRes.forEach(r=>p+=r.pts);return p;}
function nRight(a){return a.filter(r=>r.st==='ok').length;}
function nTried(a){return a.filter(r=>r.st!==null).length;}
function grade(p){
  const pc=p/MAXPTS*100;
  if(pc>=90)return['优秀 Outstanding','🏆'];
  if(pc>=75)return['很好 Very good','🌟'];
  if(pc>=60)return['不错 Good','👍'];
  if(pc>0)  return['加油 Keep going','💪'];
  return['开始吧 Let\'s start','🚀'];
}
function board(){
  document.getElementById('vP').textContent=score()+' / '+MAXPTS;
  document.getElementById('vS').textContent=nRight(sRes)+' / '+SENT.length;
  document.getElementById('vW').textContent=nRight(wRes)+' / '+WORD.length;
  const t=nTried(sRes)+nTried(wRes), r=nRight(sRes)+nRight(wRes);
  document.getElementById('vA').textContent=t?Math.round(r/t*100)+'%':'—';
}

/* ---------- speech ---------- */
let zhVoice=null;
function pv(){try{const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh|Chinese/i.test(v.lang+v.name))||null;}catch(e){}}
if('speechSynthesis' in window){pv();speechSynthesis.onvoiceschanged=pv;}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.8;if(zhVoice)u.voice=zhVoice;speechSynthesis.speak(u);}catch(e){}}

/* ---------- tabs ---------- */
const TABS=[['sent','⌨️ 30 句 · 第二课'],['word','🧩 40 词 · 第一课'],['again','⚠️ 错题 Try again'],['all','📖 全部 All 70']];
const nav=document.getElementById('nav');
TABS.forEach((t,i)=>{const b=document.createElement('button');b.className='nt'+(i===0?' on':'');b.id='nt-'+t[0];b.textContent=t[1];b.onclick=()=>show(t[0]);nav.appendChild(b);});
function show(id){
  TABS.forEach(t=>{document.getElementById('nt-'+t[0]).classList.toggle('on',t[0]===id);document.getElementById('s-'+t[0]).classList.toggle('on',t[0]===id);});
  window.scrollTo(0,0);
  if(id==='again')drawAgain();
  if(id==='all')drawAll();
}

/* ================= SENTENCES ================= */
let si=0;
function renderSent(){
  const w=document.getElementById('s-sent');
  w.innerHTML='<div class="tip">Read the Mandarin sentence and type it in <b>pinyin</b>. '
   +'<b>Tone marks are not required</b> — <code>ni hao</code>, <code>ni3 hao3</code> and <code>nǐ hǎo</code> all count, and spaces do not matter. '
   +'The <b>spelling</b> must be right. Type <code>v</code> for ü (<code>lvyou</code> = lǚyóu). Press <b>Enter</b> to check.<br>'
   +'Scoring: <b class="pts">10</b> points first try · <b class="pts">5</b> points if you get it right after a miss · <b class="pts">0</b> if you press Show.</div>'
   +'<div class="meta"><span id="sm"></span><span id="ss"></span></div><div class="bar"><div class="barf" id="sbar"></div></div>'
   +'<div id="sq"></div>'
   +'<div class="navc"><button class="nbtn" id="sprev">← Prev</button><button class="nbtn" id="snext">Next →</button></div>'
   +'<div class="dots" id="sdots"></div>';
  w.querySelector('#sprev').onclick=()=>{if(si>0){si--;drawSent();}};
  w.querySelector('#snext').onclick=()=>{if(si<SENT.length-1){si++;drawSent();}};
  drawSent();
}
function drawSent(){
  const o=SENT[si];
  document.getElementById('sm').textContent='Sentence '+(si+1)+' / '+SENT.length;
  document.getElementById('ss').textContent='Score: '+score()+' / '+MAXPTS;
  document.getElementById('sbar').style.width=((si+1)/SENT.length*100)+'%';
  document.getElementById('sq').innerHTML='<div class="qcard"><div class="zh">'+o.zh+'</div>'
   +'<div class="ir">'
   +'<input class="inp" id="SI" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the pinyin — tones not needed">'
   +'<button class="btn bg" id="SC">Check ✓</button>'
   +'<button class="btn bs" id="SS">🔊</button>'
   +'<button class="btn bs" id="SH">Show</button>'
   +'</div><div class="ans" id="SA"></div></div>';
  document.getElementById('sprev').disabled=(si===0);
  document.getElementById('snext').disabled=(si===SENT.length-1);
  document.getElementById('SC').onclick=()=>gradeSent(false);
  document.getElementById('SH').onclick=()=>gradeSent(true);
  document.getElementById('SS').onclick=()=>say(o.zh);
  document.getElementById('SI').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return; e.preventDefault(); gradeSent(false);
    if(sRes[si].st==='ok' && si<SENT.length-1){si++;drawSent();}
  });
  drawSDots();
  const f=document.getElementById('SI'); if(f)f.focus();
}
function gradeSent(reveal){
  const o=SENT[si], r=sRes[si];
  const inp=document.getElementById('SI'), box=document.getElementById('SA');
  const good=norm(o.py), got=norm(inp.value);
  if(!got && !reveal){inp.focus();return;}
  const ok=!reveal && got===good;
  let earned=0;
  if(reveal){ if(r.st===null){r.st='shown';r.pts=0;} }
  else if(ok){
    if(r.st===null){r.st='ok';r.pts=10;earned=10;}
    else if(r.st==='miss'){r.st='ok';r.pts=5;earned=5;}
  } else if(r.st===null){ r.st='miss'; r.pts=0; }
  inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
  let extra='';
  if(!ok && got){
    const d=firstDiff(good,got);
    extra='<div class="yours">you typed: '+inp.value.trim()+(d>=0?'  ·  first difference at letter '+(d+1):'')+'</div>';
  }
  box.className='ans '+(ok?'ok':'no');
  box.innerHTML=(earned?'<span class="pt">+'+earned+'</span>':'')+(ok?'✓ ':'✗ ')
    +'<span class="py">'+o.py+'</span><div class="en">'+o.en+'</div>'+extra;
  say(o.zh); board(); drawSDots();
  document.getElementById('ss').textContent='Score: '+score()+' / '+MAXPTS;
}
function drawSDots(){
  const d=document.getElementById('sdots'); if(!d)return; d.innerHTML='';
  SENT.forEach((_,i)=>{
    const r=sRes[i];
    const cls=i===si?'cur':(r.st==='ok'?'done':(r.st===null?'':'part'));
    const e=document.createElement('div'); e.className='dot '+cls; e.title='Sentence '+(i+1);
    e.onclick=()=>{si=i;drawSent();}; d.appendChild(e);
  });
}

/* ================= WORDS ================= */
function renderWord(){
  const w=document.getElementById('s-word');
  w.innerHTML='<div class="tip">40 two-syllable words from <b>Lesson 1</b> — every character comes from that lesson. '
   +'Type each one in pinyin. Same rules: tones optional, spelling must be right, <code>v</code> for ü. '
   +'Scoring: <b class="pts">10</b> first try · <b class="pts">5</b> after a miss · <b class="pts">0</b> if shown.</div>'
   +'<div class="tools"><button class="btn bd" id="wall">Check all ✓</button><button class="btn bs" id="wshow">Show all answers</button><button class="btn bs" id="wclr">Clear typing</button></div>'
   +'<div class="meta"><span id="wm"></span><span id="ws"></span></div><div class="bar"><div class="barf" id="wbar"></div></div>'
   +'<div class="grid" id="wgrid"></div>';
  document.getElementById('wgrid').innerHTML=WORD.map((o,i)=>
     '<div class="wc"><span class="wn">'+(i+1)+'</span><div class="wz">'+o.zh+'</div>'
    +'<div class="wi"><input id="WI'+i+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="pinyin">'
    +'<button data-w="'+i+'">✓</button><button data-s="'+i+'" style="background:#eef1f6;color:#475569">🔊</button></div>'
    +'<div class="wa" id="WA'+i+'"></div></div>').join('');
  const g=document.getElementById('wgrid');
  g.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>gradeWord(+b.dataset.w,false));
  g.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(WORD[+b.dataset.s].zh));
  WORD.forEach((_,i)=>{
    document.getElementById('WI'+i).addEventListener('keydown',e=>{
      if(e.key!=='Enter')return; e.preventDefault(); gradeWord(i,false);
      const nx=document.getElementById('WI'+(i+1)); if(nx)nx.focus();
    });
  });
  document.getElementById('wall').onclick=()=>{WORD.forEach((_,i)=>{if(document.getElementById('WI'+i).value.trim())gradeWord(i,false);});};
  document.getElementById('wshow').onclick=()=>{WORD.forEach((_,i)=>gradeWord(i,true));};
  document.getElementById('wclr').onclick=()=>{WORD.forEach((_,i)=>{const e=document.getElementById('WI'+i);e.value='';e.classList.remove('ok','no');document.getElementById('WA'+i).className='wa';});};
  wMeta();
}
function gradeWord(i,reveal){
  const o=WORD[i], r=wRes[i];
  const inp=document.getElementById('WI'+i), box=document.getElementById('WA'+i);
  const good=norm(o.py), got=norm(inp.value);
  if(!got && !reveal) return;
  const ok=!reveal && got===good;
  let earned=0;
  if(reveal){ if(r.st===null){r.st='shown';r.pts=0;} }
  else if(ok){
    if(r.st===null){r.st='ok';r.pts=10;earned=10;}
    else if(r.st==='miss'){r.st='ok';r.pts=5;earned=5;}
  } else if(r.st===null){ r.st='miss'; r.pts=0; }
  inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
  box.className='wa '+(ok?'ok':'no');
  box.innerHTML=(earned?'<span style="float:right">+'+earned+'</span>':'')+(ok?'✓ ':'✗ ')+o.py+'<div class="e">'+o.en+'</div>';
  board(); wMeta();
}
function wMeta(){
  const m=document.getElementById('wm'); if(!m)return;
  m.textContent='Words right: '+nRight(wRes)+' / '+WORD.length;
  document.getElementById('ws').textContent='Score: '+score()+' / '+MAXPTS;
  document.getElementById('wbar').style.width=(nTried(wRes)/WORD.length*100)+'%';
}

/* ================= TRY AGAIN ================= */
function drawAgain(){
  const w=document.getElementById('s-again');
  const g=grade(score());
  let h='<div class="report"><div class="sm">得分 YOUR SCORE</div><div class="big">'+score()+' / '+MAXPTS+'</div>'
   +'<div class="gr">'+g[1]+' '+g[0]+'</div>'
   +'<div class="sm" style="margin-top:6px">Sentences '+nRight(sRes)+'/'+SENT.length+' · Words '+nRight(wRes)+'/'+WORD.length+'</div>'
   +'<button class="rb" id="reset">↺ Start again from zero</button></div>';
  const miss=[];
  sRes.forEach((r,i)=>{if(r.st==='miss'||r.st==='shown')miss.push(['S',i]);});
  wRes.forEach((r,i)=>{if(r.st==='miss'||r.st==='shown')miss.push(['W',i]);});
  if(!miss.length){
    w.innerHTML=h+'<div class="tip">Anything you miss on the first try lands here so you can redo it. Getting it right here is worth <b class="pts">5</b> points.</div>'
      +'<div class="empty">Nothing to redo yet 🎉</div>';
    document.getElementById('reset').onclick=doReset; return;
  }
  h+='<div class="tip">The items you missed on the first attempt. Type them again — a correct answer here scores <b class="pts">5</b> and clears it from the list.</div><div id="aq"></div>';
  w.innerHTML=h;
  document.getElementById('reset').onclick=doReset;
  document.getElementById('aq').innerHTML=miss.map(([k,i])=>{
    const o=(k==='S'?SENT:WORD)[i];
    return '<div class="qcard" style="margin-bottom:11px">'
      +'<div class="meta"><span>'+(k==='S'?'Sentence ':'Word ')+(i+1)+'</span><span></span></div>'
      +'<div class="zh">'+o.zh+'</div>'
      +'<div class="ir"><input class="inp" id="R'+k+i+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the pinyin again">'
      +'<button class="btn bg" data-r="'+k+i+'">Check ✓</button>'
      +'<button class="btn bs" data-s2="'+k+i+'">🔊</button></div>'
      +'<div class="ans" id="RA'+k+i+'"></div></div>';
  }).join('');
  const q=document.getElementById('aq');
  q.querySelectorAll('[data-s2]').forEach(b=>{const k=b.dataset.s2[0],i=+b.dataset.s2.slice(1);b.onclick=()=>say((k==='S'?SENT:WORD)[i].zh);});
  q.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.r[0], i=+b.dataset.r.slice(1);
    const arr=(k==='S'?SENT:WORD), res=(k==='S'?sRes:wRes), o=arr[i];
    const inp=document.getElementById('R'+k+i), box=document.getElementById('RA'+k+i);
    const ok=norm(inp.value)===norm(o.py);
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
    box.className='ans '+(ok?'ok':'no');
    box.innerHTML=(ok?'<span class="pt">+5</span>✓ ':'✗ ')+'<span class="py">'+o.py+'</span><div class="en">'+o.en+'</div>';
    say(o.zh);
    if(ok){ res[i].st='ok'; res[i].pts=5; board(); setTimeout(drawAgain,900); }
  });
}
function doReset(){
  sRes.forEach(r=>{r.st=null;r.pts=0;});
  wRes.forEach(r=>{r.st=null;r.pts=0;});
  si=0; board(); renderSent(); renderWord(); drawAgain();
}

/* ================= ALL ================= */
function drawAll(f){
  const w=document.getElementById('s-all');
  if(!document.getElementById('flt')){
    w.innerHTML='<div class="tip">The answer key — all 30 sentences and 40 words with pinyin and meaning. Filter by any Chinese character, pinyin syllable or English word.</div>'
      +'<input class="search" id="flt" placeholder="filter — try  电影  ·  dache  ·  classroom">'
      +'<div id="alist"></div>';
    document.getElementById('flt').addEventListener('input',e=>drawAll(e.target.value));
  }
  const q=(f||'').trim().toLowerCase();
  const hit=o=>{if(!q)return true;const h=(o.zh+o.py+o.en).toLowerCase();return h.includes(q)||norm(h).includes(norm(q));};
  const sRows=SENT.map((o,i)=>({o,i})).filter(({o})=>hit(o));
  const wRows=WORD.map((o,i)=>({o,i})).filter(({o})=>hit(o));
  const row=({o,i})=>'<div class="ln"><span class="num">'+(i+1)+'</span><div class="bdy"><div class="z">'+o.zh+'</div>'
      +'<div class="p">'+o.py+'</div><div class="e">'+o.en+'</div></div><button class="spk" data-s="'+o.zh+'">🔊</button></div>';
  let h='';
  if(sRows.length) h+='<div class="lst"><div class="h">第二课 · 30 句 Sentences</div>'+sRows.map(row).join('')+'</div>';
  if(wRows.length) h+='<div class="lst"><div class="h">第一课 · 40 词 Two-syllable words</div>'+wRows.map(row).join('')+'</div>';
  const list=document.getElementById('alist');
  list.innerHTML=h||'<div class="empty">Nothing matches “'+(f||'')+'”</div>';
  list.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(b.dataset.s));
}

/* init */
board(); renderSent(); renderWord();
</script>
</body>
</html>
