<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Modelltest 14 — B1/B2 Wortschatz-Training</title>
<style>
:root{
  --ink:#22303a;
  --paper:#faf7f0;
  --card:#ffffff;
  --border:#22303a;
  --accent:#2f6b3a;
  --accent-2:#d4553f;
  --blue:#2f7d95;
  --orange:#f2a83c;
  --muted:#6b7a85;
  --shadow:0 6px 0 rgba(34,48,58,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:78px;}

/* Top bar */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;background:var(--card);
  border-bottom:2px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.topbar .mascot{font-size:28px;}
.topbar .title{font-weight:800;font-size:16px;flex:1;line-height:1.15;}
.topbar .title small{display:block;font-weight:500;color:var(--muted);font-size:11px;}
.star-count{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;color:var(--orange);}
.toggle-btn{
  border:2px solid var(--border);border-radius:20px;background:var(--card);
  padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
  white-space:nowrap;
}
.toggle-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Tabs */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;background:var(--card);border-top:2px solid var(--border);
  max-width:760px;margin:0 auto;
}
.tabbar button{
  flex:1;border:none;background:none;padding:10px 4px 8px;
  font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tabbar button .ic{font-size:20px;}
.tabbar button.active{color:var(--accent);}
.tabbar button.active .ic{transform:scale(1.1);}

.panel{display:none;flex:1;flex-direction:column;padding:14px 16px 20px;}
.panel.active{display:flex;}

/* Story / text tab */
.dots{display:flex;justify-content:center;gap:7px;margin:6px 0 12px;flex-wrap:wrap;}
.dot{
  width:11px;height:11px;border-radius:50%;border:2px solid var(--border);
  background:#fff;cursor:pointer;
}
.dot.visited{background:var(--blue);border-color:var(--blue);}
.dot.current{background:var(--orange);border-color:var(--orange);transform:scale(1.25);}

.scene-card{
  border:2px solid var(--border);border-radius:16px;overflow:hidden;
  box-shadow:var(--shadow);background:#fff;
}
.scene-card svg{display:block;width:100%;height:auto;}

.page-meta{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:12px 0 4px;
}
.page-meta .who{font-weight:800;font-size:14px;}
.page-meta .who span{color:var(--muted);font-weight:600;}
.page-num{font-size:12px;color:var(--muted);font-weight:700;}

.de-text{
  font-size:19px;line-height:1.5;font-weight:600;margin:8px 0 6px;
}
.en-text{
  font-size:14.5px;line-height:1.45;color:var(--muted);
  border-left:3px solid var(--blue);padding-left:10px;margin:6px 0 10px;
}
.en-text.hidden{display:none;}

.expr-box{
  background:#fff7e6;border:2px dashed var(--orange);border-radius:12px;
  padding:10px 12px;margin:8px 0 14px;font-size:13px;
}
.expr-box .lbl{font-weight:800;color:#a06a12;margin-bottom:3px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.expr-box .de{font-weight:700;}
.expr-box .en{color:var(--muted);}
.expr-box .ex{margin-top:6px;font-style:italic;font-size:12.5px;}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px;}
.btn{
  border:2px solid var(--border);background:var(--card);border-radius:12px;
  padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);
  box-shadow:0 3px 0 rgba(34,48,58,0.12);
}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.play{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn.wide{flex:1;text-align:center;}
.btn:disabled{opacity:.45;cursor:default;}

.word-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip{
  border:2px solid var(--border);border-radius:12px;background:#fff;
  padding:7px 10px;cursor:pointer;text-align:left;min-width:120px;
  box-shadow:0 2px 0 rgba(34,48,58,0.1);
}
.chip:active{transform:translateY(1px);}
.chip b{display:block;font-size:14px;}
.chip small{color:var(--muted);font-size:11.5px;}

/* Vocab tab */
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.pill{
  border:2px solid var(--border);border-radius:20px;background:#fff;
  padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.vocab-grid{grid-template-columns:1fr;}}
.vcard{
  border:2px solid var(--border);border-radius:12px;background:#fff;padding:10px 12px;
  cursor:pointer;box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.vcard b{font-size:15px;}
.vcard .m{color:var(--muted);font-size:13px;margin-top:2px;}
.vcard .src{font-size:10.5px;color:#9fae7a;margin-top:4px;font-weight:700;}

/* Quiz tab */
.setup-block{margin-bottom:14px;}
.setup-block .lbl{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:6px;}
.choice-row{display:flex;flex-wrap:wrap;gap:8px;}
.choice-btn{
  border:2px solid var(--border);border-radius:12px;background:#fff;
  padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;
}
.choice-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.progress-wrap{margin:6px 0 14px;}
.progress-bar-bg{height:10px;border-radius:6px;background:#eee;border:2px solid var(--border);overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .25s;}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px;}

.prompt-card{
  border:2px solid var(--border);border-radius:16px;background:#fff;padding:22px 16px;
  text-align:center;margin-bottom:14px;box-shadow:var(--shadow);
}
.prompt-card .kind{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.prompt-card .word{font-size:26px;font-weight:800;}
.prompt-card .listen-btn{margin-top:10px;}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:560px){.options-grid{grid-template-columns:1fr;}}
.opt-btn{
  border:2px solid var(--border);border-radius:12px;background:#fff;
  padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.opt-btn.correct{background:#dff0d8;border-color:var(--accent);color:var(--accent);}
.opt-btn.wrong{background:#fbe0da;border-color:var(--accent-2);color:var(--accent-2);}
.opt-btn:disabled{cursor:default;}

.feedback{
  margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;
}
.feedback.good{background:#dff0d8;color:var(--accent);}
.feedback.bad{background:#fbe0da;color:var(--accent-2);}

.results-card{text-align:center;padding:20px 14px;}
.results-card .pct{font-size:42px;font-weight:800;margin:6px 0;}
.results-card .stars{font-size:34px;margin-bottom:10px;}
.results-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px;}

/* Review tab */
.review-item{
  border:2px solid var(--border);border-radius:12px;background:#fff;padding:10px 12px;
  margin-bottom:10px;box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.review-item .top{display:flex;justify-content:space-between;align-items:center;}
.review-item b{font-size:15px;}
.review-item .count{background:var(--accent-2);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:800;}
.review-item .m{color:var(--muted);font-size:13px;margin-top:3px;}
.review-item .wrong-choice{font-size:12px;color:var(--accent-2);margin-top:3px;}
.review-item .spk{margin-top:6px;}
.empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}

.footer-note{
  text-align:center;color:var(--muted);font-size:11px;padding:14px 0 4px;
}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;
  z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.small-icon-btn{
  border:2px solid var(--border);background:#fff;border-radius:10px;
  padding:5px 9px;cursor:pointer;font-size:14px;
}

/* Insert-sentence cards (highlighted gap-fill answers) */
.insert-box{
  background:#e8f2fb;border:2px solid var(--blue);border-radius:12px;
  padding:10px 12px;margin:8px 0;font-size:13px;
}
.insert-box .lbl{font-weight:800;color:#1f5b70;margin-bottom:3px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.insert-box .de{font-weight:700;}
.insert-box .en{color:var(--muted);}
.insert-box .why{margin-top:6px;font-style:italic;font-size:12.5px;color:#1f5b70;}

/* Solution table */
.solution-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.solution-table th,.solution-table td{border:2px solid var(--border);padding:6px 8px;text-align:left;}
.solution-table th{background:#eef3fb;}
.unused-box{
  background:#fbe9e9;border:2px dashed var(--accent-2);border-radius:12px;
  padding:10px 12px;margin:8px 0;font-size:13px;
}
.unused-box .lbl{font-weight:800;color:#a03a2c;margin-bottom:3px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}

/* Embedded multiple-choice comprehension question (Lesen Teil 3) */
.mc-card{
  border:2px solid var(--border);border-radius:16px;background:#fff;
  padding:14px;margin:10px 0 14px;box-shadow:var(--shadow);
}
.mc-card .mc-num{
  display:inline-block;background:var(--blue);color:#fff;font-weight:800;
  border-radius:20px;padding:3px 12px;font-size:12.5px;margin-bottom:8px;
}
.mc-card .mc-q-de{font-weight:700;font-size:15.5px;margin-bottom:3px;}
.mc-card .mc-q-en{color:var(--muted);font-size:13px;margin-bottom:12px;}
.mc-option{
  display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;
  border:2px solid var(--border);border-radius:12px;background:#fff;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;
  box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.mc-option .k{font-weight:800;flex-shrink:0;}
.mc-option .txt{flex:1;}
.mc-option .txt .en{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
.mc-option.correct{background:#dff0d8;border-color:var(--accent);}
.mc-option.wrong{background:#fbe0da;border-color:var(--accent-2);}
.mc-option:disabled{cursor:default;}
.mc-feedback{
  margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:13.5px;
}
.mc-feedback.good{background:#dff0d8;color:var(--accent);}
.mc-feedback.bad{background:#fbe0da;color:var(--accent-2);}
.mc-referral{
  margin-top:10px;background:#eef3fb;border:2px dashed var(--blue);border-radius:12px;
  padding:10px 12px;font-size:13px;
}
.mc-referral .lbl{font-weight:800;color:#1f5b70;margin-bottom:4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.mc-referral .quote{font-style:italic;font-weight:600;}
.mc-referral .quote-en{color:var(--muted);margin-top:2px;}
.mc-why-list{margin-top:8px;font-size:12.5px;color:var(--muted);}
.mc-why-list div{margin-bottom:3px;}

/* Heading-matching question (Lesen Teil 5) */
.match-options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:420px){.match-options-grid{grid-template-columns:1fr;}}
.match-option{
  display:flex;flex-direction:column;gap:2px;text-align:left;
  border:2px solid var(--border);border-radius:12px;background:#fff;
  padding:9px 11px;cursor:pointer;font-size:13.5px;
  box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.match-option .k{font-weight:800;}
.match-option .en{color:var(--muted);font-size:11.5px;}
.match-option.correct{background:#dff0d8;border-color:var(--accent);}
.match-option.wrong{background:#fbe0da;border-color:var(--accent-2);}
.match-option:disabled{cursor:default;}
.evidence-list{margin-top:8px;}
.evidence-list .ev{
  font-style:italic;font-weight:600;margin-bottom:3px;font-size:13px;
}
.category-tag{
  display:inline-block;background:#f2a83c;color:#5a3a00;font-weight:800;
  border-radius:20px;padding:3px 12px;font-size:11.5px;margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.03em;
}
.trick-box{
  background:#fff7e6;border:2px dashed var(--orange);border-radius:12px;
  padding:10px 12px;margin:10px 0;font-size:13px;
}

/* Mixed vocab practice — mode cards, topic pills, match-the-following grid */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:420px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{
  border:2px solid var(--border);border-radius:14px;background:#fff;
  padding:12px;cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.mode-card .ic{font-size:22px;}
.mode-card b{display:block;font-size:14px;margin-top:4px;}
.mode-card small{color:var(--muted);font-size:11.5px;}
.mode-card.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.mode-card.active small{color:#e5f3e8;}

.topic-pill{
  border:2px solid var(--border);border-radius:20px;background:#fff;
  padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
}
.topic-pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.match-header{
  display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;
  color:var(--muted);margin-bottom:8px;
}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.match-col{display:flex;flex-direction:column;gap:8px;}
.match-tile{
  border:2px solid var(--border);border-radius:12px;background:#fff;
  padding:10px 10px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;
  min-height:44px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(34,48,58,0.1);
}
.match-tile.selected{border-color:var(--blue);background:#eaf3fb;}
.match-tile.matched{background:#dff0d8;border-color:var(--accent);color:var(--accent);opacity:0.55;cursor:default;}
.match-tile.wrong-flash{background:#fbe0da;border-color:var(--accent-2);}
.match-tile:disabled{cursor:default;}
.match-progress{
  text-align:center;font-weight:800;font-size:14px;margin:10px 0;color:var(--muted);
}

</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="mascot">📘</div>
    <div class="title">Modelltest 14 — Wortschatz
      <small>Lesen Teil 1–4 · Nur B1/B2-Niveau</small>
    </div>
    <div class="star-count">⭐ <span id="starCount">0</span></div>
  </div>

  <!-- VOCAB BROWSE PANEL -->
  <div class="panel active" id="panel-vocab">
    <div class="filter-pills" id="vocabPills"></div>
    <div class="vocab-grid" id="vocabGrid"></div>
  </div>

  <!-- PRACTICE PANEL -->
  <div class="panel" id="panel-practice">
    <div id="practiceSetup">
      <div class="setup-block">
        <div class="lbl">Übungsart</div>
        <div class="mode-grid" id="modeGrid"></div>
      </div>
      <div class="setup-block">
        <div class="lbl">Teile</div>
        <div class="choice-row" id="topicPills"></div>
      </div>
      <div class="setup-block">
        <div class="lbl">Länge</div>
        <div class="choice-row" id="lengthChoices"></div>
      </div>
      <button class="btn primary wide" id="btnStartPractice">Start</button>
    </div>

    <div id="mcPlay" style="display:none;">
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progFill"></div></div>
        <div class="progress-labels">
          <span id="progLabel">Frage 1 / 10</span>
          <span id="scoreLabel">0 Punkte</span>
        </div>
      </div>
      <div class="prompt-card">
        <div class="kind" id="promptKind"></div>
        <div class="word" id="promptWord"></div>
        <button class="btn play listen-btn" id="btnPromptListen" style="display:none;">🔊 Hören</button>
      </div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback" id="feedback" style="display:none;"></div>
    </div>

    <div id="practiceResults" style="display:none;">
      <div class="results-card">
        <div class="lbl" id="resultsLabel">Ergebnis</div>
        <div class="pct" id="resultPct"></div>
        <div id="resultScore"></div>
        <div class="stars" id="resultStars"></div>
        <div class="results-actions">
          <button class="btn primary wide" id="btnPracticeMistakes">Meine Fehler üben</button>
          <button class="btn wide" id="btnAgain">Nochmal</button>
          <button class="btn wide" id="btnNewPractice">Neue Übung</button>
        </div>
      </div>
    </div>
  </div>

  <!-- REVIEW PANEL -->
  <div class="panel" id="panel-review">
    <div id="reviewList"></div>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="vocab"><span class="ic">🔤</span>Vokabeln</button>
    <button class="tab-btn" data-tab="practice"><span class="ic">🎯</span>Üben</button>
    <button class="tab-btn" data-tab="review"><span class="ic">🔁</span>Wiederholen</button>
  </div>
</div>

<script>
const TOPICS = [
  { key: "Teil1", label: "Teil 1", full: "Erfahrungen mit Hörgeräten" },
  { key: "Teil2", label: "Teil 2", full: "Gedächtnistraining" },
  { key: "Teil3", label: "Teil 3", full: "Lachkurse sind hoch im Trend" },
  { key: "Teil4", label: "Teil 4", full: "Zusatzstoffe in Lebensmitteln" }
];

const VOCAB = [
  // ===== TEIL 1 — Erfahrungen mit Hörgeräten =====
  { de: "das Forum", en: "forum", topics: ["Teil1"] },
  { de: "der Kommentar", en: "comment", topics: ["Teil1"] },
  { de: "das Hörgerät", en: "hearing aid", topics: ["Teil1"] },
  { de: "auf jemanden/etwas zutreffen", en: "to apply to someone/something", topics: ["Teil1"] },
  { de: "die Aussage", en: "statement", topics: ["Teil1"] },
  { de: "mehrmals", en: "several times / more than once", topics: ["Teil1"] },
  { de: "die Anschaffung", en: "purchase / acquisition", topics: ["Teil1"] },
  { de: "überwiegend", en: "mainly / predominantly", topics: ["Teil1"] },
  { de: "es geht darum, ... zu + Infinitiv", en: "it is about / the aim is to ...", topics: ["Teil1"] },
  { de: "weiterhin", en: "still / continuing to", topics: ["Teil1"] },
  { de: "genießen", en: "to enjoy", topics: ["Teil1"] },
  { de: "der Wunsch", en: "wish / desire", topics: ["Teil1"] },
  { de: "der Klang", en: "sound", topics: ["Teil1"] },
  { de: "abdecken", en: "to cover / meet / satisfy", topics: ["Teil1"] },
  { de: "einen Wunsch abdecken", en: "to meet/satisfy a need or desire", topics: ["Teil1"] },
  { de: "der Akustiker", en: "hearing-aid specialist", topics: ["Teil1"] },
  { de: "enttäuschend", en: "disappointing", topics: ["Teil1"] },
  { de: "das Bedürfnis", en: "need", topics: ["Teil1", "Teil2"] },
  { de: "gedeckt werden", en: "to be met / satisfied", topics: ["Teil1"] },
  { de: "wahrscheinlich", en: "probably", topics: ["Teil1"] },
  { de: "unmöglich", en: "impossible", topics: ["Teil1"] },
  { de: "befriedigend", en: "satisfactory", topics: ["Teil1"] },
  { de: "Bedürfnisse decken", en: "to meet/satisfy needs", topics: ["Teil1"] },
  { de: "die Beratung", en: "consultation / advice", topics: ["Teil1"] },
  { de: "hervorragend", en: "excellent / outstanding", topics: ["Teil1"] },

<script>
(function () {
  "use strict";

  // ---------- state ----------
  let starCount = 0;

  const mistakes = new Map(); // key: de.toLowerCase() -> {de,en,count,lastWrong}

  // ---------- speech ----------
  function pickVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    deVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("de")) || null;
  }
  if (window.speechSynthesis) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  let voiceWarned = false;
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  function speak(text, rate, onend) {
    if (!window.speechSynthesis) {
      if (!voiceWarned) { toast("Sprachausgabe wird auf diesem Gerät nicht unterstützt."); voiceWarned = true; }
      if (onend) onend();
      return;
    }
    if (!deVoice && !voiceWarned) {
      toast("Keine deutsche Stimme gefunden — der Text bleibt trotzdem sichtbar.");
      voiceWarned = true;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    if (deVoice) u.voice = deVoice;
    u.rate = rate || 1;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  }

  // ---------- tone feedback ----------
  let actx = null;
  function tone(freqs, dur) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      let t = actx.currentTime;
      freqs.forEach((f) => {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.frequency.value = f;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(actx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        t += dur * 0.55;
      });
    } catch (e) { /* ignore */ }
  }
  const goodTone = () => tone([660, 880, 1180], 0.14);
  const badTone = () => tone([300, 200], 0.16);

  // ---------- tabs ----------
  const panels = {
    vocab: document.getElementById("panel-vocab"),
    practice: document.getElementById("panel-practice"),
    review: document.getElementById("panel-review")
  };
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      Object.values(panels).forEach(p => p.classList.remove("active"));
      panels[btn.dataset.tab].classList.add("active");
      if (btn.dataset.tab === "vocab") renderVocabBrowse();
      if (btn.dataset.tab === "review") renderReview();
    });
  });
  function goToTab(name) {
    document.querySelector(`.tab-btn[data-tab="${name}"]`).click();
  }

  // ---------- top bar ----------
  const starCountEl = document.getElementById("starCount");
  function addStar(n) {
    starCount += n;
    starCountEl.textContent = starCount;
  }

  // ---------- vocab browse tab ----------
  let vocabFilter = "Alle";
  function topicLabel(key) {
    const t = TOPICS.find(x => x.key === key);
    return t ? t.label : key;
  }
  function renderVocabPills() {
    const pillsEl = document.getElementById("vocabPills");
    pillsEl.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.className = "pill" + (vocabFilter === "Alle" ? " active" : "");
    allBtn.textContent = "Alle";
    allBtn.addEventListener("click", () => { vocabFilter = "Alle"; renderVocabBrowse(); });
    pillsEl.appendChild(allBtn);
    TOPICS.forEach(t => {
      const p = document.createElement("button");
      p.className = "pill" + (vocabFilter === t.key ? " active" : "");
      p.textContent = t.label;
      p.addEventListener("click", () => { vocabFilter = t.key; renderVocabBrowse(); });
      pillsEl.appendChild(p);
    });
  }
  function renderVocabBrowse() {
    renderVocabPills();
    const grid = document.getElementById("vocabGrid");
    grid.innerHTML = "";
    const items = VOCAB.filter(v => vocabFilter === "Alle" || v.topics.includes(vocabFilter));
    items.forEach(v => {
      const c = document.createElement("div");
      c.className = "vcard";
      c.innerHTML = `<b>${v.de}</b><div class="m">${v.en}</div><div class="src">${v.topics.map(topicLabel).join(", ")}</div>`;
      c.addEventListener("click", () => speak(v.de, 1));
      grid.appendChild(c);
    });
  }

  // ---------- practice setup ----------
  const MODES = [
    { id: "listen-en", ic: "🔊", label: "Hören → EN", sub: "Listen, choose English" },
    { id: "de-en", ic: "🇩🇪→🇬🇧", label: "DE → EN", sub: "Choose English" },
    { id: "en-de", ic: "🇬🇧→🇩🇪", label: "EN → DE", sub: "Choose German" },
    { id: "synonyms", ic: "🔁", label: "Synonyme", sub: "Choose the German synonym" }
  ];
  let practiceMode = "de-en";
  let selectedTopics = TOPICS.map(t => t.key);
  let practiceLength = 10;

  function renderModeGrid() {
    const el = document.getElementById("modeGrid");
    el.innerHTML = "";
    MODES.forEach(m => {
      const c = document.createElement("button");
      c.className = "mode-card" + (practiceMode === m.id ? " active" : "");
      c.innerHTML = `<span class="ic">${m.ic}</span><b>${m.label}</b><small>${m.sub}</small>`;
      c.addEventListener("click", () => { practiceMode = m.id; renderModeGrid(); });
      el.appendChild(c);
    });
  }
  function renderTopicPills() {
    const el = document.getElementById("topicPills");
    el.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.className = "topic-pill" + (selectedTopics.length === TOPICS.length ? " active" : "");
    allBtn.textContent = "Alle";
    allBtn.addEventListener("click", () => { selectedTopics = TOPICS.map(t => t.key); renderTopicPills(); });
    el.appendChild(allBtn);
    TOPICS.forEach(t => {
      const b = document.createElement("button");
      b.className = "topic-pill" + (selectedTopics.includes(t.key) ? " active" : "");
      b.textContent = t.label;
      b.addEventListener("click", () => {
        if (selectedTopics.includes(t.key)) {
          if (selectedTopics.length === 1) { toast("Mindestens ein Teil muss ausgewählt sein."); return; }
          selectedTopics = selectedTopics.filter(k => k !== t.key);
        } else {
          selectedTopics = [...selectedTopics, t.key];
        }
        renderTopicPills();
      });
      el.appendChild(b);
    });
  }
  function renderLengthChoices() {
    const el = document.getElementById("lengthChoices");
    el.innerHTML = "";
    [10, 20, 40, "all"].forEach(n => {
      const b = document.createElement("button");
      b.className = "choice-btn" + (practiceLength === n ? " active" : "");
      b.textContent = n === "all" ? "Alle" : n;
      b.addEventListener("click", () => { practiceLength = n; renderLengthChoices(); });
      el.appendChild(b);
    });
  }
  renderModeGrid(); renderTopicPills(); renderLengthChoices();

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function filteredPool() {
    return VOCAB.filter(v => v.topics.some(t => selectedTopics.includes(t)));
  }
  function filteredSynonymPool() {
    return SYNONYMS.filter(p => p.topics.some(t => selectedTopics.includes(t)))
      .map(p => ({ de: p.a, en: p.b, gloss: p.en }));
  }

  document.getElementById("btnStartPractice").addEventListener("click", () => startMc());

  // ---------- MC-style practice (listen-en, en-de, de-en, synonyms) ----------
  let mcQuestions = [], mcIdx = 0, mcScore = 0, mcAnswered = false, mcScopeIsMistakes = false;

  function startMc(fromMistakes) {
    mcScopeIsMistakes = !!fromMistakes;
    let pool;
    if (fromMistakes) pool = Array.from(mistakes.values());
    else if (practiceMode === "synonyms") pool = filteredSynonymPool();
    else pool = filteredPool();
    if (pool.length < 4) {
      toast("Zu wenige Einträge für diese Auswahl — wähle mehr Teile.");
      return;
    }
    pool = shuffle(pool);
    const n = practiceLength === "all" ? pool.length : Math.min(practiceLength, pool.length);
    mcQuestions = pool.slice(0, n);
    mcIdx = 0; mcScore = 0;
    document.getElementById("practiceSetup").style.display = "none";
    document.getElementById("practiceResults").style.display = "none";
    document.getElementById("mcPlay").style.display = "block";
    showMcQuestion();
  }

  function buildMcOptions(answer) {
    if (practiceMode === "synonyms") {
      const distractPool = shuffle(SYNONYMS.filter(p => p.b.toLowerCase() !== answer.en.toLowerCase()));
      const chosen = [];
      const seen = new Set();
      for (const p of distractPool) {
        const low = p.b.toLowerCase();
        if (seen.has(low)) continue;
        seen.add(low);
        chosen.push(p.b);
        if (chosen.length === 3) break;
      }
      return shuffle([{ label: answer.en, correct: true }, ...chosen.map(label => ({ label, correct: false }))]);
    }
    const distractPool = shuffle(VOCAB.filter(w => w.de.toLowerCase() !== answer.de.toLowerCase() && w.en.toLowerCase() !== answer.en.toLowerCase()));
    const wantsGerman = practiceMode === "en-de";
    const chosen = [];
    const seen = new Set();
    for (const w of distractPool) {
      const label = wantsGerman ? w.de : w.en;
      const low = label.toLowerCase();
      if (seen.has(low)) continue;
      seen.add(low);
      chosen.push(w);
      if (chosen.length === 3) break;
    }
    const answerLabel = wantsGerman ? answer.de : answer.en;
    return shuffle([{ label: answerLabel, correct: true }, ...chosen.map(w => ({ label: wantsGerman ? w.de : w.en, correct: false }))]);
  }

  function showMcQuestion() {
    mcAnswered = false;
    const q = mcQuestions[mcIdx];
    document.getElementById("progFill").style.width = `${(mcIdx / mcQuestions.length) * 100}%`;
    document.getElementById("progLabel").textContent = `Frage ${mcIdx + 1} / ${mcQuestions.length}`;
    document.getElementById("scoreLabel").textContent = `${mcScore} Punkte`;
    document.getElementById("feedback").style.display = "none";

    const kindEl = document.getElementById("promptKind");
    const wordEl = document.getElementById("promptWord");
    const listenBtn = document.getElementById("btnPromptListen");

    if (practiceMode === "de-en") {
      kindEl.textContent = "Was bedeutet dieses Wort?";
      wordEl.textContent = q.de;
      listenBtn.style.display = "inline-block";
    } else if (practiceMode === "en-de") {
      kindEl.textContent = "Wie sagt man das auf Deutsch?";
      wordEl.textContent = q.en;
      listenBtn.style.display = "none";
    } else if (practiceMode === "synonyms") {
      kindEl.textContent = "Welches Wort bedeutet (fast) dasselbe?";
      wordEl.textContent = q.de;
      listenBtn.style.display = "inline-block";
    } else {
      kindEl.textContent = "Hör zu und wähle die richtige Bedeutung";
      wordEl.textContent = "🔊";
      listenBtn.style.display = "inline-block";
    }
    listenBtn.onclick = () => speak(q.de, 1);
    if (practiceMode === "listen-en") speak(q.de, 1);

    const options = buildMcOptions(q);
    const grid = document.getElementById("optionsGrid");
    grid.innerHTML = "";
    options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = opt.label;
      b.addEventListener("click", () => onMcAnswer(b, opt, q, options, grid));
      grid.appendChild(b);
    });
  }

  function onMcAnswer(btn, opt, q, options, grid) {
    if (mcAnswered) return;
    mcAnswered = true;
    grid.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
    const correctBtn = Array.from(grid.children).find((b, i) => options[i].correct);
    correctBtn.classList.add("correct");
    const fb = document.getElementById("feedback");
    const glossSuffix = q.gloss ? ` (${q.gloss})` : "";
    if (opt.correct) {
      goodTone(); mcScore++; addStar(1);
      speak(q.de, 1);
      fb.className = "feedback good";
      fb.textContent = `✅ Richtig! ${q.de} = ${q.en}${glossSuffix}`;
      fb.style.display = "block";
      setTimeout(nextMcQuestion, 1100);
    } else {
      btn.classList.add("wrong");
      badTone();
      speak(q.de, 1);
      fb.className = "feedback bad";
      fb.textContent = `❌ Nicht ganz … richtig: ${q.de} = ${q.en}${glossSuffix}`;
      fb.style.display = "block";
      const key = q.de.toLowerCase();
      const existing = mistakes.get(key);
      if (existing) { existing.count++; existing.lastWrong = opt.label; }
      else mistakes.set(key, { de: q.de, en: q.en, count: 1, lastWrong: opt.label });
      const nb = document.createElement("button");
      nb.className = "btn primary wide";
      nb.style.marginTop = "10px";
      nb.textContent = "Weiter ▶";
      nb.addEventListener("click", () => { nb.remove(); nextMcQuestion(); });
      fb.after(nb);
    }
  }

  function nextMcQuestion() {
    document.querySelectorAll("#panel-practice .btn.primary.wide").forEach(b => {
      if (b.textContent === "Weiter ▶") b.remove();
    });
    mcIdx++;
    if (mcIdx >= mcQuestions.length) showMcResults(); else showMcQuestion();
  }

  function showMcResults() {
    document.getElementById("mcPlay").style.display = "none";
    document.getElementById("practiceResults").style.display = "block";
    const pct = Math.round((mcScore / mcQuestions.length) * 100);
    document.getElementById("resultsLabel").textContent = "Ergebnis";
    document.getElementById("resultPct").textContent = `${pct}%`;
    document.getElementById("resultScore").textContent = `${mcScore} / ${mcQuestions.length} richtig`;
    const starsEl = document.getElementById("resultStars");
    starsEl.textContent = pct >= 90 ? "⭐⭐⭐" : pct >= 70 ? "⭐⭐" : pct >= 40 ? "⭐" : "—";
  }

  // ---------- results actions ----------
  document.getElementById("btnPracticeMistakes").addEventListener("click", () => {
    if (mistakes.size < 4) { toast("Noch nicht genug Fehler gesammelt (mind. 4 nötig)."); return; }
    practiceMode = "de-en";
    renderModeGrid();
    document.getElementById("practiceResults").style.display = "none";
    startMc(true);
  });
  document.getElementById("btnAgain").addEventListener("click", () => {
    document.getElementById("practiceResults").style.display = "none";
    startMc(mcScopeIsMistakes);
  });
  document.getElementById("btnNewPractice").addEventListener("click", () => {
    document.getElementById("practiceResults").style.display = "none";
    document.getElementById("practiceSetup").style.display = "block";
  });

  // ---------- review tab ----------
  function renderReview() {
    const list = document.getElementById("reviewList");
    list.innerHTML = "";
    if (mistakes.size === 0) {
      list.innerHTML = `<div class="empty-state">🎉 Keine Fehler bisher — weiter so!</div>`;
      return;
    }
    Array.from(mistakes.values()).forEach(m => {
      const item = document.createElement("div");
      item.className = "review-item";
      item.innerHTML = `
        <div class="top"><b>${m.de}</b><span class="count">×${m.count}</span></div>
        <div class="m">${m.en}</div>
        <button class="small-icon-btn spk">🔊</button>
      `;
      item.querySelector(".spk").addEventListener("click", () => speak(m.de, 1));
      list.appendChild(item);
    });
    const actions = document.createElement("div");
    actions.className = "controls";
    actions.innerHTML = `
      <button class="btn primary wide" id="btnPracticeFromReview">Diese Wörter üben</button>
      <button class="btn wide" id="btnClearMistakes">Liste löschen</button>
    `;
    list.appendChild(actions);
    document.getElementById("btnPracticeFromReview").addEventListener("click", () => {
      if (mistakes.size < 4) { toast("Noch nicht genug Fehler gesammelt (mind. 4 nötig)."); return; }
      goToTab("practice");
      practiceMode = "de-en";
      renderModeGrid(); renderLengthChoices();
      document.getElementById("practiceSetup").style.display = "block";
      startMc(true);
    });
    document.getElementById("btnClearMistakes").addEventListener("click", () => {
      mistakes.clear();
      renderReview();
    });
  }

  // ---------- init ----------
  renderVocabBrowse();
})();

</script>
</body>
</html>
