function sum(a){var n=0;a.forEach(function(r){n+=r.pts;});return n;}
function cntOK(a){return a.filter(function(r){return r.st==='ok';}).length;}
function total(){return sum(cRes)+sum(pRes);}
function board(){
  document.getElementById('vT').textContent=total()+' / '+MAX;
  document.getElementById('vC').textContent=cntOK(cRes)+' / '+W.length;
  document.getElementById('vP').textContent=cntOK(pRes)+' / '+P.length;
  document.getElementById('vR').textContent=revPts;
}
function grade(pc){
  if(pc>=90)return ['很棒 Excellent','🏆'];
  if(pc>=75)return ['很好 Very good','🌟'];
  if(pc>=60)return ['不错 Good','👍'];
  if(pc>0)  return ['加油 Keep going','💪'];
  return ['开始吧 Ready','🚀'];
}

/* ---------- speech ---------- */
var zhVoice=null;
function pv(){try{var v=speechSynthesis.getVoices();zhVoice=null;for(var i=0;i<v.length;i++){if(/zh|Chinese/i.test(v[i].lang+v[i].name)){zhVoice=v[i];break;}}}catch(e){}}
if('speechSynthesis' in window){pv();speechSynthesis.onvoiceschanged=pv;}
function say(t,r){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r||0.8;if(zhVoice)u.voice=zhVoice;speechSynthesis.speak(u);}catch(e){}}

/* ---------- tabs ---------- */
var TABS=[['card','🃏 抽认卡 Flashcards'],['phr','✍️ 词组 Phrases'],['rev','🔁 复习 Review'],['fin','🏆 总分 Final score']];
var nav=document.getElementById('nav');
TABS.forEach(function(t,i){var b=document.createElement('button');b.className='nt'+(i===0?' on':'');
  b.id='nt-'+t[0];b.innerHTML=t[1];b.onclick=function(){show(t[0]);};nav.appendChild(b);});
function show(id){
  TABS.forEach(function(t){document.getElementById('nt-'+t[0]).classList.toggle('on',t[0]===id);
    document.getElementById('s-'+t[0]).classList.toggle('on',t[0]===id);});
  window.scrollTo(0,0);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(id==='rev') drawRev();
  if(id==='fin') drawFin();
}

/* ================= 1 · FLASHCARDS ================= */
var ci=0, cOrder=W.map(function(_,i){return i;}), cFront='zh', flipped=false;
function renderCard(){
  var w=document.getElementById('s-card');
  w.innerHTML='<div class="tip">Tap the card to flip it. Then say honestly whether you knew it: '
   +'<b class="pts">✓ I knew it = 2 points</b>, <b class="pts">↻ Still learning = 0</b> (it goes to the Review tab, where getting it right is worth 1 point). '
   +'Only your first answer for a card is scored.</div>'
   +'<div class="chips" id="cchips"></div>'
   +'<div class="meta"><span id="cm"></span><span id="cs"></span></div>'
   +'<div class="bar"><div class="barf" id="cb"></div></div>'
   +'<div class="flip"><div class="fin" id="fin">'
   +'<div class="face" id="fFront"></div><div class="face back" id="fBack"></div></div></div>'
   +'<div class="done-note" id="cnote"></div>'
   +'<div class="rate"><button class="btn b-g" id="cKnew">✓ I knew it (+2)</button>'
   +'<button class="btn b-o" id="cMiss">↻ Still learning</button>'
   +'<button class="btn b-s" id="cSay">🔊 Hear</button></div>'
   +'<div class="nav2"><button id="cPrev">← Prev</button><button id="cNext">Next →</button></div>'
   +'<div class="dots" id="cdots"></div>';
  var box=document.getElementById('cchips');
  box.innerHTML='<span style="font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#8892a4">Front of card</span>'
   +'<button data-v="zh"'+(cFront==='zh'?' class="on"':'')+'>汉字 Chinese</button>'
   +'<button data-v="en"'+(cFront==='en'?' class="on"':'')+'>English meaning</button>'
   +'<button data-v="shuffle" style="margin-left:6px">🔀 Shuffle</button>';
  box.querySelectorAll('button').forEach(function(b){b.onclick=function(){
    if(b.dataset.v==='shuffle'){cOrder=shuffle(cOrder);ci=0;}
    else cFront=b.dataset.v;
    renderCard();
  };});
  document.getElementById('fin').onclick=function(){flipped=!flipped;this.classList.toggle('on',flipped);
    if(flipped) say(W[cOrder[ci]].zh);};
  document.getElementById('cKnew').onclick=function(){rateCard(true);};
  document.getElementById('cMiss').onclick=function(){rateCard(false);};
  document.getElementById('cSay').onclick=function(){say(W[cOrder[ci]].zh);};
  document.getElementById('cPrev').onclick=function(){if(ci>0){ci--;drawCard();}};
  document.getElementById('cNext').onclick=function(){if(ci<cOrder.length-1){ci++;drawCard();}};
  drawCard();
}
function drawCard(){
  var o=W[cOrder[ci]], r=cRes[cOrder[ci]];
  flipped=false; document.getElementById('fin').classList.remove('on');
  document.getElementById('cm').textContent='Card '+(ci+1)+' / '+cOrder.length;
  document.getElementById('cs').textContent='Card points: '+sum(cRes)+' / '+MAXC;
  document.getElementById('cb').style.width=((ci+1)/cOrder.length*100)+'%';
  var f=document.getElementById('fFront'), b=document.getElementById('fBack');
  if(cFront==='zh'){
    f.innerHTML='<div class="zh">'+esc(o.zh)+'</div><div class="hint">tap to flip</div>';
    b.innerHTML='<div class="py">'+esc(o.py)+'</div><div class="en">'+esc(o.en)+'</div>';
  } else {
    f.innerHTML='<div class="en" style="font-size:clamp(19px,5vw,26px)">'+esc(o.en)+'</div><div class="hint">tap to flip</div>';
    b.innerHTML='<div class="zh" style="font-size:clamp(38px,10vw,60px)">'+esc(o.zh)+'</div><div class="py" style="font-size:22px">'+esc(o.py)+'</div>';
  }
  var n=document.getElementById('cnote');
  if(r.st==='ok'){n.className='done-note';n.textContent='✓ already scored '+r.pts+(r.rev?' (recovered in review)':'')+' — you can keep practising';}
  else if(r.st==='miss'){n.className='done-note miss';n.textContent='↻ marked for review';}
  else {n.className='done-note';n.textContent='';}
  document.getElementById('cPrev').disabled=(ci===0);
  document.getElementById('cNext').disabled=(ci===cOrder.length-1);
  drawCDots(); board();
}
function rateCard(knew){
  var id=cOrder[ci], r=cRes[id];
  if(r.st===null){ r.st=knew?'ok':'miss'; r.pts=knew?2:0; }
  board();
  if(ci<cOrder.length-1){ ci++; drawCard(); } else drawCard();
}
function drawCDots(){
  var d=document.getElementById('cdots'); if(!d)return; d.innerHTML='';
  cOrder.forEach(function(id,i){
    var r=cRes[id], cls='dot'+(i===ci?' cur':(r.st==='ok'?' ok':(r.st==='miss'?' no':'')));
    var e=document.createElement('div'); e.className=cls; e.title='Card '+(i+1);
    e.onclick=function(){ci=i;drawCard();}; d.appendChild(e);
  });
}

/* ================= 2 · PHRASES ================= */
var pi=0;
function renderPhr(){
  var w=document.getElementById('s-phr');
  w.innerHTML='<div class="tip">Each phrase is made of <b>two words</b> from the 50. Type it in <b>pinyin</b>. '
   +'<b>Tone marks are not required</b> — <code>zher you</code>, <code>zher4 you3</code> and <code>zhèr yǒu</code> are all accepted, and spaces do not matter. '
   +'The <b>spelling</b> must be right: <code>xie xie</code> ✓, <code>xie shie</code> ✗. Type <code>v</code> for ü (<code>lv</code> = lü). Press <b>Enter</b> to check.<br>'
   +'Scoring: <b class="pts">5</b> first try · <b class="pts">2</b> if right after a miss · <b class="pts">0</b> if you press Show.</div>'
   +'<div class="meta"><span id="pm"></span><span id="ps"></span></div>'
   +'<div class="bar"><div class="barf" id="pb"></div></div>'
   +'<div id="pq"></div>'
   +'<div class="nav2"><button id="pPrev">← Prev</button><button id="pNext">Next →</button></div>'
   +'<div class="dots" id="pdots"></div>';
  document.getElementById('pPrev').onclick=function(){if(pi>0){pi--;drawPhr();}};
  document.getElementById('pNext').onclick=function(){if(pi<P.length-1){pi++;drawPhr();}};
  drawPhr();
}
function drawPhr(){
  var o=P[pi];
  document.getElementById('pm').textContent='Phrase '+(pi+1)+' / '+P.length;
  document.getElementById('ps').textContent='Phrase points: '+sum(pRes)+' / '+MAXP;
  document.getElementById('pb').style.width=((pi+1)/P.length*100)+'%';
  document.getElementById('pq').innerHTML='<div class="qcard">'
   +'<div class="lbl">type the pinyin — tones not needed</div>'
   +'<div class="pzh">'+esc(o.zh)+'</div>'
   +'<div class="pen">'+esc(o.en)+'</div>'
   +'<div class="pmade">'+esc(o.made)+'</div>'
   +'<div class="ir"><input class="inp" id="pin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="e.g. zher you">'
   +'<button class="btn b-g" id="pck">Check ✓</button>'
   +'<button class="btn b-s" id="psay">🔊</button>'
   +'<button class="btn b-s" id="psh">Show</button></div>'
   +'<div class="ans" id="pans"></div></div>';
  var inp=document.getElementById('pin');
  document.getElementById('pck').onclick=function(){gradePhr(false);};
  document.getElementById('psh').onclick=function(){gradePhr(true);};
  document.getElementById('psay').onclick=function(){say(o.zh);};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();gradePhr(false);}});
  document.getElementById('pPrev').disabled=(pi===0);
  document.getElementById('pNext').disabled=(pi===P.length-1);
  drawPDots(); board();
  inp.focus();
}
function gradePhr(reveal){
  var o=P[pi], r=pRes[pi];
  var inp=document.getElementById('pin'), box=document.getElementById('pans');
  var got=canon(inp.value), good=canon(o.py);
  if(!got.l && !reveal){ inp.focus(); return; }
  var ok=!reveal && accepts(o,inp.value);
  var earned=0;
  if(reveal){ if(r.st===null){ r.st='miss'; r.pts=0; } }
  else if(ok){
    if(r.st===null){ r.st='ok'; r.pts=5; earned=5; }
    else if(r.st==='miss' && !r.rev){ r.st='ok'; r.pts=2; earned=2; }
  } else if(r.st===null){ r.st='miss'; r.pts=0; }
  inp.className='inp '+(ok?'ok':'no');
  var extra='';
  if(!ok && got.l){
    var d=firstDiff(good.l,got.l);
    extra='<div class="y">you typed: '+esc(inp.value.trim())+(d>=0?'  ·  first difference at letter '+(d+1):'')+'</div>';
  }
  box.className='ans '+(ok?'ok':'no');
  box.innerHTML=(earned?'<span class="pt">+'+earned+'</span>':'')+(ok?'✓ ':'✗ ')
    +'<span class="p">'+esc(o.py)+'</span><div class="e">'+esc(o.zh)+' — '+esc(o.en)+'</div>'+extra;
  say(o.zh); board(); drawPDots();
  document.getElementById('ps').textContent='Phrase points: '+sum(pRes)+' / '+MAXP;
}
function drawPDots(){
  var d=document.getElementById('pdots'); if(!d)return; d.innerHTML='';
  P.forEach(function(_,i){
    var r=pRes[i], cls='dot'+(i===pi?' cur':(r.st==='ok'?' ok':(r.st==='miss'?' no':'')));
    var e=document.createElement('div'); e.className=cls; e.title='Phrase '+(i+1);
    e.onclick=function(){pi=i;drawPhr();}; d.appendChild(e);
  });
}

/* ================= 3 · REVIEW ================= */
function drawRev(){
  var w=document.getElementById('s-rev');
  var mc=[], mp=[];
  cRes.forEach(function(r,i){ if(r.st==='miss') mc.push(i); });
  pRes.forEach(function(r,i){ if(r.st==='miss') mp.push(i); });
  var head='<div class="tip">Everything you did not get first time lands here. '
   +'A card you now know is worth <b class="pts">1</b> point; a phrase you now type correctly is worth <b class="pts">2</b> (tones still not needed). '
   +'These points are added to your final score and shown separately as the <b>复习 Review</b> score.</div>';
  if(!mc.length && !mp.length){
    w.innerHTML=head+'<div class="empty">Nothing to review — everything so far was right first time 🎉</div>';
    return;
  }
  var h=head;
  if(mc.length){
    h+='<div class="rlist"><div class="h">抽认卡 Cards to review ('+mc.length+')</div>'
      +mc.map(function(i){var o=W[i];
        return '<div class="rrow"><div class="z">'+esc(o.zh)+'</div>'
        +'<div class="bd"><div class="p">'+esc(o.py)+'</div><div class="e">'+esc(o.en)+'</div></div>'
        +'<button class="btn b-s" data-say="'+esc(o.zh)+'">🔊</button>'
        +'<button class="btn b-g" data-cok="'+i+'">✓ I know it now (+1)</button></div>';
      }).join('')+'</div>';
  }
  if(mp.length){
    h+='<div class="rlist"><div class="h">词组 Phrases to review ('+mp.length+')</div>'
      +mp.map(function(i){var o=P[i];
        return '<div class="rrow"><div class="z">'+esc(o.zh)+'</div>'
        +'<div class="bd"><div class="e">'+esc(o.en)+'</div></div>'
        +'<input id="rv'+i+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the pinyin">'
        +'<button class="btn b-s" data-say="'+esc(o.zh)+'">🔊</button>'
        +'<button class="btn b-g" data-pok="'+i+'">Check ✓</button></div>';
      }).join('')+'</div>';
  }
  w.innerHTML=h;
  w.querySelectorAll('[data-say]').forEach(function(b){b.onclick=function(){say(b.getAttribute('data-say'));};});
  w.querySelectorAll('[data-cok]').forEach(function(b){b.onclick=function(){
    var i=+b.getAttribute('data-cok');
    cRes[i].st='ok'; cRes[i].pts=1; cRes[i].rev=true; revPts+=1;
    board(); drawRev();
  };});
  w.querySelectorAll('[data-pok]').forEach(function(b){b.onclick=function(){
    var i=+b.getAttribute('data-pok'), o=P[i], inp=document.getElementById('rv'+i);
    if(!canon(inp.value).l) return;
    if(accepts(o,inp.value)){
      pRes[i].st='ok'; pRes[i].pts=2; pRes[i].rev=true; revPts+=2;
      inp.className='ok'; say(o.zh); board(); setTimeout(drawRev,700);
    } else {
      inp.className='no'; say(o.zh);
    }
  };});
  w.querySelectorAll('.rrow input').forEach(function(el){
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault();
      var i=el.id.slice(2); var btn=w.querySelector('[data-pok="'+i+'"]'); if(btn) btn.click(); }});
  });
}

/* ================= 4 · FINAL SCORE ================= */
function drawFin(){
  var w=document.getElementById('s-fin');
  var cp=sum(cRes), pp=sum(pRes), tt=cp+pp, pc=Math.round(tt/MAX*100);
  var g=grade(pc);
  var cd=cRes.filter(function(r){return r.st!==null;}).length;
  var pd=pRes.filter(function(r){return r.st!==null;}).length;
  var stillC=cRes.filter(function(r){return r.st==='miss';}).length;
  var stillP=pRes.filter(function(r){return r.st==='miss';}).length;
  var h='<div class="final"><div class="em">'+g[1]+'</div>'
   +'<div class="big">'+tt+' / '+MAX+'</div>'
   +'<div class="gr">'+g[0]+'</div>'
   +'<div class="pc">'+pc+'%  ·  '+(cd+pd)+' of '+(W.length+P.length)+' items attempted</div></div>'
   +'<table class="tbl"><tr><th>Part</th><th>Attempted</th><th>Right</th><th style="text-align:right">Points</th></tr>'
   +'<tr><td>🃏 抽认卡 Flashcards</td><td>'+cd+' / '+W.length+'</td><td>'+cntOK(cRes)+'</td><td class="n">'+cp+' / '+MAXC+'</td></tr>'
   +'<tr><td>✍️ 词组 Phrases</td><td>'+pd+' / '+P.length+'</td><td>'+cntOK(pRes)+'</td><td class="n">'+pp+' / '+MAXP+'</td></tr>'
   +'<tr><td>🔁 复习 Review <span style="font-weight:700;color:#8892a4">(included above)</span></td><td>—</td><td>—</td><td class="n">'+revPts+'</td></tr>'
   +'<tr class="tot"><td>总分 Final score</td><td></td><td></td><td class="n">'+tt+' / '+MAX+'</td></tr></table>';
  if(stillC||stillP){
    h+='<div class="tip" style="margin-top:13px">Still to master: <b>'+stillC+'</b> card'+(stillC===1?'':'s')
      +' and <b>'+stillP+'</b> phrase'+(stillP===1?'':'s')+'. Open the <b>🔁 复习 Review</b> tab to win those points back.</div>';
  } else if(cd+pd>0){
    h+='<div class="tip" style="margin-top:13px">Nothing left to review — every item you attempted was right. 🎉</div>';
  }
  h+='<div class="row"><button class="btn b-p" id="fRev">🔁 Go to Review</button>'
   +'<button class="btn b-r" id="fReset">↺ Start again from zero</button></div>';
  w.innerHTML=h;
  document.getElementById('fRev').onclick=function(){show('rev');};
  document.getElementById('fReset').onclick=function(){
    cRes=W.map(function(){return {st:null,pts:0,rev:false};});
    pRes=P.map(function(){return {st:null,pts:0,rev:false};});
    revPts=0; ci=0; pi=0; cOrder=W.map(function(_,i){return i;});
    board(); renderCard(); renderPhr(); drawFin();
  };
}

/* ---------- init ---------- */
board(); renderCard(); renderPhr();
</script>
