  let t=String(s||'').toLowerCase().replace(/u:/g,'v');
  let o='';
  for(const ch of t) o += (TONE[ch]!==undefined?TONE[ch]:ch);
  o=o.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return o.replace(/[^a-z]/g,'');
}
/* first point where the student's letters part company with the answer */
function firstDiff(good,got){
  const n=Math.min(good.length,got.length);
  for(let i=0;i<n;i++) if(good[i]!==got[i]) return i;
  return good.length===got.length?-1:n;
}

/* ---------- state ---------- */
const NL=DLG.length*2;
const res=DLG.map(()=>[null,null]);          // null | true | false, per line
function linesRight(){let n=0;res.forEach(r=>r.forEach(v=>{if(v===true)n++;}));return n;}
function linesTried(){let n=0;res.forEach(r=>r.forEach(v=>{if(v!==null)n++;}));return n;}
function dlgDone(){return res.filter(r=>r[0]!==null&&r[1]!==null).length;}
function board(){
  document.getElementById('vD').textContent=dlgDone()+' / '+DLG.length;
  document.getElementById('vL').textContent=linesRight()+' / '+NL;
  const t=linesTried();
  document.getElementById('vA').textContent=t?Math.round(linesRight()/t*100)+'%':'—';
}

/* ---------- speech ---------- */
let zhVoice=null;
function pv(){const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh|Chinese/i.test(v.lang+v.name))||null;}
if('speechSynthesis' in window){pv();speechSynthesis.onvoiceschanged=pv;}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.8;if(zhVoice)u.voice=zhVoice;speechSynthesis.speak(u);}catch(e){}}

/* ---------- tabs ---------- */
const TABS=[['type','⌨️ 打拼音 Type'],['again','⚠️ 错题 Try again'],['all','📖 全部 All 100 lines']];
const nav=document.getElementById('nav');
TABS.forEach((t,i)=>{const b=document.createElement('button');b.className='nt'+(i===0?' on':'');b.id='nt-'+t[0];b.textContent=t[1];b.onclick=()=>show(t[0]);nav.appendChild(b);});
function show(id){TABS.forEach(t=>{document.getElementById('nt-'+t[0]).classList.toggle('on',t[0]===id);document.getElementById('s-'+t[0]).classList.toggle('on',t[0]===id);});window.scrollTo(0,0);if(id==='again')drawAgain();if(id==='all')drawAll();}

/* ---------- one dialogue card ---------- */
function lineBlock(di,li,o,who){
  const id='L'+di+'_'+li;
  return '<div class="lrow">'
   +'<div><span class="who'+(li?' b':'')+'">'+(li?'乙 B':'甲 A')+'</span></div>'
   +'<div class="zh">'+o.zh+'</div>'
   +'<div class="ir">'
   +'<input class="inp" id="'+id+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the pinyin — tones not needed">'
   +'<button class="btn bg" data-act="check" data-id="'+id+'">Check ✓</button>'
   +'<button class="btn bs" data-act="say" data-zh="'+o.zh+'">🔊</button>'
   +'<button class="btn bs" data-act="show" data-id="'+id+'">Show</button>'
   +'</div><div class="ans" id="A'+id+'"></div></div>';
}
function grade(di,li,reveal){
  const o=li?DLG[di].b:DLG[di].a;
  const inp=document.getElementById('L'+di+'_'+li);
  const box=document.getElementById('AL'+di+'_'+li);
  const good=norm(o.py), got=norm(inp.value);
  if(!got && !reveal){inp.focus();return;}
  const ok = !reveal && got===good;
  if(res[di][li]===null) res[di][li]=ok;       // only the first attempt counts
  inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');
  let extra='';
  if(!ok && got){
    const d=firstDiff(good,got);
    extra='<div class="yours">you typed: '+inp.value.trim()+(d>=0?'  ·  first difference at letter '+(d+1):'')+'</div>';
  }
  box.className='ans '+(ok?'ok':'no');
  box.innerHTML=(ok?'✓ ':'✗ ')+'<span class="py">'+o.py+'</span><div class="en">'+o.en+'</div>'+extra;
  say(o.zh);board();drawDots();
  const ts=document.getElementById('ts');if(ts)ts.textContent='Lines right: '+linesRight()+' / '+NL;
}

/* ---------- TYPE tab ---------- */
let di=0;
function renderType(){
  const w=document.getElementById('s-type');
  w.innerHTML='<div class="tip">Read the two Mandarin lines and type each one in <b>pinyin</b>. '
   +'<b>Tone marks are not required</b> — <code>ni hao</code>, <code>ni3 hao3</code> and <code>nǐ hǎo</code> are all accepted, and spaces do not matter. '
   +'The <b>spelling</b> must be right: <code>xie xie</code> ✓, <code>xie shie</code> ✗. Type <code>v</code> for ü (<code>lvyou</code> = lǚyóu). Press <b>Enter</b> to check a line.</div>'
   +'<div class="meta"><span id="tm"></span><span id="ts"></span></div><div class="bar"><div class="barf" id="tbar"></div></div>'
   +'<div id="tq"></div>'
   +'<div class="navc"><button class="nbtn" id="prev">← Prev</button><button class="nbtn" id="next">Next →</button></div>'
   +'<div class="dots" id="tdots"></div>';
  w.querySelector('#prev').onclick=()=>{if(di>0){di--;drawType();}};
  w.querySelector('#next').onclick=()=>{if(di<DLG.length-1){di++;drawType();}};
  drawType();
}
function drawType(){
  const d=DLG[di];
  document.getElementById('tm').textContent='Dialogue '+(di+1)+' / '+DLG.length;
  document.getElementById('ts').textContent='Lines right: '+linesRight()+' / '+NL;
  document.getElementById('tbar').style.width=((di+1)/DLG.length*100)+'%';
  document.getElementById('tq').innerHTML='<div class="qcard">'+lineBlock(di,0,d.a,'A')+lineBlock(di,1,d.b,'B')+'</div>';
  document.getElementById('prev').disabled=(di===0);
  document.getElementById('next').disabled=(di===DLG.length-1);
  wire(di);drawDots();
  const f=document.getElementById('L'+di+'_0');if(f)f.focus();
}
function wire(d){
  document.querySelectorAll('#tq [data-act]').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.act==='say'){say(b.dataset.zh);return;}
      const li=+b.dataset.id.split('_')[1];
      grade(d,li,b.dataset.act==='show');
    };
  });
  [0,1].forEach(li=>{
    const el=document.getElementById('L'+d+'_'+li);
    el.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();grade(d,li,false);
      if(li===0){document.getElementById('L'+d+'_1').focus();}
      else if(di<DLG.length-1){di++;drawType();}
    });
  });
}
function drawDots(){
  const dots=document.getElementById('tdots');if(!dots)return;
  dots.innerHTML='';
  DLG.forEach((_,i)=>{
    const r=res[i];const both=r[0]!==null&&r[1]!==null;
    const cls=i===di?'cur':(both&&r[0]&&r[1])?'done':(r[0]!==null||r[1]!==null)?'part':'';
    const e=document.createElement('div');e.className='dot '+cls;e.title='Dialogue '+(i+1);
    e.onclick=()=>{di=i;drawType();};dots.appendChild(e);
  });
}

/* ---------- TRY AGAIN tab ---------- */
function drawAgain(){
  const w=document.getElementById('s-again');
  const miss=[];
  res.forEach((r,i)=>r.forEach((v,li)=>{if(v===false)miss.push([i,li]);}));
  if(!miss.length){
    w.innerHTML='<div class="tip">Every line you have checked so far was right — nothing to redo. Lines you get wrong on the first try land here.</div>'
      +'<div class="empty">No mistakes yet 🎉</div>';
    return;
  }
  w.innerHTML='<div class="tip">The lines you missed on the first attempt. Type them again — getting one right here clears it from the list.</div>'
   +'<div id="aq"></div>';
  const q=document.getElementById('aq');
  q.innerHTML=miss.map(([i,li])=>{
    const o=li?DLG[i].b:DLG[i].a;
    return '<div class="qcard" style="margin-bottom:11px">'
      +'<div class="meta"><span>Dialogue '+(i+1)+' · line '+(li?'B':'A')+'</span><span></span></div>'
      +'<div class="zh">'+o.zh+'</div>'
      +'<div class="ir"><input class="inp" id="R'+i+'_'+li+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the pinyin again">'
      +'<button class="btn bg" data-r="'+i+'_'+li+'">Check ✓</button>'
      +'<button class="btn bs" data-s="'+o.zh+'">🔊</button></div>'
      +'<div class="ans" id="RA'+i+'_'+li+'"></div></div>';
  }).join('');
  q.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(b.dataset.s));
  q.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const [i,li]=b.dataset.r.split('_').map(Number);
    const o=li?DLG[i].b:DLG[i].a;
    const inp=document.getElementById('R'+i+'_'+li);
    const box=document.getElementById('RA'+i+'_'+li);
    const good=norm(o.py),got=norm(inp.value);
    const ok=got===good;
    inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');
    box.className='ans '+(ok?'ok':'no');
    box.innerHTML=(ok?'✓ ':'✗ ')+'<span class="py">'+o.py+'</span><div class="en">'+o.en+'</div>';
    say(o.zh);
    if(ok){res[i][li]=true;board();setTimeout(drawAgain,900);}
  });
}

/* ---------- ALL tab ---------- */
function drawAll(f){
  const w=document.getElementById('s-all');
  if(!document.getElementById('flt')){
    w.innerHTML='<div class="tip">All 50 dialogues with pinyin and meaning — the answer key. Filter by any Chinese character, pinyin syllable or English word.</div>'
      +'<input class="search" id="flt" placeholder="filter — try  烤鸭  ·  jiao  ·  cousin">'
      +'<div id="alist"></div>';
    document.getElementById('flt').addEventListener('input',e=>drawAll(e.target.value));
  }
  const q=(f||'').trim().toLowerCase();
  const rows=DLG.map((d,i)=>({d,i})).filter(({d})=>{
    if(!q)return true;
    const hay=(d.a.zh+d.a.py+d.a.en+d.b.zh+d.b.py+d.b.en).toLowerCase();
    return hay.includes(q)||norm(hay).includes(norm(q));
  });
  const list=document.getElementById('alist');
  list.innerHTML = rows.length ? rows.map(({d,i})=>
    '<div class="lst"><div class="h"><span>Dialogue '+(i+1)+'</span><button class="spk" data-s="'+d.a.zh+d.b.zh+'">🔊 both</button></div>'
    +[['甲 A',d.a,''],['乙 B',d.b,'b']].map(([t,o,c])=>
      '<div class="ln"><span class="tag '+c+'">'+t+'</span><div class="bdy"><div class="z">'+o.zh+'</div><div class="p">'+o.py+'</div><div class="e">'+o.en+'</div></div>'
      +'<button class="spk" data-s="'+o.zh+'">🔊</button></div>').join('')
    +'</div>').join('') : '<div class="empty">Nothing matches “'+(f||'')+'”</div>';
  list.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(b.dataset.s));
}

/* init */
board();renderType();
</script>
</body>
</html>
