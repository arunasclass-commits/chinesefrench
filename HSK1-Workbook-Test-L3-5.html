<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 1 Workbook Mock Test · Lessons 3–5 · Aruna's classes</title>
<style>
:root{
  --paper:#fffdf8;--ink:#2c1810;--muted:#6d4c41;--soft:#f3e5dc;
  --red:#c62828;--red-d:#8e1515;--red-l:#ffebee;
  --teal:#00897b;--teal-d:#00695c;--teal-l:#e0f2f1;
  --orange:#ef6c00;--orange-l:#fff3e0;
  --green:#2e7d32;--green-l:#e8f5e9;
  --blue:#1565c0;--blue-l:#e3f2fd;
  --card:#fff;--line:#ef9a9a;--shadow:0 8px 24px rgba(80,20,20,.08);
  --t1:#e53935;--t2:#f57c00;--t3:#2e9e44;--t4:#1e7fd8;--t5:#8d8d8d;
  --header-h:58px;--footer-h:36px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.45;
  min-height:100vh;padding-bottom:calc(var(--footer-h) + 24px);
}
.zh{font-family:"Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC","Heiti SC",sans-serif}
.py{font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;font-weight:700}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}

.gw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .18em .15em;line-height:1.1;text-align:center}
.gw .zh{font-size:1.15em;font-weight:700}
.gw .py{font-size:.72em}
.gw .en{font-size:.62em;color:var(--muted);font-weight:600;font-style:italic;max-width:7.2em}
.gloss-line{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;margin:0 0 6px}
.instr-en{font-weight:600;color:var(--ink)}
.sec-nav .gw .en,.score-card .gw .en,.results-hero .gw .en,.part-h .gw .en{color:rgba(255,255,255,.95);font-style:normal}
.sec-nav .gw .zh{color:#fff}
.score-card .gw .zh{color:#fff}

.app-header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:3px solid #e53935;box-shadow:0 2px 10px rgba(0,0,0,.05);min-height:var(--header-h)}
.header-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#c62828,#ef6c00);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:11px;color:var(--muted)}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.pill.timer{background:#fff8e1;color:#e65100}
.pill.timer.warn{background:#ffebee;color:#c62828}
.progress-mini{font-size:12px;font-weight:800;color:var(--red-d)}
.app-footer{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--footer-h);background:#4e342e;color:#ffe0b2;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.3px}

button,.btn{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-d)}
.btn-ghost{background:#fff;color:var(--red-d);border:2px solid #ef9a9a}
.btn-play{background:#fff3e0;color:#e65100;border:2px solid #ffcc80;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}
.btn-play svg{width:16px;height:16px;fill:currentColor}
.btn-play:disabled{opacity:.55;cursor:default}
.btn-play.playing{background:#ffe0b2}
.icon-btn{background:var(--soft);border:0;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;color:var(--ink)}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#c62828,#ef6c00);color:#fff;border-radius:24px;padding:28px 22px;margin-bottom:16px}
.hero h2{margin:0 0 8px;font-size:clamp(22px,4vw,32px)}
.hero p{margin:0 0 8px;opacity:.95}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.hero .meta span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.start-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.card{background:var(--card);border:1px solid #f8bbd0;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;color:var(--red-d)}
.card ol,.card ul{margin:8px 0;padding-left:20px}
.card li{margin:4px 0}
.start-form{display:flex;flex-direction:column;gap:10px}
.start-form label{font-weight:700;font-size:14px}
.start-form input[type=text]{border:2px solid #ef9a9a;border-radius:10px;padding:8px 12px;font:inherit}
.tone-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:13px;font-weight:700;margin:10px 0}
.credits{font-size:12px;color:var(--muted);margin-top:18px;padding:14px 16px;background:#faf6f2;border-radius:14px;border:1px dashed #d7ccc8}
.credits h3{margin:0 0 8px;font-size:13px;color:var(--ink)}
.credits ul{margin:0;padding-left:18px}
.credits li{margin:3px 0}
.warn{display:none;background:#fff3e0;border:1px solid #ffcc80;color:#e65100;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:700;font-size:13px}
.warn.show{display:block}

.sec-nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px;position:sticky;top:calc(var(--header-h));z-index:30;background:var(--paper);padding:8px 0}
.sec-nav button{flex:1;min-width:140px;border:0;border-radius:14px;padding:10px 8px;font-weight:800;color:#fff;background:#bdbdbd}
.sec-nav button.n-l{background:#c62828}
.sec-nav button.n-r{background:#1565c0}
.sec-nav button:not(.on){opacity:.55}
.sec-actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}

.part{margin:0 0 22px}
.part-h{background:linear-gradient(135deg,#c62828,#ad1457);color:#fff;border-radius:16px 16px 0 0;padding:12px 16px}
.part-h.r{background:linear-gradient(135deg,#1565c0,#283593)}
.part-body{border:1px solid #f8bbd0;border-top:0;border-radius:0 0 16px 16px;padding:8px 8px 14px;background:#fff}

.q{padding:14px 10px;border-bottom:1px dashed #f8bbd0}
.q:last-child{border-bottom:0}
.q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qnum{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;flex:none}
.part.r .qnum{background:var(--blue)}
.prompt{font-size:20px;font-weight:800}
.prompt-box{background:#fff8e1;border-radius:12px;padding:10px 12px;margin:8px 0}
.stem{font-size:18px;font-weight:800}

.choices{display:grid;gap:8px}
.choices.pics{grid-template-columns:repeat(3,1fr)}
.choice{background:#fff;border:2px solid #e0e0e0;border-radius:14px;padding:8px;cursor:pointer;text-align:center;position:relative}
.choice:hover{border-color:#ef9a9a}
.choice.on{border-color:var(--red);background:#ffebee;box-shadow:0 0 0 2px rgba(198,40,40,.2)}
.choice .letter{display:inline-block;width:26px;height:26px;border-radius:50%;background:#eceff1;font-weight:800;line-height:26px;margin-bottom:4px}
.choice.on .letter{background:var(--red);color:#fff}
.choice img.photo,.bank-pic img.photo{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;border-radius:10px;display:block;background:#f3eee8}
.choices:not(.pics) .choice{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px}
.choices:not(.pics) .choice .letter{margin:0;flex:none}
.choices:not(.pics) .choice .opt-zh{display:inline;font-size:20px}
.q.reviewed .choice.right{border-color:var(--green);background:var(--green-l)}
.q.reviewed .choice.right .letter{background:var(--green);color:#fff}
.q.reviewed .choice.wrong-pick{border-color:var(--red);background:var(--red-l)}

.bank{background:#fafafa;border:1px solid #eee;border-radius:14px;padding:10px;margin:8px 10px 4px}
.bank-h{font-weight:800;margin:0 0 8px;font-size:13px;color:var(--muted)}
.bank-pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bank-pic{text-align:center;background:#fff;border:1px solid #eee;border-radius:12px;padding:6px}
.bank-pic .letter{display:inline-block;width:24px;height:24px;border-radius:50%;background:#c62828;color:#fff;font-weight:800;line-height:24px;margin-bottom:4px;font-size:13px}
.bank-text{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bank-text .bt{background:#fff;border:1px solid #eee;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.letters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.letters button{width:42px;height:42px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;font-weight:900;font-size:16px}
.letters button.on{background:var(--red);color:#fff;border-color:var(--red)}
.q.reviewed .letters button.right{background:var(--green);border-color:var(--green);color:#fff}
.q.reviewed .letters button.wrong-pick{background:var(--red);border-color:var(--red);color:#fff;opacity:.85}

.review{display:none;margin-top:8px;background:#e8f5e9;border-radius:12px;padding:10px 12px;font-size:14px}
.q.reviewed .review{display:block}
.q.wrong .review{background:#ffebee}
.review .zh-line{font-size:18px;font-weight:800}
.badge{display:inline-block;border-radius:8px;padding:1px 8px;font-weight:800;font-size:12px;margin-right:4px}
.badge.ok{background:var(--green);color:#fff}
.badge.no{background:var(--red);color:#fff}
.py-line{font-size:14px;margin:2px 0}

.results-hero{text-align:center;padding:22px 12px;border-radius:24px;margin-bottom:16px;color:#fff}
.results-hero.pass{background:linear-gradient(135deg,#2e7d32,#00897b)}
.results-hero.fail{background:linear-gradient(135deg,#c62828,#ef6c00)}
.big-score{font-size:clamp(48px,10vw,80px);font-weight:900;line-height:1}
.results-hero h2{margin:0 0 4px}
.pass-line{opacity:.95;font-weight:700}
.bars{display:grid;gap:8px;margin:12px 0}
.bar-row{display:grid;grid-template-columns:110px 1fr 80px;align-items:center;gap:8px;font-weight:700}
.bar{height:16px;background:#eceff1;border-radius:8px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:8px}
.score-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.score-card{border-radius:16px;padding:14px;color:#fff;text-align:center}
.score-card.l{background:#c62828}
.score-card.r{background:#1565c0}
.score-card .n{font-size:32px;font-weight:900}
.hidden{display:none!important}
.rev-jump{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}

@media (max-width:720px){
  .start-grid{grid-template-columns:1fr}
  .choices.pics,.bank-pics{grid-template-columns:1fr 1fr}
  .bank-text{grid-template-columns:1fr}
  .hero{padding:18px 12px}
  .header-in{padding:8px 10px}
  .brand h1{font-size:13px}
  .qnum{width:28px;height:28px}
  .choice .opt-zh{font-size:16px}
  .bar-row{grid-template-columns:80px 1fr 64px;font-size:13px}
  .score-cards{grid-template-columns:1fr}
}
@media (min-width:721px) and (max-width:900px){
  .choices.pics{grid-template-columns:repeat(3,1fr)}
}

/* tone-colored pinyin stays readable on red / blue / green */
.hero .py, .sec-nav .py, .part-h .py, .results-hero .py, .score-card .py, .btn .py,
.hero .en, .sec-nav .en, .part-h .en, .results-hero .en, .score-card .en, .btn .en {
  text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.55);
}
.sec-nav button .gw .py, .score-card .gw .py, .btn .gw .py { letter-spacing:.02em; }

/* letters sit above photos, not on faces */
.choices.pics .choice{display:flex;flex-direction:column;align-items:center;padding:10px 8px 8px}
.choices.pics .choice .letter{margin:0 0 8px;flex:none;background:#fff;border:2px solid #cfd8dc}
.bank-pic{display:flex;flex-direction:column;align-items:center}
.bank-pic .letter{margin:0 0 6px;flex:none}

.q, .part, .part-h { scroll-margin-top: calc(var(--header-h) + 76px); }

.results-hero .bar{background:rgba(0,0,0,.28)}
.results-hero .bar > i{background:#fff}

/* hero title pinyin should not collide */
.hero-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px}
.hero-sub{font-size:15px;font-weight:700;opacity:.95;margin:0 0 10px}
.hero .meta span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;color:#fff}

.wrap{padding-bottom:12px}


/* === pinyin ruby + readable instruction chips === */
.rw{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;vertical-align:bottom;margin:0 .14em .2em;text-align:center;line-height:1.05;max-width:100%}
.rw .rp{font-size:13px;font-weight:800;line-height:1.15;white-space:nowrap;letter-spacing:0;padding:0 1px}
.rw .rz{font-size:22px;font-weight:800;line-height:1.25;color:var(--ink)}
.rw.punct{margin:0 .02em .2em}
.rw.punct .rz{font-size:20px;font-weight:800}
.rw.blank{min-width:3em;padding:0 .15em}
.rw.blank .rz, .rw.blank .blank-slot{display:inline-block;min-width:2.6em;height:1.25em;border-bottom:2px solid var(--ink);color:transparent;font-size:22px;line-height:1.25}
.rline{display:inline;line-height:1.95}
.prompt,.stem,.zh-line{line-height:2.05;font-weight:800}
.prompt-box{line-height:2.05}
.choices:not(.pics) .choice{align-items:flex-start;padding-top:8px;padding-bottom:8px}
.choices:not(.pics) .choice .letter{margin-top:16px}
.bank-text .bt{align-items:flex-start}
.opt-zh,.opt-zh.zh{font-size:inherit}
.glyph-box .py{font-size:14px}

/* white chips: instruction pinyin readable on red / teal / orange / green */
.hero .gw,
.part-h .gw,
.sec-nav button .gw,
.score-card .gw,
.results-hero .gw,
.btn-primary .gw{
  background:#fff;
  border-radius:10px;
  padding:5px 8px 6px;
  margin:3px 3px 5px;
  box-shadow:0 1px 2px rgba(0,0,0,.14);
}
.hero .gw .zh,
.part-h .gw .zh,
.sec-nav button .gw .zh,
.score-card .gw .zh,
.results-hero .gw .zh,
.btn-primary .gw .zh{
  color:var(--ink) !important;
  font-size:16px;
  font-weight:800;
}
.hero .gw .py,
.part-h .gw .py,
.sec-nav button .gw .py,
.score-card .gw .py,
.results-hero .gw .py,
.btn-primary .gw .py{
  font-size:13px !important;
  font-weight:800;
  text-shadow:none !important;
  letter-spacing:.01em;
}
.hero .gw .en,
.part-h .gw .en,
.sec-nav button .gw .en,
.score-card .gw .en,
.results-hero .gw .en,
.btn-primary .gw .en{
  color:var(--muted) !important;
  font-size:11px !important;
  font-style:italic;
  font-weight:700;
  text-shadow:none !important;
}
.part-h .instr-en{
  color:#fff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  font-weight:700;
  margin-top:6px;
}
.part-h .gloss-line{gap:4px 6px}

@media (max-width:720px){
  .rw .rp{font-size:12px}
  .rw .rz{font-size:19px}
  .rw.punct .rz{font-size:18px}
  .hero .gw .zh,
  .part-h .gw .zh,
  .sec-nav button .gw .zh{font-size:15px}
  .hero .gw .py,
  .part-h .gw .py,
  .sec-nav button .gw .py{font-size:12px !important}
  .choices:not(.pics) .choice .letter{margin-top:14px}
}

</style>
</head>
<body>
<header class="app-header">
  <div class="header-in">
    <div class="brand">
      <div class="brand-mark">汉</div>
      <div>
        <h1>HSK 1 · Lessons 3–5 · Workbook mock test</h1>
        <p>Aruna's classes · chinesefrench.in</p>
      </div>
    </div>
    <div class="header-tools" id="headerTools"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="app-footer">Aruna's classes · chinesefrench.in</footer>

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TONE_CH = {
  'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,
  'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,
  'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4,
  'Ā':1,'Á':2,'Ǎ':3,'À':4,'Ē':1,'É':2,'Ě':3,'È':4,
  'Ī':1,'Í':2,'Ǐ':3,'Ì':4,'Ō':1,'Ó':2,'Ǒ':3,'Ò':4,
  'Ū':1,'Ú':2,'Ǔ':3,'Ù':4,'Ǖ':1,'Ǘ':2,'Ǚ':3,'Ǜ':4,'ü':5
};
function toneOf(syl){
  for (const ch of syl){ if (TONE_CH[ch] && TONE_CH[ch]<5) return TONE_CH[ch]; }
  return 5;
}
const VOWEL_RE = /[aeiouvüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
function splitSylToken(tok){
  const toneIdx=[];
  for (let i=0;i<tok.length;i++) if (TONE_CH[tok[i]] && TONE_CH[tok[i]]<5) toneIdx.push(i);
  if (toneIdx.length<=1) return [tok];
  const cuts=[0];
  for (let k=1;k<toneIdx.length;k++){
    let s=toneIdx[k];
    while (s>0 && VOWEL_RE.test(tok[s-1])) s--;
    if (s>=2 && /^(zh|ch|sh)$/i.test(tok.slice(s-2,s))) s-=2;
    else if (s>0 && /[bpmfdtnlgkhjqxzcsryw]/i.test(tok[s-1])) s--;
    if (s>cuts[cuts.length-1]) cuts.push(s);
  }
  cuts.push(tok.length);
  return cuts.slice(0,-1).map((c,i)=>tok.slice(c,cuts[i+1])).filter(Boolean);
}
function colorPy(py){
  return String(py).split(/(\s+|['’\-])/).map(tok => {
    if (!tok) return '';
    if (/^(\s+|['’\-])$/.test(tok)) return esc(tok);
    return splitSylToken(tok).map(s => `<span class="t${toneOf(s)}">${esc(s)}</span>`).join('');
  }).join('');
}

const PY_VOWELS = /[aeiouvüAEIOUVÜāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛ]/;
const PY_TONED = new Set("āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛ");
const PY_LETTER = /[aeiouvüAEIOUVÜāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛA-Za-z]/;
const HAN_RE = /[\u3400-\u9FFF\uF900-\uFAFF]/;
function isHan(ch){ return HAN_RE.test(ch); }
function zhBlankAt(s, i){
  const m = String(s).slice(i).match(/^[（(][　\s]*[)）]/);
  return m ? m[0] : null;
}
function splitPySyllables(word){
  const parts = [];
  String(word).split(/[-'’]/).forEach(chunk => {
    if (chunk) parts.push(...splitPySyllablesPlain(chunk));
  });
  return parts.length ? parts : [word];
}
function splitPySyllablesPlain(word){
  const parts = [];
  let i = 0;
  const n = word.length;
  while (i < n){
    let v = i;
    while (v < n && !PY_VOWELS.test(word[v])) v++;
    if (v >= n){
      if (i < n) parts.push(word.slice(i));
      break;
    }
    let j = v;
    let seenTone = false;
    while (j < n && PY_VOWELS.test(word[j])){
      if (PY_TONED.has(word[j])){
        if (seenTone) break;
        seenTone = true;
      }
      j++;
    }
    const rest = word.slice(j).toLowerCase();
    if (rest.startsWith('ng')) j += 2;
    else if (rest.startsWith('n')) j += 1;
    if (j < n && /r/i.test(word[j]) && (j+1===n || !PY_VOWELS.test(word[j+1]))) j++;
    parts.push(word.slice(i,j));
    i = j;
  }
  return parts;
}
function tokenizePy(py){
  const tokens = [];
  const s = String(py || '');
  let i = 0;
  while (i < s.length){
    if (/\s/.test(s[i])){ i++; continue; }
    if (s[i] === '('){
      const close = s.indexOf(')', i);
      if (close > i){
        tokens.push({type:'blank', py:s.slice(i+1, close).trim()});
        i = close + 1;
        continue;
      }
    }
    if (PY_LETTER.test(s[i])){
      let j = i+1;
      while (j < s.length && (PY_LETTER.test(s[j]) || s[j]==="'" || s[j]==="’" || s[j]==="-")) j++;
      tokens.push({type:'word', py:s.slice(i,j)});
      i = j;
      continue;
    }
    tokens.push({type:'punct', py:s[i]});
    i++;
  }
  return tokens;
}
function rubyZh(zh, py){
  if (!zh) return '';
  if (!py) return `<span class="rz zh">${esc(zh)}</span>`;
  const tokens = tokenizePy(py);
  let i = 0;
  const bits = [];
  const skipSpace = () => { while (i<zh.length && /\s/.test(zh[i])) i++; };
  const emitPunct = ch => { bits.push(`<span class="rw punct"><span class="rz">${esc(ch)}</span></span>`); };
  const emitWord = (chars, p) => {
    bits.push(`<span class="rw"><span class="rp py">${colorPy(p)}</span><span class="rz zh">${esc(chars)}</span></span>`);
  };
  const emitBlank = p => {
    const clue = p ? `<span class="rp py">${colorPy(p)}</span>` : `<span class="rp py">&nbsp;</span>`;
    bits.push(`<span class="rw blank">${clue}<span class="blank-slot" aria-hidden="true">（　）</span></span>`);
  };
  const flushPunct = () => {
    skipSpace();
    while (i<zh.length && !isHan(zh[i]) && !zhBlankAt(zh,i)){
      emitPunct(zh[i++]);
      skipSpace();
    }
  };
  for (const t of tokens){
    skipSpace();
    if (t.type==='blank'){
      flushPunct();
      const b = zhBlankAt(zh,i);
      if (b) i += b.length;
      emitBlank(t.py);
      continue;
    }
    if (t.type==='punct'){
      skipSpace();
      if (i<zh.length && !isHan(zh[i]) && !zhBlankAt(zh,i)){
        emitPunct(zh[i++]);
      }
      continue;
    }
    flushPunct();
    const pre = zhBlankAt(zh,i);
    if (pre){ emitBlank(''); i += pre.length; flushPunct(); }
    const syls = splitPySyllables(t.py);
    let take = syls.length;
    const last = syls[syls.length-1] || '';
    const lastErhua = /r$/i.test(last) && !/^[ēéěèeĒÉĚÈE]r$/i.test(last);
    const hanIdx = [];
    let k = i;
    while (k<zh.length && hanIdx.length < take+1){
      if (zhBlankAt(zh,k)) break;
      if (isHan(zh[k])) hanIdx.push(k);
      else if (/\s/.test(zh[k])){ k++; continue; }
      else break;
      k++;
    }
    if (lastErhua && hanIdx.length >= take+1 && zh[hanIdx[take]]==='儿') take++;
    let chars = '';
    let got = 0;
    while (i<zh.length && got < take){
      if (/\s/.test(zh[i])){ i++; continue; }
      if (isHan(zh[i])){ chars += zh[i++]; got++; continue; }
      break;
    }
    if (chars) emitWord(chars, t.py);
    else emitWord(t.py, t.py);
  }
  flushPunct();
  if (i < zh.length){
    const rest = zh.slice(i);
    if (rest.trim()) bits.push(`<span class="rz zh">${esc(rest)}</span>`);
  }
  return `<span class="rline">${bits.join('')}</span>`;
}

function gw(zh, py, en){
  return `<span class="gw"><span class="zh">${esc(zh)}</span><span class="py">${colorPy(py)}</span><span class="en">${esc(en)}</span></span>`;
}
function instrLine(en, pairs){
  return `<div class="gloss-line">${pairs.map(p=>gw(p[0],p[1],p[2])).join('')}</div><div class="instr-en">${esc(en)}</div>`;
}

};

function answeredCount(){
  return QUESTIONS.filter(q => {
    const a = state.answers[q.id];
    return a !== undefined && a !== null && a !== '';
  }).length;
}
function isCorrect(q, ans){ return ans === q.answer; }
function scoreBreakdown(){
  const out = {listening:0, reading:0, writing:0, total:0, maxL:100, maxR:100, maxW:0, correct:{}, detail:[]};
  QUESTIONS.forEach(q => {
    const ok = isCorrect(q, state.answers[q.id]);
    out.correct[q.id] = ok;
    if (ok){
      out[q.section] += MARK;
      out.total += MARK;
    }
    out.detail.push({id:q.id, ok, ans:state.answers[q.id], right:q.answer});
  });
  return out;
}

function speakerIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM16 3.2v2.1A7.8 7.8 0 0 1 21 12a7.8 7.8 0 0 1-5 6.7v2.1A9.9 9.9 0 0 0 23 12 9.9 9.9 0 0 0 16 3.2z"/></svg>`;
}
function playBtn(q){
  const c = state.plays[q.id]||0;
  const done = !state.submitted && c>=2;
  const lab = state.submitted ? 'Play again' : (done ? 'Played 2/2' : `Play ${c+1}/2`);
  return `<button class="btn-play" ${done?'disabled':''} onclick="playQuestion(${q.id})" aria-label="Play audio for question ${q.id}">${speakerIcon()} ${lab}</button>`;
}

function pickVoices(){
  if (typeof speechSynthesis === 'undefined') { state.noZhVoice = true; return; }
  const vs = speechSynthesis.getVoices() || [];
  if (!vs.length) return;
  state.voice = vs.find(v => /zh-CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  state.noZhVoice = !state.voice;
  const el = $('#voiceWarn');
  if (el) el.classList.toggle('show', state.noZhVoice);
}
function utter(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  u.pitch = 1;
  if (state.voice) u.voice = state.voice;
  return u;
}
function speakSequence(parts, done){
  if (typeof speechSynthesis === 'undefined') { if (done) done(); return; }
  speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if (i >= parts.length){ if (done) done(); return; }
    const p = parts[i++];
    if (p.pause){
      setTimeout(next, p.pause);
      return;
    }
    const u = utter(p.text);
    u.onend = next;
    u.onerror = next;
    speechSynthesis.speak(u);
  };
  next();
}
function audioParts(q){
  const parts = [];
  if (q.dialogue){
    q.dialogue.forEach((d,i) => {
      if (i) parts.push({pause:450});
      parts.push({text:d.zh});
    });
    return parts;
  }
  if (q.stem){
    parts.push({text:q.stem});
    parts.push({pause:400});
    parts.push({text:'问'});
    parts.push({pause:250});
    parts.push({text:q.ask});
    return parts;
  }
  parts.push({text:q.audio});
  return parts;
}
function playQuestion(id){
  const q = QUESTIONS.find(x => x.id===id);
  if (!q) return;
  if (!state.submitted && (state.plays[id]||0) >= 2) return;
  if (typeof speechSynthesis === 'undefined'){
    alert('This browser cannot speak. After you submit, the listening scripts will appear with pinyin and English.');
    return;
  }
  pickVoices();
  if (!state.submitted) state.plays[id] = (state.plays[id]||0) + 1;
  const btn = document.querySelector(`#q${id} .btn-play`);
  if (btn){ btn.classList.add('playing'); btn.innerHTML = speakerIcon() + ' Playing…'; }
  speakSequence(audioParts(q), () => {
    paintExamKeepScroll();
  });
}

function pickChoice(id, letter){
  if (state.submitted) return;
  state.answers[id] = letter;
  paintExamKeepScroll();
}
function pickLetter(id, letter){
  pickChoice(id, letter);
}
function paintExamKeepScroll(){
  const y = window.scrollY;
  renderExam();
  window.scrollTo(0, y);
}
function choiceClass(q, letter){
  const picked = state.answers[q.id] === letter;
  let cls = 'choice' + (picked ? ' on' : '');
  if (state.submitted){
    if (letter === q.answer) cls += ' right';
    else if (picked) cls += ' wrong-pick';
  }
  return cls;
}
function letterClass(q, letter){
  const picked = state.answers[q.id] === letter;
  let cls = picked ? 'on' : '';
  if (state.submitted){
    if (letter === q.answer) cls += ' right';
    else if (picked) cls += ' wrong-pick';
  }
  return cls;
}

function reviewBox(q){
  const ok = isCorrect(q, state.answers[q.id]);
  const yours = state.answers[q.id] || '—';
  let script = '';
  if (q.dialogue){
    script = q.dialogue.map(d =>

    ).join('');
  } else if (q.stem){
    script = `<div class="zh-line">${rubyZh(q.stem, q.stemPy)}</div><div style="color:var(--muted)">${esc(q.stemEn)}</div>
      <div class="zh-line" style="margin-top:6px">${rubyZh('问：'+q.ask, 'Wèn: ' + q.askPy)}</div>
      <div style="color:var(--muted)">${esc(q.askEn)}</div>`;
  } else if (q.audio){
    script = `<div class="zh-line">${rubyZh(q.audio, q.audioPy)}</div><div style="color:var(--muted)">${esc(q.audioEn)}</div>`;
  } else if (q.text){
    script = `<div class="zh-line">${rubyZh(q.text, q.textPy)}</div><div style="color:var(--muted)">${esc(q.textEn||'')}</div>`;
  }
  let key = '';
  if (q.choices){
    const right = q.choices['ABC'.indexOf(q.answer)];
    key = `<div style="margin-top:6px"><strong>Correct:</strong> ${esc(q.answer)} · ${rubyZh(right.zh, right.py)} — ${esc(right.en)}</div>`;
  } else if (q.pics){
    const names = {teacher:'a teacher',student:'a student',family4:'a family of four',one_child:'one child',two_children:'two children',dumplings:'jiaozi / dumplings',noodles:'noodles',laptop:'a computer',dishes:'Chinese dishes',cal_sunday:'Sunday (星期日)',cal_thu:'Thursday (星期四)',cal_8:'the 8th (8号)'};
    key = `<div style="margin-top:6px"><strong>Correct picture:</strong> ${esc(q.answer)} — ${esc(names[q.pics['ABC'.indexOf(q.answer)]]||q.pics['ABC'.indexOf(q.answer)])}</div>`;
  } else if (q.bank){
    const b = BANKS[q.bank];
    if (b.type==='pics'){
      const names = b.captions || {};
      key = `<div style="margin-top:6px"><strong>Correct picture:</strong> ${esc(q.answer)} — ${esc(names[q.answer]||q.answer)}</div>`;
    } else {
      const it = b.items[q.answer];
      key = `<div style="margin-top:6px"><strong>Correct:</strong> ${esc(q.answer)} · ${rubyZh(it.zh, it.py)} — ${esc(it.en)}</div>`;
    }
  }
  return `<div class="review">
    <span class="badge ${ok?'ok':'no'}">${ok?'Correct':'Not correct'}</span>
    Your answer: <strong>${esc(yours)}</strong>
    ${script}${key}
  </div>`;
}

function formatTime(s){
  s = Math.max(0, s|0);
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  return m + ':' + sec;
}
function startTimer(){
  stopTimer();
  if (!state.useTimer || state.submitted) return;
  const tick = () => {
    const el = $('#timerPill');
    if (el){
      el.textContent = formatTime(state.secondsLeft);
      el.classList.toggle('warn', state.secondsLeft<=5*60);
    }
    if (state.secondsLeft<=0){
      stopTimer();
      doSubmit();
      return;
    }
    state.secondsLeft--;
  };
  tick();
  state.timerId = setInterval(tick, 1000);
}
function stopTimer(){
  if (state.timerId){ clearInterval(state.timerId); state.timerId=null; }
}
function renderHeader(){
  const n = answeredCount();

  if (state.screen==='start'){

  }
  let timer = '';
  if (state.useTimer && !state.submitted){
    timer = `<span class="pill timer" id="timerPill">${formatTime(state.secondsLeft)}</span>`;
  }
  const prog = state.submitted ? '' : `<span class="progress-mini" id="progMini">${n}/40</span>`;
  tools.innerHTML = `${prog}${timer}
    ${state.submitted?'':`<button class="btn btn-primary" onclick="confirmSubmit()">Submit</button>`}
    <button class="btn btn-ghost" onclick="confirmReset()">Reset</button>`;
}

        <span>听力 100 + 阅读 100</span>
        <span>Pass 120</span>
        <span>About 40 minutes</span>
      </div>
    </section>
    <div class="start-grid">
      <div class="card">
        <h3>What this paper is</h3>
        <p>It follows the official HSK (Level 1) mock test in the <strong>New HSK Standard Course 1 workbook</strong> (学练手册): the same four listening parts and four reading parts as the 模拟试卷, and the same shorter 模拟测练 used after Lessons 4 and 5.</p>
        <ol>
          <li><strong>Listening I</strong> — hear a phrase, choose a picture (A B C).</li>
          <li><strong>Listening II</strong> — hear a question, choose the reply.</li>
          <li><strong>Listening III</strong> — hear a short dialogue, match a picture (A–F).</li>
          <li><strong>Listening IV</strong> — hear a short text + 问, choose A B C.</li>
          <li><strong>Reading I</strong> — match the sentence to a picture (A–F).</li>
          <li><strong>Reading II</strong> — match the question to the answer (A–F).</li>
          <li><strong>Reading III</strong> — fill the blank from a word bank (A–F).</li>
          <li><strong>Reading IV</strong> — read a short text, answer the ★ question.</li>
        </ol>
        <p>Each question is worth <strong>5 marks</strong> (40 × 5 = 200). The official Level 1 paper in the workbook has <strong>no writing section</strong>; this mock follows that paper, so writing is not scored here.</p>
        <p>Tap <strong>Play</strong> on each listening item. You may play it twice during the test (as in the official paper). Pictures are real photographs, not cartoons. After you submit, every item shows the script or text with tone-colored pinyin and English.</p>
        <div class="tone-legend">
          <span>Tone colors:</span>
          <span class="t1">1 mā</span>
          <span class="t2">2 má</span>
          <span class="t3">3 mǎ</span>
          <span class="t4">4 mà</span>
          <span class="t5">neutral ma</span>
        </div>
      </div>
      <div class="card">
        <h3>Ready?</h3>
        <form class="start-form" onsubmit="startExam();return false;">
          <label>Your name (optional)
            <input id="nameIn" type="text" maxlength="40" placeholder="e.g. Aruna's class" autocomplete="name">
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-weight:700">
            <input id="timerIn" type="checkbox"> Optional 40-minute timer
          </label>
          <button type="submit" class="btn btn-primary" style="justify-content:center">${gw('开始','kāishǐ','Start')}</button>
        </form>
      </div>
    </div>
    ${creditsHtml()}
  `;
  stampTestInfo();
}

function startExam(){
  if (typeof speechSynthesis !== 'undefined'){
    pickVoices();
    speechSynthesis.onvoiceschanged = pickVoices;
  }
  state.name = ($('#nameIn') && $('#nameIn').value.trim()) || state.name;
  state.useTimer = !!( $('#timerIn') && $('#timerIn').checked );
  state.screen='exam';
  state.submitted=false;
  state.section='listening';
  state.answers={};
  state.plays={};
  state.secondsLeft=TIME_SEC;
  if (window.speechSynthesis) speechSynthesis.cancel();
  renderExam();
  startTimer();
  window.scrollTo({top:0});
}
function confirmSubmit(){
  const n = answeredCount();
  const left = TOTAL_Q-n;
  const msg = left>0
    ? `You have answered ${n} of ${TOTAL_Q} questions (${left} still blank). Submit anyway?`
    : `You have answered all ${TOTAL_Q} questions. Submit and see your score?`;
  if (window.confirm(msg)) doSubmit();
}
function doSubmit(){
  stopTimer();
  if (window.speechSynthesis) speechSynthesis.cancel();
  state.submitted=true;
  state.screen='results';
  renderResults();
  window.scrollTo({top:0});
}
function confirmReset(){
  if (window.confirm('Clear all answers and return to the start page?')){
    resetAll();
  }
}
function resetAll(){
  stopTimer();
  if (window.speechSynthesis) speechSynthesis.cancel();
  state.screen='start';
  state.submitted=false;
  state.answers={};
  state.plays={};
  state.section='listening';
  state.secondsLeft=TIME_SEC;
  renderStart();
  window.scrollTo({top:0});
}

function renderResults(){
  const sc = scoreBreakdown();
  const pass = sc.total>=PASS;
  const who = state.name ? esc(state.name)+' · ' : '';
  $('#app').innerHTML = `
    <section class="results-hero ${pass?'pass':'fail'}" id="scoreReport">
      <div style="font-weight:800;opacity:.9">${who}Aruna's classes · chinesefrench.in</div>
      <h2>${pass ? 'Pass' : 'Not yet a pass'}</h2>
      <div class="big-score" id="score-total">${sc.total}</div>
      <div class="pass-line">out of 200 &nbsp;·&nbsp; pass line 120</div>
      <div class="score-cards">
        <div class="score-card l"><div>${gw('听力','tīnglì','Listening')}</div><div class="n" id="score-L">${sc.listening}</div><div>/ 100</div></div>
        <div class="score-card r"><div>${gw('阅读','yuèdú','Reading')}</div><div class="n" id="score-R">${sc.reading}</div><div>/ 100</div></div>
      </div>
      <div class="bars" style="max-width:520px;margin:12px auto 0;text-align:left">
        <div class="bar-row"><span>Listening</span><div class="bar"><i style="width:${sc.listening}%;background:#fff"></i></div><span>${sc.listening}/100</span></div>
        <div class="bar-row"><span>Reading</span><div class="bar"><i style="width:${sc.reading}%;background:#fff"></i></div><span>${sc.reading}/100</span></div>
      </div>
    </section>
    <div class="rev-jump">
      <button class="btn btn-primary" onclick="reviewSection('listening')">${gw('听力','tīnglì','Listening')} review</button>
      <button class="btn btn-primary" style="background:#1565c0" onclick="reviewSection('reading')">${gw('阅读','yuèdú','Reading')} review</button>
      <button class="btn btn-ghost" onclick="confirmReset()">Reset</button>
    </div>
    <div id="reviewPaper"></div>
    ${creditsHtml()}
  `;
  renderHeader();
  stampTestInfo();
  reviewSection('listening');
}
function reviewSection(name){
  state.section = name;
  const host = $('#reviewPaper');
  if (!host) return;
  // temporarily reuse exam renderers
  const saved = state.screen;
  host.innerHTML = name==='listening' ? renderListening() : renderReading();
  const sec = host.querySelector('.exam-sec');
  if (sec) sec.classList.remove('hidden');
}

function fillAllCorrect(){
  QUESTIONS.forEach(q => { state.answers[q.id] = q.answer; });
}
function fillAllWrong(){
  QUESTIONS.forEach(q => {
    const opts = q.choices || q.pics ? ['A','B','C'] : (q.bank && BANKS[q.bank] ? BANKS[q.bank].keys : ['A','B','C']);
    state.answers[q.id] = opts.find(k => k!==q.answer) || 'Z';
  });
}
function stampTestInfo(){
  let el = document.getElementById('test-out');
  if (!el){
    el = document.createElement('div');
    el.id = 'test-out';
    el.style.cssText = 'position:fixed;left:0;bottom:36px;z-index:99;background:#111;color:#0f0;font:12px monospace;padding:4px 8px;max-width:100%;overflow:auto;display:none';
    document.body.appendChild(el);
  }
  const sc = state.submitted ? scoreBreakdown() : {total:'-',listening:'-',reading:'-',writing:'-'};
  el.dataset.score = String(sc.total);
  el.dataset.errors = String((window.__errors||[]).length);
  el.dataset.screen = state.screen;
  el.textContent = JSON.stringify({score:sc.total,L:sc.listening,R:sc.reading,W:sc.writing,errors:window.__errors||[],answered:answeredCount(),screen:state.screen});
  if ((window.__errors||[]).length) el.style.display = 'block';
}

function boot(){
  const params = new URLSearchParams(location.search);
  const screen = params.get('screen') || params.get('mode');
  if (params.get('name')) state.name = params.get('name');
  if (typeof speechSynthesis !== 'undefined'){
    pickVoices();
    speechSynthesis.onvoiceschanged = pickVoices;
  }
  if (screen==='exam'){
    startExam();
    if (params.get('sec')) showSection(params.get('sec'), true);
    return;
  }
  if (screen==='results' || screen==='allcorrect' || params.get('autotest')==='1'){
    startExam();
    fillAllCorrect();
    doSubmit();
    return;
  }
  if (screen==='allwrong'){
    startExam();
    fillAllWrong();
    doSubmit();
    return;
  }
  renderStart();
}

window.playQuestion = playQuestion;
window.pickLetter = pickLetter;
window.pickChoice = pickChoice;
window.showSection = showSection;
window.startExam = startExam;
window.confirmSubmit = confirmSubmit;
window.confirmReset = confirmReset;
window.resetAll = resetAll;
window.doSubmit = doSubmit;
window.fillAllCorrect = fillAllCorrect;
window.fillAllWrong = fillAllWrong;
window.stampTestInfo = stampTestInfo;
window.reviewSection = reviewSection;
window.scoreBreakdown = scoreBreakdown;
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
