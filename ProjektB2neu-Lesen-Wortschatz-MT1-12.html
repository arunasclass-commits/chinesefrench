<style>
:root{--ink:#22303a;--paper:#faf7f0;--card:#fff;--border:#22303a;--accent:#2f6b3a;--red:#d4553f;--blue:#2f7d95;--orange:#f2a83c;--muted:#6b7a85;--soft:#eef3ee;--shadow:0 5px 0 rgba(34,48,58,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:820px;margin:0 auto;padding-bottom:84px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--border);padding:10px 14px}
.topbar h1{margin:0 0 8px;font-size:16px;line-height:1.2}
.topbar h1 small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:2px solid var(--border);background:#fff;border-radius:18px;padding:4px 9px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.teil.on{background:var(--blue);border-color:var(--blue)}
.lbl{font-size:11px;font-weight:800;color:var(--muted);margin-right:2px}
.row2{margin-top:6px}
.panel{display:none;padding:14px}
.panel.active{display:block}
.card{background:var(--card);border:2px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 6px;font-size:15px}
.meta{color:var(--muted);font-size:12px;font-weight:600}
.pill{display:inline-block;font-size:10px;font-weight:800;border-radius:10px;padding:2px 7px;color:#fff;vertical-align:middle}
.B1{background:var(--blue)}.B2{background:var(--red)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input[type=search]{flex:1;min-width:150px;border:2px solid var(--border);border-radius:10px;padding:7px 10px;font-size:14px}
.vitem{border-bottom:1px dashed #cfd6cf;padding:9px 2px}
.vitem:last-child{border-bottom:none}
.vtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vde{font-weight:800;font-size:15px}
.ven{font-size:14px;margin-top:2px}
.syn{font-size:12.5px;color:#3c4d57;margin-top:3px}
.syn b{color:var(--accent)}
.ex{font-size:12.5px;color:var(--muted);margin-top:3px;font-style:italic}
.hide .ans{filter:blur(6px);cursor:pointer;user-select:none}
.hide .ans.shown{filter:none}
.say{border:none;background:var(--soft);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;flex:none}
.tag{font-size:10.5px;color:var(--muted);font-weight:700}
/* flashcards */
.fc{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.fc .big{font-size:24px;font-weight:800;margin:8px 0}
.fc .small{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid var(--border);background:#fff;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.warn{background:var(--orange);border-color:var(--orange)}
/* quiz */
.q{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--border);background:#fff;border-radius:12px;padding:10px 12px;margin:7px 0;font-size:15px;cursor:pointer;color:var(--ink)}
.opt.ok{background:#d9efdc;border-color:var(--accent)}
.opt.bad{background:#f8dcd6;border-color:var(--red)}
.fb{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.score{font-weight:800;color:var(--orange)}
.progress{height:8px;background:#e3e0d6;border-radius:6px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--accent)}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:820px;margin:0 auto;display:flex;background:var(--card);border-top:2px solid var(--border);z-index:10}
.tabbar button{flex:1;border:none;background:none;padding:8px 2px 7px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabbar .ic{font-size:19px}
.tabbar button.active{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{cursor:pointer}
.tcard:hover{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);background:#fff8e8;border:1px solid #f0d9a8;border-radius:10px;padding:8px 10px;margin-bottom:12px}
@media (max-width:480px){.fc .big{font-size:20px}.q{font-size:15.5px}}
</style>
</head>

g is too superficial for me."}, {"type": "gap", "q": "Das ständige Klingeln des Handys hält mich von der Arbeit ___.", "options": ["um", "ein", "ab", "an"], "answer": 2, "en": "The constant ringing of the phone keeps me from my work."}, {"type": "gap", "q": "Mein Opa weiß noch nicht, wie man mit dem neuen Laptop ___.", "options": ["umgeht", "abhält", "bezieht", "speichert"], "answer": 0, "en": "My grandpa doesn't know yet how to use the new laptop."}, {"type": "gap", "q": "Ich möchte die Serie heute Abend auf keinen Fall ___.", "options": ["vertrauen", "verpassen", "wehren", "einschleichen"], "answer": 1, "en": "I definitely don't want to miss the series tonight."}, {"type": "gap", "q": "Bei Fotos von fremden Leuten im Netz bin ich eher ___.", "options": ["umfassend", "umständlich", "zurückhaltend", "oberflächlich"], "answer": 2, "en": "I am rather cautious about photos of strangers online."}]}, {"test": 1, "teil": 2, "page": 9, "topic_de": "Die Geschichte des Lottospiels", "topic_en": "The history of the lottery", "source": "Zeitschriftenartikel", "task_en": "Fill 6 gaps in an article with the correct sentences; two sentences do not fit.", "summary_en": "The article explains where the number lottery comes from and how it spread through Europe. It describes the start of the modern German lottery and its time on TV. It also talks about the risks of gambling and how the state uses the money.", "vocab": [{"de": "das Glücksspiel, -e", "en": "game of chance, gambling", "level": "B2", "syn_de": ["das Wettspiel", "das Zufallsspiel"], "syn_en": ["gambling", "game of chance"], "ex_de": "Glücksspiele sind für Jugendliche verboten.", "ex_en": "Gambling is forbidden for young people."}, {"de": "tippen", "en": "to pick (numbers), to bet on", "level": "B2", "syn_de": ["wetten (auf + Akk.)", "ankreuzen"], "syn_en": ["to bet on", "to pick"], "ex_de": "Sie tippt jede Woche die Geburtstage ihrer Kinder.", "ex_en": "Every week she picks her children's birthdays as numbers."}, {"de": "  abzuschwächen.", "ex_en": "The politician tried to tone down his criticism."}, {"de": "angreifen", "en": "to attack", "level": "B1", "syn_de": ["attackieren", "kritisieren"], "syn_en": ["to attack", "to criticise"], "ex_de": "Im Streit hat er sie verbal angegriffen.", "ex_en": "In the argument he attacked her verbally."}, {"de": "indirekt", "en": "indirect", "level": "B1", "syn_de": ["verblümt", "andeutungsweise"], "syn_en": ["indirect", "roundabout"], "ex_de": "Er hat mir indirekt zu verstehen gegeben, dass ich gehen soll.", "ex_en": "He indirectly let me know that I should leave."}, {"de": "das Missverständnis, -se", "en": "misunderstanding", "level": "B1", "syn_de": ["der Irrtum, Irrtümer", "die Fehldeutung, -en"], "syn_en": ["misunderstanding", "confusion"], "ex_de": "Das war nur ein Missverständnis, ich bin nicht böse.", "ex_en": "That was just a misunderstanding; I'm not angry."}, {"de": "das Bedürfnis, -se", "en": "need", "level": "B2", "syn_de": ["der Wunsch, Wünsche", "das Verlangen"], "syn_en": ["need", "desire"], "ex_de": "Nach dem Streit hatte ich das Bedürfnis, allein zu sein.", "ex_en": "After the argument I felt the need to be alone."}, {"de": "der Bruchteil, -e", "en": "fraction, small part", "level": "B2", "syn_de": ["der kleine Teil"], "syn_en": ["fraction", "tiny part"], "ex_de": "Die Reparatur kostete nur einen Bruchteil des Neupreises.", "ex_en": "The repair cost only a fraction of the new price."}, {"de": "belanglos", "en": "trivial, unimportant", "level": "B2", "syn_de": ["unwichtig", "nebensächlich"], "syn_en": ["trivial", "unimportant"], "ex_de": "Wir haben uns nur über belanglose Dinge unterhalten.", "ex_en": "We only talked about trivial things."}, {"de": "einbeziehen (in + Akk.)", "en": "to include, to involve (in)", "level": "B2", "syn_de": ["beteiligen (an + Dat.)", "integrieren"], "syn_en": ["to include", "to involve"], "ex_de": "Die Lehrerin bezieht auch die stillen Schüler in das Gespräch ein.", "ex_en": "The teacher also involves the quiet pupils in the conversation."}, {"de": "umschreiben", "en": "to paraphrase, to describe in other words", "level": "B2", "syn_de": ["mit anderen Worten sagen", "paraphrasieren"], "syn_en": ["to paraphrase", "to describe indirectly"], "ex_de": "Wenn dir ein Wort fehlt, kannst du es umschreiben.", "ex_en": "If you can't think of a word, you can paraphrase it."}, {"de": "das Anliegen, -", "en": "concern, request", "level": "B2", "syn_de": ["die Bitte, -n", "das Gesuch, -e"], "syn_en": ["request", "concern"], "ex_de": "Mit welchem Anliegen kommen Sie zu uns?", "ex_en": "What is your request?"}, {"de": "aufdringlich", "en": "pushy, intrusive", "level": "B2", "syn_de": ["zudringlich", "lästig"], "syn_en": ["pushy", "intrusive"], "ex_de": "Der Verkäufer war mir zu aufdringlich.", "ex_en": "The salesman was too pushy for me."}, {"de": "das Temperament, -e", "en": "temperament", "level": "B2", "syn_de": ["das Wesen", "die Veranlagung, -en"], "syn_en": ["temperament", "nature"], "ex_de": "Mein Bruder hat ein ruhiges Temperament.", "ex_en": "My brother has a calm temperament."}], "phrases": [{"de": "aneinander vorbeireden", "en": "to talk at cross purposes", "level": "B2", "syn_de": "sich nicht verstehen"}, {"de": "eine wichtige Rolle spielen", "en": "to play an important role", "level": "B1", "syn_de": "sehr wichtig sein"}, {"de": "jemanden unter Druck setzen", "en": "to put pressure on someone", "level": "B2", "syn_de": "jemanden bedrängen"}, {"de": "eine Aussage abschwächen", "en": "to soften a statement", "level": "B2", "syn_de": "etwas vorsichtiger formulieren"}, {"de": "Missverständnisse ersparen", "en": "to avoid misunderstandings", "level": "B2", "syn_de": "Missverständnisse vermeiden"}, {"de": "Gefühle ausdrücken", "en": "to express feelings", "level": "B1", "syn_de": "Emotionen zeigen"}, {"de": "im Gespräch bleiben", "en": "to keep the conversation going; to stay in contact", "level": "B2", "syn_de": "in Kontakt bleiben"}, {"de": "eine Frage des Charakters", " ion."}, {"de": "überfüllt", "en": "overcrowded", "level": "B1", "syn_de": ["überlaufen", "voll"], "syn_en": ["overcrowded", "packed"], "ex_de": "Am Montagmorgen ist die U-Bahn immer überfüllt.", "ex_en": "The underground is always overcrowded on Monday mornings."}, {"de": "gerecht werden (+ Dat.)", "en": "to do justice to, to meet (demands)", "level": "B2", "syn_de": ["erfüllen", "entsprechen (+ Dat.)"], "syn_en": ["to do justice to", "to meet"], "ex_de": "Das neue Gesetz wird den Bedürfnissen der Familien nicht gerecht.", "ex_en": "The new law does not meet the needs of families."}], "phrases": [{"de": "ein offenes Ohr haben (für + Akk.)", "en": "to be willing to listen (to)", "level": "B2", "syn_de": "gern zuhören"}, {"de": "nicht bloß eine Nummer sein", "en": "to not be just a number", "level": "B2", "syn_de": "persönlich wahrgenommen werden"}, {"de": "etwas anerkannt bekommen", "en": "to get something officially recognised", "level": "B2", "syn_de": "etwas angerechnet bekommen"}, {"de": "sich an Fristen halten", "en": "to meet deadlines", "level": "B2", "syn_de": "Termine einhalten"}, {"de": "eine Prüfung bestehen", "en": "to pass an exam", "level": "B1", "syn_de": "eine Prüfung schaffen"}, {"de": "sich Geld dazuverdienen", "en": "to earn some extra money", "level": "B2", "syn_de": "nebenbei jobben"}, {"de": "so gut wie nicht möglich", "en": "practically impossible", "level": "B2", "syn_de": "fast unmöglich"}, {"de": "auf den Markt kommen", "en": "to come onto the market", "level": "B2", "syn_de": "angeboten werden"}, {"de": "einen guten Ruf genießen", "en": "to have a good reputation", "level": "B2", "syn_de": "hoch angesehen sein"}, {"de": "es geht familiär zu", "en": "the atmosphere is like a family", "level": "B2", "syn_de": "die Stimmung ist persönlich"}], "quiz": [{"type": "gap", "q": "Meine Oma hat immer ein offenes ___ für meine Probleme.", "options": ["Ohr", "Auge", "Herz", "Wort"], "answer": 0, "en": "My grandma always has an open ear for my problems." const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(t){try{const clean=t.replace(/\(.*?\)/g,'').split(/[,\/]/)[0].replace(/\.\.\./g,'');const u=new SpeechSynthesisUtterance(clean);u.lang='de-DE';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function parts(){return DATA.filter(d=>(S.test===0||d.test===S.test)&&(S.teil===0||d.teil===S.teil));}
function vocab(){let v=[];parts().forEach(p=>p.vocab.forEach(x=>v.push({...x,_t:p.test,_k:p.teil})));if(S.lvl!=='all')v=v.filter(x=>x.level===S.lvl);return v;}
function phrases(){let v=[];parts().forEach(p=>p.phrases.forEach(x=>v.push({...x,_t:p.test,_k:p.teil})));if(S.lvl!=='all')v=v.filter(x=>x.level===S.lvl);return v;}

function chips(){
  const tc=$('#testChips');tc.innerHTML=['Alle',...Array.from({length:12},(_,i)=>i+1)].map((t,i)=>`<button class="chip ${S.test===i?'on':''}" data-t="${i}">${t}</button>`).join('');
  const kc=$('#teilChips');kc.innerHTML=['Alle',1,2,3,4].map((t,i)=>`<button class="chip teil ${S.teil===i?'on':''}" data-k="${i}">${t}</button>`).join('');
  const lc=$('#lvlChips');lc.innerHTML=['all','B1','B2'].map(l=>`<button class="chip ${S.lvl===l?'on':''}" data-l="${l}">${l==='all'?'Alle':l}</button>`).join('');
  tc.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.test=+b.dataset.t;refresh();});
  kc.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.teil=+b.dataset.k;refresh();});
  lc.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.lvl=b.dataset.l;refresh();});
}
function refresh(){chips();S.cards=[];S.quiz=null;S.cardIdx=0;S.flipped=false;renderAll();}

function renderOver(){
  const ps=parts();
  let h=`<div class="note">Open your Testbuch at the page shown. Read the text and do the book task first. Then use this app to learn the words. The texts and book questions are not copied here — examples and quiz sentences are new.</div>`;
  if(S.test===0||S.teil===0){
    h+=`<div class="grid">`+ps.map(p=>`<div class="card tcard" data-t="${p.test}" data-k="${p.teil}"><div class="meta">Modelltest ${p.test} · Teil ${p.teil} · S. ${p.page}</div><h3>${esc(p.topic_de)}</h3><div class="meta">${esc(p.topic_en)} · ${p.vocab.length} Wörter · ${p.phrases.length} Phrasen</div></div>`).join('')+`</div>`;
  } else {
    const p=ps[0];
    h+=`<div class="card"><div class="meta">Modelltest ${p.test} · Lesen Teil ${p.teil} · Testbuch Seite ${p.page}–${p.page+1}</div><h2>${esc(p.topic_de)}</h2><div class="meta">${esc(p.topic_en)} · ${esc(p.source)}</div>
    <p><b>Aufgabe / Task:</b> ${esc(p.task_en)}</p><p><b>Worum geht es? / What is it about?</b> ${esc(p.summary_en)}</p>
    <div class="btns"><button class="btn pri" data-go="p-vocab">🔤 ${p.vocab.length} Wörter</button><button class="btn" data-go="p-phr">💬 ${p.phrases.length} Phrasen</button><button class="btn" data-go="p-cards">🃏 Karten</button><button class="btn warn" data-go="p-quiz">✅ Quiz</button></div></div>`;
    const others=DATA.filter(d=>d.test===p.test);
    h+=`<div class="grid">`+others.map(o=>`<div class="card tcard" data-t="${o.test}" data-k="${o.teil}" style="${o.teil===p.teil?'border-color:var(--accent)':''}"><div class="meta">Teil ${o.teil} · S. ${o.page}</div><h3>${esc(o.topic_de)}</h3></div>`).join('')+`</div>`;
  }
  $('#p-over').innerHTML=h;
  $('#p-over').querySelectorAll('.tcard').forEach(c=>c.onclick=()=>{S.test=+c.dataset.t;S.teil=+c.dataset.k;refresh();window.scrollTo(0,0);});
  $('#p-over').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));
}

function dirTools(extra=''){
  return `<div class="tools"><input type="search" id="srch" placeholder="Suchen / search…" value="${esc(S.q)}">
  <button class="chip ${S.dir==='de'?'on':''}" data-d="de">DE → EN</button><button class="chip ${S.dir==='en'?'on':''}" data-d="en">EN → DE</button>
  <button class="chip ${S.hide?'on':''}" id="hideBtn">${S.hide?'🙈 Antwort versteckt':'👁 Antwort zeigen'}</button>${extra}</div>`;
}
function bindTools(panel,render){
  const s=panel.querySelector('#srch');s.oninput=()=>{S.q=s.value;const pos=s.selectionStart;render();const n=panel.querySelector('#srch');n.focus();n.setSelectionRange(pos,pos);};
  panel.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.dir=b.dataset.d;renderAll();});
  panel.querySelector('#hideBtn').onclick=()=>{S.hide=!S.hide;renderAll();};
  panel.querySelectorAll('.ans').forEach(a=>a.onclick=()=>a.classList.add('shown'));
  panel.querySelectorAll('.say').forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.s);});
}
function match(x){if(!S.q)return true;const q=S.q.toLowerCase();return JSON.stringify(x).toLowerCase().includes(q);}
function src(x){return (S.test===0||S.teil===0)?`<span class="tag">T${x._t}·Teil ${x._k}</span>`:'';}

function renderVocab(){
  const v=vocab().filter(match);const p=$('#p-vocab');
  let h=dirTools()+`<div class="meta" style="margin-bottom:6px">${v.length} Wörter</div><div class="card ${S.hide?'hide':''}">`;
  h+=v.map(x=>{
    const de=`<div class="vde">${esc(x.de)} <span class="pill ${x.level}">${x.level}</span></div>`;
    const en=`<div class="ven">${esc(x.en)}</div>`;
    const syn=`<div class="syn"><b>Synonyme DE:</b> ${esc((x.syn_de||[]).join(' · '))}<br><b>Synonyms EN:</b> ${esc((x.syn_en||[]).join(' · '))}</div>`;
    const ex=`<div class="ex">„${esc(x.ex_de)}“ — ${esc(x.ex_en)}</div>`;
    const front=S.dir==='de'?de:`<div class="vde">${esc(x.en)} <span class="pill ${x.level}">${x.level}</span></div>`;
    const back=S.dir==='de'?`<div class="ans">${en}${syn}${ex}</div>`:`<div class="ans"><div class="ven"><b>${esc(x.de)}</b></div>${syn}${ex}</div>`;
    return `<div class="vitem"><div class="vtop"><div>${front}${src(x)}</div><button class="say" data-s="${esc(x.de)}">🔊</button></div>${back}</div>`;
  }).join('')||'<p>Keine Treffer.</p>';
  p.innerHTML=h+'</div>';bindTools(p,renderVocab);
}
function renderPhr(){
  const v=phrases().filter(match);const p=$('#p-phr');
  let h=dirTools()+`<div class="meta" style="margin-bottom:6px">${v.length} Phrasen / Redemittel</div><div class="card ${S.hide?'hide':''}">`;
  h+=v.map(x=>{
    const front=S.dir==='de'?`<div class="vde">${esc(x.de)} <span class="pill ${x.level}">${x.level}</span></div>`:`<div class="vde">${esc(x.en)} <span class="pill ${x.level}">${x.level}</span></div>`;
    const back=S.dir==='de'?`<div class="ans"><div class="ven">${esc(x.en)}</div><div class="syn"><b>Auch:</b> ${esc(x.syn_de)}</div></div>`:`<div class="ans"><div class="ven"><b>${esc(x.de)}</b></div><div class="syn"><b>Auch:</b> ${esc(x.syn_de)}</div></div>`;
    return `<div class="vitem"><div class="vtop"><div>${front}${src(x)}</div><button class="say" data-s="${esc(x.de)}">🔊</button></div>${back}</div>`;
  }).join('')||'<p>Keine Treffer.</p>';
  p.innerHTML=h+'</div>';bindTools(p,renderPhr);
}

function renderCards(){
  const p=$('#p-cards');
  if(!S.cards.length){S.cards=shuffle([...vocab(),...phrases().map(x=>({...x,syn_de:[x.syn_de],syn_en:[],phrase:true}))]);S.cardIdx=0;S.flipped=false;}
  const n=S.cards.length;if(!n){p.innerHTML='<p>Keine Karten.</p>';return;}
  const x=S.cards[S.cardIdx];
  const front=S.dir==='de'?x.de:x.en, back=S.dir==='de'?x.en:x.de;
  p.innerHTML=`<div class="tools"><button class="chip ${S.dir==='de'?'on':''}" data-d="de">DE → EN</button><button class="chip ${S.dir==='en'?'on':''}" data-d="en">EN → DE</button><span class="meta">Karte ${S.cardIdx+1} / ${n}</span></div>
  <div class="progress"><i style="width:${(S.cardIdx+1)/n*100}%"></i></div>
  <div class="card fc" id="fc"><span class="pill ${x.level}">${x.level}${x.phrase?' · Phrase':''}</span>
   <div class="big">${esc(S.flipped?back:front)}</div>
   ${S.flipped?`<div class="small">Synonyme: ${esc((x.syn_de||[]).filter(Boolean).join(' · '))}${x.syn_en&&x.syn_en.length?'<br>Synonyms: '+esc(x.syn_en.join(' · ')):''}</div>${x.ex_de?`<div class="small" style="margin-top:6px"><i>„${esc(x.ex_de)}“</i></div>`:''}`:`<div class="small">Tippen zum Umdrehen · tap to flip</div>`}
   <div class="small" style="margin-top:6px">T${x._t} · Teil ${x._k}</div></div>
  <div class="btns"><button class="btn" id="prev">◀ Zurück</button><button class="btn" id="spk">🔊</button><button class="btn pri" id="next">Weiter ▶</button><button class="btn" id="mix">🔀 Mischen</button></div>`;
  p.querySelector('#fc').onclick=()=>{S.flipped=!S.flipped;renderCards();};
  p.querySelector('#next').onclick=()=>{S.cardIdx=(S.cardIdx+1)%n;S.flipped=false;renderCards();};
  p.querySelector('#prev').onclick=()=>{S.cardIdx=(S.cardIdx-1+n)%n;S.flipped=false;renderCards();};
  p.querySelector('#spk').onclick=()=>say(x.de);
  p.querySelector('#mix').onclick=()=>{S.cards=[];renderCards();};
  p.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.dir=b.dataset.d;renderAll();});
}

function buildQuiz(){
  const v=vocab(), mode=S.quizMode; let items=[];
  if(mode==='gap'){parts().forEach(pp=>pp.quiz.forEach(q=>{const correct=q.options[q.answer];items.push({q:q.q,opts:shuffle(q.options),correct,info:q.en,tag:`T${pp.test}·Teil ${pp.teil}`});}));}
  else if(v.length>=4){
    const pool=v;
    items=shuffle(v).map(x=>{
      let q,correct,wrong,info;
      if(mode==='de'){q=`Was bedeutet: „${x.de}“?`;correct=x.en;wrong=shuffle(pool.filter(y=>y.en!==x.en)).slice(0,3).map(y=>y.en);info=(x.syn_en||[]).join(' · ');}
      else if(mode==='en'){q=`Wie sagt man auf Deutsch: “${x.en}”?`;correct=x.de;wrong=shuffle(pool.filter(y=>y.de!==x.de)).slice(0,3).map(y=>y.de);info=(x.syn_de||[]).join(' · ');}
      else {if(!x.syn_de||!x.syn_de.length)return null;q=`Welches Wort ist ein Synonym für „${x.de}“?`;correct=x.syn_de[0];wrong=shuffle(pool.filter(y=>y.de!==x.de&&!(x.syn_de||[]).includes(y.de))).slice(0,3).map(y=>y.de);info=`${x.de} = ${x.en}`;}
      return {q,opts:shuffle([correct,...wrong]),correct,info,tag:`T${x._t}·Teil ${x._k}`};
    }).filter(Boolean);
  }
  items=shuffle(items).slice(0,mode==='gap'?48:25);
  S.quiz={items,i:0,score:0,answered:false,picked:null};
}
function renderQuiz(){
  const p=$('#p-quiz');
  const modes=[['gap','Lückentext'],['de','DE → EN'],['en','EN → DE'],['syn','Synonyme']];
  if(!S.quiz)buildQuiz();
  const Q=S.quiz;let h=`<div class="tools">${modes.map(m=>`<button class="chip ${S.quizMode===m[0]?'on':''}" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>`;
  if(!Q.items.length){p.innerHTML=h+'<p>Zu wenige Wörter für dieses Quiz.</p>';bindQ(p);return;}
  if(Q.i>=Q.items.length){
    h+=`<div class="card" style="text-align:center"><h2>Fertig! 🎉</h2><p class="score" style="font-size:28px">${Q.score} / ${Q.items.length}</p><div class="btns"><button class="btn pri" id="again">Nochmal</button></div></div>`;
    p.innerHTML=h;bindQ(p);p.querySelector('#again').onclick=()=>{S.quiz=null;renderQuiz();};return;
  }
  const it=Q.items[Q.i];
  h+=`<div class="meta">Frage ${Q.i+1} / ${Q.items.length} · <span class="score">★ ${Q.score}</span> · ${it.tag}</div><div class="progress"><i style="width:${Q.i/Q.items.length*100}%"></i></div>
  <div class="card"><div class="q">${esc(it.q).replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div>
  ${it.opts.map((o,k)=>{let c='';if(Q.answered){if(o===it.correct)c='ok';else if(k===Q.picked)c='bad';}return `<button class="opt ${c}" data-k="${k}">${esc(o)}</button>`;}).join('')}
  <div class="fb">${Q.answered?(it.opts[Q.picked]===it.correct?'✅ Richtig! ':'❌ Richtig ist: <b>'+esc(it.correct)+'</b>. ')+esc(it.info||''):''}</div>
  ${Q.answered?'<div class="btns" style="margin-top:10px"><button class="btn pri" id="nq">Weiter ▶</button></div>':''}</div>`;
  p.innerHTML=h;bindQ(p);
  if(!Q.answered)p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{Q.picked=+b.dataset.k;Q.answered=true;if(it.opts[Q.picked]===it.correct)Q.score++;renderQuiz();});
  const nq=p.querySelector('#nq');if(nq)nq.onclick=()=>{Q.i++;Q.answered=false;Q.picked=null;renderQuiz();};
}
function bindQ(p){p.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.quizMode=b.dataset.m;S.quiz=null;renderQuiz();});}

function renderAll(){renderOver();renderVocab();renderPhr();renderCards();renderQuiz();}
function tab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.p===id));window.scrollTo(0,0);}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>tab(b.dataset.p));
chips();renderAll();
</script>
</body>
