<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aruna's Class · 商场 · Type the Pinyin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root{--ink:#12233f;--red:#c0392b;--gold:#d4af37;--teal:#0d9488;--blue:#1d6fa8;--purple:#6b21a8;
--green:#059669;--orange:#c05621;--light:#f0f4ff;--border:#e2e8f0;--muted:#8892a4;--shadow:0 8px 32px rgba(0,0,0,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--light);color:var(--ink);min-height:100vh}
.hero{background:linear-gradient(135deg,#1a1a2e 0%,#123a5c 55%,#0d9488 100%);color:#fff;
  padding:18px 16px 22px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'商';position:absolute;font-family:'Noto Sans SC';font-size:168px;font-weight:900;
  color:rgba(255,255,255,.06);top:-20px;left:50%;transform:translateX(-50%);pointer-events:none}
.badge{display:inline-block;background:rgba(212,175,55,.2);border:1px solid rgba(212,175,55,.5);color:var(--gold);
  font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:5px 15px;border-radius:20px;position:relative}
.hero h1{font-family:'Noto Sans SC';font-size:clamp(18px,4.7vw,28px);font-weight:900;margin-top:8px;position:relative}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:3px;position:relative}

.board{display:flex;justify-content:center;gap:7px;padding:9px;flex-wrap:wrap;background:#fff;
  position:sticky;top:0;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sc{border-radius:13px;padding:5px 13px;text-align:center;min-width:96px;border:2px solid var(--border);background:#fff}
.sc .v{font-size:18px;font-weight:900;line-height:1.1}
.sc .l{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:2px}
.sc.p{border-color:#eab9b2;background:#fff3f1}.sc.p .v{color:var(--red);font-size:20px}
.sc.a{border-color:#bfe3da;background:#ecfdf5}.sc.a .v{color:var(--teal)}
.sc.b{border-color:#c9d6f0;background:#eef4ff}.sc.b .v{color:var(--blue)}
.sc.c{border-color:#e9d9ac;background:#fffbe9}.sc.c .v{color:#b8860b}

.nav{display:flex;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto;position:sticky;top:54px;z-index:55}
.nt{flex-shrink:0;padding:11px 14px;border:none;background:none;font-family:'Nunito';font-size:12.5px;font-weight:800;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.nt.on{color:var(--red);border-bottom-color:var(--red)}

.wrap{max-width:820px;margin:0 auto;padding:16px 14px 70px}
.sec{display:none}.sec.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tip{background:#fff7e6;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 13px;
  margin-bottom:12px;font-size:12.5px;color:#7c5e10;font-weight:700;line-height:1.6}
.tip code{background:#fff;border:1px solid #e6d9ae;border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:11.5px;color:#8a6a12}
.tip b.pts{color:var(--red)}
.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;gap:10px;flex-wrap:wrap}
.bar{background:var(--border);border-radius:5px;height:7px;margin-bottom:13px;overflow:hidden}
.barf{height:7px;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--gold));width:0;transition:width .3s}

.pcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px 16px}
.ptag{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:3px 12px;
  font-size:12px;font-weight:900;letter-spacing:.6px;margin-bottom:4px}
.lrow{padding:13px 0}
.lrow+.lrow{border-top:2px dashed var(--border)}
.who{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
  color:#fff;background:var(--blue);border-radius:6px;padding:2px 9px;margin-bottom:5px}
.who.b{background:var(--purple)}
.who.c{background:var(--teal)}
.zh{font-family:'Noto Sans SC';font-size:clamp(26px,6.6vw,38px);font-weight:700;line-height:1.5;margin-bottom:9px}
.ir{display:flex;gap:7px;flex-wrap:wrap;align-items:stretch}
.inp{flex:1;min-width:190px;padding:12px 13px;border:2px solid var(--border);border-radius:11px;
  font-family:ui-monospace,'Nunito',monospace;font-size:16px;font-weight:700;color:var(--ink);background:#fbfcfe}
.inp:focus{outline:none;border-color:var(--blue);background:#fff}
.inp.ok{border-color:var(--green);background:#ecfdf5}
.inp.no{border-color:var(--red);background:#fff1f0}
.btn{font-family:'Nunito';font-size:13px;font-weight:800;border:none;border-radius:10px;padding:11px 16px;cursor:pointer;white-space:nowrap}
.b-g{background:var(--teal);color:#fff}.b-s{background:#eef1f6;color:#475569}.b-d{background:var(--ink);color:#fff}
.b-r{background:var(--red);color:#fff}.b-p{background:var(--purple);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.ans{margin-top:9px;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:800;display:none;line-height:1.55}
.ans.ok{display:block;background:#d1fae5;color:#065f46}
.ans.no{display:block;background:#fee2e2;color:#991b1b}
.ans .p{font-size:16.5px}
.ans .e{font-weight:700;opacity:.85;font-size:13px;margin-top:2px}
.ans .y{font-weight:700;opacity:.8;font-size:12.5px;margin-top:3px}
.ans .pt{float:right;background:rgba(255,255,255,.7);border-radius:6px;padding:1px 8px;font-size:12px}
.note{background:#eef4ff;border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:8px 11px;
  font-size:12px;font-weight:700;color:#1a3a6b;margin-top:8px;line-height:1.55}

.nav2{display:flex;gap:9px;margin-top:14px}
.nav2 button{flex:1;padding:13px;border:none;border-radius:11px;font-family:'Nunito';font-weight:800;font-size:14px;cursor:pointer;background:var(--ink);color:#fff}
.nav2 button:disabled{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--border);cursor:pointer}
.dot.cur{background:var(--red);transform:scale(1.35)}.dot.ok{background:var(--teal)}.dot.part{background:var(--gold)}.dot.no{background:#e9a184}

.lst{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:11px}
.lst .h{background:#f7f9fc;border-bottom:2px solid var(--border);padding:8px 13px;font-size:11px;
  font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.lr{display:flex;gap:10px;align-items:center;padding:10px 13px;border-top:1px solid #eef1f6}
.lr:first-of-type{border-top:none}
.lr .n{font-size:11px;font-weight:900;color:var(--muted);min-width:30px}
.lr .z{font-family:'Noto Sans SC';font-size:22px;font-weight:700;min-width:150px}
.lr .bd{flex:1}
.lr .py{font-size:15px;font-weight:900;color:var(--blue)}
.lr .en{font-size:12.5px;font-weight:700;color:var(--muted)}
.spk{border:none;background:#eef1f6;color:#475569;border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer}
.search{width:100%;padding:11px 13px;border:2px solid var(--border);border-radius:11px;font-family:'Nunito';
  font-size:14px;font-weight:700;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--blue)}
.empty{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:24px;text-align:center;font-weight:800;color:var(--muted)}

.final{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:var(--shadow)}
.final .em{font-size:46px}
.final .big{font-size:42px;font-weight:900;margin:2px 0}
.final .gr{font-family:'Noto Sans SC';font-size:20px;font-weight:900}
.final .pc{font-size:14px;font-weight:800;opacity:.92}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-top:13px}
.tbl th,.tbl td{padding:11px 13px;text-align:left;font-size:14px;font-weight:800;border-bottom:1px solid #eef1f6}
.tbl th{background:#f7f9fc;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{background:#f7f9fc;color:var(--red);font-size:16px;font-weight:900;border-bottom:none}
.footer{text-align:center;padding:20px;font-size:11px;color:var(--muted)}
.footer b{color:var(--red)}
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Aruna's Class · ChineseFrench</div>
  <h1>商场 · 打拼音 · Type the Pinyin</h1>
  <div class="sub">Part 1 — 5 passages × 2 lines · Part 2 — 10 passages × 3 lines · 40 lines · scored out of 200</div>
</div>
<div class="board">
  <div class="sc p"><div class="v" id="vT">0</div><div class="l">总分 Score</div></div>
  <div class="sc a"><div class="v" id="vA">0</div><div class="l">第一部分 Part 1</div></div>
  <div class="sc b"><div class="v" id="vB">0</div><div class="l">第二部分 Part 2</div></div>
  <div class="sc c"><div class="v" id="vC">—</div><div class="l">准确 Accuracy</div></div>
</div>
<div class="nav" id="nav"></div>
<div class="wrap">
  <div class="sec on" id="s-p1"></div>
  <div class="sec" id="s-p2"></div>
  <div class="sec" id="s-all"></div>
  <div class="sec" id="s-fin"></div>
</div>
<div class="footer">商场 · 打拼音练习 · 40 lines in 15 passages · <b>Aruna's Class</b></div>
<script>
var P1=[[{"zh":"我想去商场","py":"Wǒ xiǎng qù shāngchǎng","en":"I want to go to the mall."},{"zh":"你想去吗","py":"Nǐ xiǎng qù ma?","en":"Do you want to go?"}],[{"zh":"妈妈来商场","py":"Māma lái shāngchǎng","en":"Mum is coming to the mall."},{"zh":"我也来","py":"Wǒ yě lái","en":"I’m coming too."}],[{"zh":"你想买什么","py":"Nǐ xiǎng mǎi shénme?","en":"What do you want to buy?"},{"zh":"我想买裙子","py":"Wǒ xiǎng mǎi qúnzi","en":"I want to buy a skirt."}],[{"zh":"这是新开的商场","py":"Zhè shì xīn kāi de shāngchǎng","en":"This is a newly opened mall."},{"zh":"我们去看吧","py":"Wǒmen qù kàn ba","en":"Let’s go and look."}],[{"zh":"商场进来了吗","py":"Shāngchǎng jìnlái le ma?","en":"Has the mall come in? — see the teacher’s note on this line"},{"zh":"我们去看","py":"Wǒmen qù kàn","en":"Let’s go and look."}]];
var P2=[[{"zh":"妈妈想去商场","py":"Māma xiǎng qù shāngchǎng","en":"Mum wants to go to the mall."},{"zh":"我也想去","py":"Wǒ yě xiǎng qù","en":"I want to go too."},{"zh":"我们去吧","py":"Wǒmen qù ba","en":"Let’s go."}],[{"zh":"你想买什么","py":"Nǐ xiǎng mǎi shénme?","en":"What do you want to buy?"},{"zh":"我想买裙子","py":"Wǒ xiǎng mǎi qúnzi","en":"I want to buy a skirt."},{"zh":"你想买什么","py":"Nǐ xiǎng mǎi shénme?","en":"And what do you want to buy?"}],[{"zh":"这是新开的商场","py":"Zhè shì xīn kāi de shāngchǎng","en":"This is a newly opened mall."},{"zh":"我们去看看","py":"Wǒmen qù kànkan","en":"Let’s go and have a look."},{"zh":"好啊","py":"Hǎo a","en":"All right!"}],[{"zh":"你们来商场吗","py":"Nǐmen lái shāngchǎng ma?","en":"Are you coming to the mall?"},{"zh":"我们来商场","py":"Wǒmen lái shāngchǎng","en":"We are coming to the mall."},{"zh":"我们去看","py":"Wǒmen qù kàn","en":"We’ll go and look."}],[{"zh":"我想去商场","py":"Wǒ xiǎng qù shāngchǎng","en":"I want to go to the mall."},{"zh":"你们想去吗","py":"Nǐmen xiǎng qù ma?","en":"Do you want to go?"},{"zh":"好啊","py":"Hǎo a","en":"All right!"}],[{"zh":"妈妈来了吗","py":"Māma lái le ma?","en":"Has Mum come?"},{"zh":"妈妈来了","py":"Māma lái le","en":"Mum has come."},{"zh":"我们去吧","py":"Wǒmen qù ba","en":"Let’s go."}],[{"zh":"这是新开的商场","py":"Zhè shì xīn kāi de shāngchǎng","en":"This is a newly opened mall."},{"zh":"你们去看了吗","py":"Nǐmen qù kàn le ma?","en":"Have you been to see it?"},{"zh":"我们没去","py":"Wǒmen méi qù","en":"We haven’t been."}],[{"zh":"你想买裙子吗","py":"Nǐ xiǎng mǎi qúnzi ma?","en":"Do you want to buy a skirt?"},{"zh":"我想买裙子","py":"Wǒ xiǎng mǎi qúnzi","en":"I want to buy a skirt."},{"zh":"你想买什么","py":"Nǐ xiǎng mǎi shénme?","en":"What do you want to buy?"}],[{"zh":"我们去商场吧","py":"Wǒmen qù shāngchǎng ba","en":"Let’s go to the mall."},{"zh":"妈妈也来","py":"Māma yě lái","en":"Mum is coming too."},{"zh":"好啊","py":"Hǎo a","en":"All right!"}],[{"zh":"商场是新开的","py":"Shāngchǎng shì xīn kāi de","en":"The mall is newly opened."},{"zh":"你想去看吗","py":"Nǐ xiǎng qù kàn ma?","en":"Do you want to go and see it?"},{"zh":"我想去看","py":"Wǒ xiǎng qù kàn","en":"I want to go and see it."}]];
var NOTES={'p1-4-0':'Teacher’s note: 商场进来了吗 is not natural Chinese — 进来 means “come in (towards me)”, so this reads “Has the mall come in?”. The pinyin below is still the pinyin of the line as written. If you want the sense “Have we gone into the mall?”, the line should be 我们进商场了吗？ or 你们进去看了吗？'};

/* ---- pinyin compare: spelling only, tones NOT required ---- */
var TMAP={'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i',
'ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v',
'ń':'n','ň':'n','ǹ':'n'};
function norm(s){
  var t=String(s||'').toLowerCase().replace(/u:/g,'v'), o='';
  for(var i=0;i<t.length;i++){ var c=t[i]; o += (TMAP[c]!==undefined?TMAP[c]:c); }
  o=o.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return o.replace(/[^a-z]/g,'');
}
function firstDiff(a,b){var n=Math.min(a.length,b.length);for(var i=0;i<n;i++)if(a[i]!==b[i])return i;return a.length===b.length?-1:n;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- state: res[part][passage][line] = {st,pts} ---- */
function mk(P){ return P.map(function(p){ return p.map(function(){ return {st:null,pts:0}; }); }); }
var R={1:mk(P1), 2:mk(P2)};
function sumPart(k){ var n=0; R[k].forEach(function(p){p.forEach(function(r){n+=r.pts;});}); return n; }
function okPart(k){ var n=0; R[k].forEach(function(p){p.forEach(function(r){if(r.st==='ok')n++;});}); return n; }
function nPart(k){ var n=0; R[k].forEach(function(p){n+=p.length;}); return n; }
function triedAll(){ var n=0; [1,2].forEach(function(k){R[k].forEach(function(p){p.forEach(function(r){if(r.st!==null)n++;});});}); return n; }
function total(){ return sumPart(1)+sumPart(2); }
var MAX1=nPart(1)*5, MAX2=nPart(2)*5, MAXALL=MAX1+MAX2;
function board(){
  document.getElementById('vT').textContent=total()+' / '+MAXALL;
  document.getElementById('vA').textContent=okPart(1)+' / '+nPart(1);
  document.getElementById('vB').textContent=okPart(2)+' / '+nPart(2);
  var t=triedAll(), r=okPart(1)+okPart(2);
  document.getElementById('vC').textContent=t?Math.round(r/t*100)+'%':'—';
}
function grade(pc){
  if(pc>=90)return ['很棒 Excellent','🏆'];
  if(pc>=75)return ['很好 Very good','🌟'];
  if(pc>=60)return ['不错 Good','👍'];
  if(pc>0)  return ['加油 Keep going','💪'];
  return ['开始吧 Ready','🚀'];
}

/* ---- speech ---- */
var zhVoice=null;
function pv(){try{var v=speechSynthesis.getVoices();zhVoice=null;for(var i=0;i<v.length;i++){if(/zh|Chinese/i.test(v[i].lang+v[i].name)){zhVoice=v[i];break;}}}catch(e){}}
if('speechSynthesis' in window){pv();speechSynthesis.onvoiceschanged=pv;}
function say(t,r){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r||0.78;if(zhVoice)u.voice=zhVoice;speechSynthesis.speak(u);}catch(e){}}

/* ---- tabs ---- */
var TABS=[['p1','① 第一部分 Part 1'],['p2','② 第二部分 Part 2'],['all','📖 全部 All 40'],['fin','🏆 总分 Final score']];
var nav=document.getElementById('nav');
TABS.forEach(function(t,i){var b=document.createElement('button');b.className='nt'+(i===0?' on':'');
  b.id='nt-'+t[0];b.innerHTML=t[1];b.onclick=function(){show(t[0]);};nav.appendChild(b);});
function show(id){
  TABS.forEach(function(t){document.getElementById('nt-'+t[0]).classList.toggle('on',t[0]===id);
    document.getElementById('s-'+t[0]).classList.toggle('on',t[0]===id);});
  window.scrollTo(0,0);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(id==='all') drawAll();
  if(id==='fin') drawFin();
}

/* ================= a passage runner, used for both parts ================= */
var IDX={1:0, 2:0};
var WHO=['甲 A','乙 B','丙 C'];
function renderPart(k){
  var P=(k===1?P1:P2), w=document.getElementById('s-p'+k);
  w.innerHTML='<div class="tip">Read each Chinese line and type it in <b>pinyin</b>. '
   +'<b>Tone marks are not needed</b> — <code>wo xiang qu shangchang</code>, <code>wo3 xiang3 qu4 shang1chang3</code> and '
   +'<code>wǒ xiǎng qù shāngchǎng</code> are all accepted, and spaces do not matter. The <b>spelling</b> must be right. '
   +'Type <code>v</code> for ü. Press <b>Enter</b> to check a line and jump to the next.<br>'
   +'Scoring: <b class="pts">5</b> points first try · <b class="pts">2</b> if you get it right after a miss · <b class="pts">0</b> if you press Show.</div>'
   +'<div class="meta"><span id="m'+k+'"></span><span id="s'+k+'"></span></div>'
   +'<div class="bar"><div class="barf" id="b'+k+'"></div></div>'
   +'<div id="q'+k+'"></div>'
   +'<div class="nav2"><button id="prev'+k+'">← Prev</button><button id="next'+k+'">Next →</button></div>'
   +'<div class="dots" id="d'+k+'"></div>';
  document.getElementById('prev'+k).onclick=function(){if(IDX[k]>0){IDX[k]--;drawPart(k);}};
  document.getElementById('next'+k).onclick=function(){if(IDX[k]<P.length-1){IDX[k]++;drawPart(k);}};
  drawPart(k);
}
function drawPart(k){
  var P=(k===1?P1:P2), i=IDX[k], pas=P[i];
  document.getElementById('m'+k).textContent='Passage '+(i+1)+' / '+P.length+'  ·  '+pas.length+' lines';
  document.getElementById('s'+k).textContent='Part '+k+' points: '+sumPart(k)+' / '+(k===1?MAX1:MAX2);
  document.getElementById('b'+k).style.width=((i+1)/P.length*100)+'%';
  var h='<div class="pcard"><span class="ptag">'+(k===1?'第一部分':'第二部分')+'  ·  '+(i+1)+'</span>';
  pas.forEach(function(o,j){
    var nk='p'+k+'-'+i+'-'+j;
    h+='<div class="lrow">'
      +'<div><span class="who'+(j===1?' b':(j===2?' c':''))+'">'+WHO[j]+'</span></div>'
      +'<div class="zh">'+esc(o.zh)+'</div>'
      +'<div class="ir">'
      +'<input class="inp" id="in'+k+'_'+j+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the pinyin — tones not needed">'
      +'<button class="btn b-g" data-ck="'+j+'">Check ✓</button>'
      +'<button class="btn b-s" data-sy="'+j+'">🔊</button>'
      +'<button class="btn b-s" data-sh="'+j+'">Show</button>'
      +'</div>'
      +(NOTES[nk]?'<div class="note">'+esc(NOTES[nk])+'</div>':'')
      +'<div class="ans" id="an'+k+'_'+j+'"></div></div>';
  });
  h+='<div class="row"><button class="btn b-d" id="ckall'+k+'">Check the whole passage ✓</button>'
    +'<button class="btn b-s" id="sayall'+k+'">🔊 Read it all</button></div></div>';
  document.getElementById('q'+k).innerHTML=h;

  var box=document.getElementById('q'+k);
  box.querySelectorAll('[data-ck]').forEach(function(b){ b.onclick=function(){ gradeLine(k,i,+b.getAttribute('data-ck'),false); }; });
  box.querySelectorAll('[data-sh]').forEach(function(b){ b.onclick=function(){ gradeLine(k,i,+b.getAttribute('data-sh'),true); }; });
  box.querySelectorAll('[data-sy]').forEach(function(b){ b.onclick=function(){ say(pas[+b.getAttribute('data-sy')].zh); }; });
  pas.forEach(function(o,j){
    document.getElementById('in'+k+'_'+j).addEventListener('keydown',function(e){
      if(e.key!=='Enter') return; e.preventDefault();
      gradeLine(k,i,j,false);
      var nx=document.getElementById('in'+k+'_'+(j+1));
      if(nx) nx.focus();
      else if(IDX[k]<(k===1?P1:P2).length-1){ IDX[k]++; drawPart(k); }
    });
  });
  document.getElementById('ckall'+k).onclick=function(){
    pas.forEach(function(o,j){ if(document.getElementById('in'+k+'_'+j).value.trim()) gradeLine(k,i,j,false); });
  };
  document.getElementById('sayall'+k).onclick=function(){ say(pas.map(function(o){return o.zh;}).join('，')); };
  document.getElementById('prev'+k).disabled=(i===0);
  document.getElementById('next'+k).disabled=(i===(k===1?P1:P2).length-1);
  drawDots(k); board();
  var f=document.getElementById('in'+k+'_0'); if(f) f.focus();
}
function gradeLine(k,i,j,reveal){
  var P=(k===1?P1:P2), o=P[i][j], r=R[k][i][j];
  var inp=document.getElementById('in'+k+'_'+j), box=document.getElementById('an'+k+'_'+j);
  var got=norm(inp.value), good=norm(o.py);
  if(!got && !reveal){ inp.focus(); return; }
  var ok=!reveal && got===good, earned=0;
  if(reveal){ if(r.st===null){ r.st='miss'; r.pts=0; } }
  else if(ok){
    if(r.st===null){ r.st='ok'; r.pts=5; earned=5; }
    else if(r.st==='miss'){ r.st='ok'; r.pts=2; earned=2; }
  } else if(r.st===null){ r.st='miss'; r.pts=0; }
  inp.className='inp '+(ok?'ok':'no');
  var extra='';
  if(!ok && got){ var d=firstDiff(good,got);
    extra='<div class="y">you typed: '+esc(inp.value.trim())+(d>=0?'  ·  first difference at letter '+(d+1):'')+'</div>'; }
  box.className='ans '+(ok?'ok':'no');
  box.innerHTML=(earned?'<span class="pt">+'+earned+'</span>':'')+(ok?'✓ ':'✗ ')
    +'<span class="p">'+esc(o.py)+'</span><div class="e">'+esc(o.en)+'</div>'+extra;
  say(o.zh); board(); drawDots(k);
  document.getElementById('s'+k).textContent='Part '+k+' points: '+sumPart(k)+' / '+(k===1?MAX1:MAX2);
}
function drawDots(k){
  var P=(k===1?P1:P2), d=document.getElementById('d'+k); if(!d) return; d.innerHTML='';
  P.forEach(function(pas,i){
    var rs=R[k][i], done=rs.filter(function(r){return r.st!==null;}).length,
        okn=rs.filter(function(r){return r.st==='ok';}).length;
    var cls='dot';
    if(i===IDX[k]) cls+=' cur';
    else if(okn===rs.length) cls+=' ok';
    else if(done===rs.length) cls+=' no';
    else if(done) cls+=' part';
    var e=document.createElement('div'); e.className=cls; e.title='Passage '+(i+1);
    e.onclick=function(){IDX[k]=i;drawPart(k);}; d.appendChild(e);
  });
}

/* ================= ALL ================= */
function drawAll(f){
  var w=document.getElementById('s-all');
  if(!document.getElementById('aflt')){
    w.innerHTML='<div class="tip">Every line with its pinyin and meaning — the answer key. Tap 🔊 to hear it. '
      +'Filter by any character, pinyin syllable or English word.</div>'
      +'<input class="search" id="aflt" placeholder="filter — try  裙子  ·  shangchang  ·  skirt">'
      +'<div id="alist"></div>';
    document.getElementById('aflt').addEventListener('input',function(e){drawAll(e.target.value);});
  }
  var q=(f||'').trim().toLowerCase();
  var hit=function(o){ if(!q) return true; var h=(o.zh+o.py+o.en).toLowerCase();
    return h.indexOf(q)>=0 || norm(h).indexOf(norm(q))>=0; };
  var h='';
  [[1,P1,'第一部分 Part 1  ·  5 passages × 2 lines'],[2,P2,'第二部分 Part 2  ·  10 passages × 3 lines']].forEach(function(t){
    var k=t[0], P=t[1], rows='';
    P.forEach(function(pas,i){
      pas.forEach(function(o,j){
        if(!hit(o)) return;
        rows+='<div class="lr"><span class="n">'+(i+1)+'.'+(j+1)+'</span>'
          +'<div class="z">'+esc(o.zh)+'</div>'
          +'<div class="bd"><div class="py">'+esc(o.py)+'</div><div class="en">'+esc(o.en)+'</div></div>'
          +'<button class="spk" data-s="'+esc(o.zh)+'">🔊</button></div>';
      });
    });
    if(rows) h+='<div class="lst"><div class="h">'+t[2]+'</div>'+rows+'</div>';
  });
  var list=document.getElementById('alist');
  list.innerHTML=h||'<div class="empty">Nothing matches “'+esc(f||'')+'”</div>';
  list.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){say(b.getAttribute('data-s'));};});
}

/* ================= FINAL ================= */
function drawFin(){
  var w=document.getElementById('s-fin');
  var a=sumPart(1), b=sumPart(2), t=a+b, pc=Math.round(t/MAXALL*100), g=grade(pc);
  var miss=[];
  [1,2].forEach(function(k){ var P=(k===1?P1:P2);
    R[k].forEach(function(p,i){ p.forEach(function(r,j){ if(r.st==='miss') miss.push('P'+k+' '+(i+1)+'.'+(j+1)+' '+P[i][j].zh); }); }); });
  var h='<div class="final"><div class="em">'+g[1]+'</div><div class="big">'+t+' / '+MAXALL+'</div>'
   +'<div class="gr">'+g[0]+'</div><div class="pc">'+pc+'%  ·  '+triedAll()+' of '+(nPart(1)+nPart(2))+' lines attempted</div></div>'
   +'<table class="tbl"><tr><th>Part</th><th>Lines right</th><th style="text-align:right">Points</th></tr>'
   +'<tr><td>① 第一部分 — 5 passages × 2 lines</td><td>'+okPart(1)+' / '+nPart(1)+'</td><td class="n">'+a+' / '+MAX1+'</td></tr>'
   +'<tr><td>② 第二部分 — 10 passages × 3 lines</td><td>'+okPart(2)+' / '+nPart(2)+'</td><td class="n">'+b+' / '+MAX2+'</td></tr>'
   +'<tr class="tot"><td>总分 Final score</td><td></td><td class="n">'+t+' / '+MAXALL+'</td></tr></table>';
  if(miss.length){
    h+='<div class="tip" style="margin-top:13px">Still to practise ('+miss.length+'): '+esc(miss.join('   ·   '))+'</div>';
  } else if(triedAll()>0){
    h+='<div class="tip" style="margin-top:13px">Every line you typed was right first time. 🎉</div>';
  }
  h+='<div class="row"><button class="btn b-r" id="fReset">↺ Start again from zero</button></div>';
  w.innerHTML=h;
  document.getElementById('fReset').onclick=function(){
    R={1:mk(P1),2:mk(P2)}; IDX={1:0,2:0};
    board(); renderPart(1); renderPart(2); drawFin();
  };
}

/* ---- init ---- */
board(); renderPart(1); renderPart(2);
</script>
