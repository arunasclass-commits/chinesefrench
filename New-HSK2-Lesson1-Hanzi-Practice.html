/* ===== ETYMOLOGY SVG ===== */
function etySVG(o){
  const lines=[];const words=o.ety.split(' ');let line='';
  words.forEach(w=>{if((line+' '+w).length>34){lines.push(line);line=w;}else line=(line?line+' ':'')+w;});
  if(line)lines.push(line);
  let ty=150;const tl=lines.map(l=>{const s='<text x="210" y="'+ty+'" text-anchor="middle" font-family="Nunito,sans-serif" font-size="13" fill="#334155">'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text>';ty+=18;return s;}).join('');
  return '<svg class="ety" viewBox="0 0 420 '+(ty+14)+'" xmlns="http://www.w3.org/2000/svg">'
    +'<rect x="1" y="1" width="418" height="'+(ty+12)+'" rx="14" fill="#fff" stroke="#e2e8f0"/>'
    +'<rect x="20" y="20" width="90" height="90" rx="10" fill="#fef3c7" stroke="#d4af37"/>'
    +'<text x="65" y="88" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="64" font-weight="900" fill="#12233f">'+o.c+'</text>'
    +'<text x="135" y="52" font-family="Nunito,sans-serif" font-size="22" font-weight="900" fill="#1d6fa8">'+o.py+'</text>'
    +'<text x="135" y="78" font-family="Nunito,sans-serif" font-size="15" font-weight="700" fill="#12233f">'+o.en.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text>'
    +'<text x="135" y="104" font-family="Nunito,sans-serif" font-size="11" font-weight="800" fill="#b8860b">ETYMOLOGY / 字源</text>'
    +tl+'</svg>';
}

/* ===== GENERIC MCQ (meaning / sound) ===== */
function runMCQ(mountId,mode){
 const mount=document.getElementById(mountId);
 const order=shuffle([...Array(N).keys()]);let p=0,correct=0,answered=false;
 const isSound=(mode==='sound');
 mount.innerHTML='<div class="tip">'+(isSound?'Press ▶, listen, then pick the character you heard — no pinyin.':'Look at the character and choose its meaning — no pinyin.')+' All '+N+' characters. +1 each.</div>'
  +'<div class="meta"><span id="'+mountId+'-m"></span><span id="'+mountId+'-s"></span></div><div class="bar"><div class="barf" id="'+mountId+'-bar"></div></div><div id="'+mountId+'-q"></div>';
 function draw(){
   answered=false;const q=document.getElementById(mountId+'-q');
   if(p>=N){q.innerHTML='<div class="done-card"><div>Section done!</div><div class="big">'+correct+' / '+N+'</div><button class="rb" onclick="location.reload()">↺ Restart</button></div>';document.getElementById(mountId+'-m').textContent='';document.getElementById(mountId+'-bar').style.width='100%';return;}
   const o=CHARS[order[p]];
   document.getElementById(mountId+'-m').textContent='Q '+(p+1)+' / '+N;
   document.getElementById(mountId+'-s').textContent='Score: '+correct;
   document.getElementById(mountId+'-bar').style.width=(p/N*100)+'%';
   let opts;
   if(isSound){opts=shuffle([o].concat(shuffle(CHARS.filter(x=>x.c!==o.c)).slice(0,3)));}
   else{opts=shuffle([o].concat(shuffle(CHARS.filter(x=>x.en!==o.en)).slice(0,3)));}
   let html='<div class="qcard">';
   if(isSound){html+='<button class="btn bl" id="play" style="font-size:15px;padding:14px 26px">▶ Play sound</button><div style="font-size:13px;color:#7a8699;font-weight:800;margin-top:10px">Which character did you hear?</div>';}
   else{html+='<div class="qbig">'+o.c+'</div><div style="font-size:12px;color:#7a8699;font-weight:800">What does it mean?</div>';}
   html+='<div class="opts">'+opts.map((x,i)=>'<button class="opt'+(isSound?' zh':'')+'" data-i="'+i+'">'+(isSound?x.c:x.en)+'</button>').join('')+'</div><div class="fb" id="'+mountId+'-fb"></div></div>';
   q.innerHTML=html;
   if(isSound){const pl=document.getElementById('play');pl.onclick=()=>say(o.c);setTimeout(()=>say(o.c),300);}
   const btns=q.querySelectorAll('.opt');
   btns.forEach(b=>b.onclick=()=>{
     if(answered)return;answered=true;
     const chosen=opts[+b.dataset.i];const ok=(isSound?chosen.c===o.c:chosen.en===o.en);
     btns.forEach(x=>{x.classList.add('lock');const xo=opts[+x.dataset.i];if((isSound?xo.c===o.c:xo.en===o.en))x.classList.add('ok');});
     const fb=document.getElementById(mountId+'-fb');
     if(ok){correct++;recScore++;board();fb.className='fb ok';fb.innerHTML='✓ '+o.c+' = '+o.en+' ('+o.py+')';}
     else{b.classList.add('no');fb.className='fb no';fb.innerHTML='✗ '+o.c+' = '+o.en+' ('+o.py+')';}
     say(o.c);
     const nb=document.createElement('button');nb.className='nextb';nb.textContent=p<N-1?'Next →':'Finish ✓';nb.onclick=()=>{p++;draw();};q.querySelector('.qcard').appendChild(nb);
   });
 }
 draw();
}

/* ===== TRUE / FALSE ===== */
function runTF(){
 const mount=document.getElementById('s-tf');
 const order=shuffle([...Array(N).keys()]);let p=0,correct=0,answered=false;
 mount.innerHTML='<div class="tip">Is the meaning shown correct for the character? Answer 对 (True) or 错 (False). '+N+' items.</div>'
  +'<div class="meta"><span id="tfm"></span><span id="tfs"></span></div><div class="bar"><div class="barf" id="tfbar"></div></div><div id="tfq"></div>';
 function draw(){
   answered=false;const q=document.getElementById('tfq');
   if(p>=N){q.innerHTML='<div class="done-card"><div>True/False done!</div><div class="big">'+correct+' / '+N+'</div><button class="rb" onclick="location.reload()">↺ Restart</button></div>';document.getElementById('tfm').textContent='';document.getElementById('tfbar').style.width='100%';return;}
   const o=CHARS[order[p]];const showTrue=Math.random()<0.5;
   const shown=showTrue?o:shuffle(CHARS.filter(x=>x.en!==o.en))[0];
   const meaning=showTrue?o.en:shown.en;
   document.getElementById('tfm').textContent='Q '+(p+1)+' / '+N;document.getElementById('tfs').textContent='Score: '+correct;document.getElementById('tfbar').style.width=(p/N*100)+'%';
   q.innerHTML='<div class="qcard"><div class="qbig">'+o.c+'</div><div style="font-size:16px;font-weight:800">means &ldquo;'+meaning+'&rdquo; ?</div><div class="tf"><button class="btn bg" id="t">对 True</button><button class="btn br" id="f">错 False</button></div><div class="fb" id="tffb"></div></div>';
   function ans(choseTrue){if(answered)return;answered=true;const ok=(choseTrue===showTrue);const fb=document.getElementById('tffb');if(ok){correct++;recScore++;board();fb.className='fb ok';fb.innerHTML='✓ Correct! '+o.c+' = '+o.en+' ('+o.py+')';}else{fb.className='fb no';fb.innerHTML='✗ '+o.c+' actually = '+o.en+' ('+o.py+')';}say(o.c);const nb=document.createElement('button');nb.className='nextb';nb.textContent=p<N-1?'Next →':'Finish ✓';nb.onclick=()=>{p++;draw();};q.querySelector('.qcard').appendChild(nb);}
   document.getElementById('t').onclick=()=>ans(true);document.getElementById('f').onclick=()=>ans(false);
 }
 draw();
}

/* ===== FILL BLANK (drag & drop) ===== */
function runFill(){
 const mount=document.getElementById('s-fill');
 const order=shuffle([...Array(FILL.length).keys()]);let p=0,correct=0,answered=false,dragged=null;
 mount.innerHTML='<div class="tip">Drag (or tap) the correct character into the blank. The pinyin tells you the word; only the missing character is blank. '+FILL.length+' items.</div>'
  +'<div class="meta"><span id="flm"></span><span id="fls"></span></div><div class="bar"><div class="barf" id="flbar"></div></div><div id="flq"></div>';
 function draw(){
   answered=false;const q=document.getElementById('flq');
   if(p>=FILL.length){q.innerHTML='<div class="done-card"><div>Fill-blank done!</div><div class="big">'+correct+' / '+FILL.length+'</div><button class="rb" onclick="location.reload()">↺ Restart</button></div>';document.getElementById('flm').textContent='';document.getElementById('flbar').style.width='100%';return;}
   const it=FILL[order[p]];const ans=it.w[it.bi];
   document.getElementById('flm').textContent='Q '+(p+1)+' / '+FILL.length;document.getElementById('fls').textContent='Score: '+correct;document.getElementById('flbar').style.width=(p/FILL.length*100)+'%';
   let wordHtml='<div class="fillword">';
   it.w.forEach((ch,i)=>{wordHtml+=(i===it.bi)?'<div class="fslot" id="slot"></div>':'<span class="fchar">'+ch+'</span>';});
   wordHtml+='</div>';
   const opts=shuffle([ans].concat(shuffle(CHARS.map(x=>x.c).filter(c=>!it.w.includes(c))).slice(0,3)));
   let bank='<div class="bank" id="bank">'+opts.map(c=>'<button class="tile" draggable="true" data-c="'+c+'">'+c+'</button>').join('')+'</div>';
   q.innerHTML='<div class="qcard"><div style="font-size:15px;font-weight:800;color:#1d6fa8">'+it.py+'</div>'+wordHtml+bank+'<div class="fb" id="flfb"></div><button class="btn bo" id="check" style="margin-top:6px">Check ✓</button></div>';
   const slot=document.getElementById('slot');const bankEl=document.getElementById('bank');
   q.querySelectorAll('.tile').forEach(t=>{
     t.addEventListener('dragstart',()=>dragged=t);
     t.addEventListener('click',()=>{if(answered)return;if(t.parentElement===slot){bankEl.appendChild(t);slot.classList.remove('filled');}else{if(slot.firstChild)bankEl.appendChild(slot.firstChild);slot.appendChild(t);slot.classList.add('filled');}});
   });
   slot.addEventListener('dragover',e=>e.preventDefault());
   slot.addEventListener('drop',e=>{e.preventDefault();if(dragged){if(slot.firstChild)bankEl.appendChild(slot.firstChild);slot.appendChild(dragged);slot.classList.add('filled');}});
   document.getElementById('check').onclick=()=>{
     if(answered)return;const got=slot.firstChild?slot.firstChild.dataset.c:'';const fb=document.getElementById('flfb');
     if(got===ans){answered=true;correct++;recScore++;board();fb.className='fb ok';fb.innerHTML='✓ '+it.w.join('')+' — '+it.py;say(it.w.join(''));const nb=document.createElement('button');nb.className='nextb';nb.textContent=p<FILL.length-1?'Next →':'Finish ✓';nb.onclick=()=>{p++;draw();};q.querySelector('.qcard').appendChild(nb);}
     else{fb.className='fb no';fb.innerHTML='✗ Not yet — try again.';}
   };
 }
 draw();
}

/* ===== MATCH (no pinyin), sets of 5 ===== */
function runMatch(){
 const mount=document.getElementById('s-match');
 const sets=[];for(let i=0;i<N;i+=5)sets.push([...Array(Math.min(5,N-i)).keys()].map(k=>i+k));
 let si=0,total=0;
 mount.innerHTML='<div class="tip">Tap a character, then tap its meaning (no pinyin). Green = matched. '+sets.length+' sets from all '+N+' characters.</div>'
  +'<div class="meta"><span id="mmm"></span><span id="mms"></span></div><div id="mmq"></div>';
 function draw(){
   const q=document.getElementById('mmq');
   if(si>=sets.length){q.innerHTML='<div class="done-card"><div>Matching done!</div><div class="big">'+total+' / '+N+'</div><button class="rb" onclick="location.reload()">↺ Restart</button></div>';document.getElementById('mmm').textContent='';return;}
   const grp=sets[si].map(i=>CHARS[i]);
   document.getElementById('mmm').textContent='Set '+(si+1)+' / '+sets.length;document.getElementById('mms').textContent='Matched: '+total+' / '+N;
   let sel=null,matched=0;
   let html='<div class="mgrid"><div><div class="mh">汉字</div><div class="mcol" id="L"></div></div><div><div class="mh">Meaning</div><div class="mcol" id="R"></div></div></div>';
   q.innerHTML=html;
   const L=document.getElementById('L'),R=document.getElementById('R');
   grp.forEach((o,i)=>{const e=document.createElement('div');e.className='mi zh';e.textContent=o.c;e.dataset.k=i;e.onclick=()=>pickL(e);L.appendChild(e);});
   shuffle(grp.map((_,i)=>i)).forEach(i=>{const o=grp[i];const e=document.createElement('div');e.className='mi en';e.textContent=o.en;e.dataset.k=i;e.onclick=()=>pickR(e);R.appendChild(e);});
   let selL=null,selR=null;
   function pickL(e){if(e.classList.contains('matched'))return;L.querySelectorAll('.mi').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');selL=e;say(grp[+e.dataset.k].c);ev();}
   function pickR(e){if(e.classList.contains('matched'))return;R.querySelectorAll('.mi').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');selR=e;ev();}
   function ev(){if(!selL||!selR)return;const a=selL,b=selR;if(a.dataset.k===b.dataset.k){a.classList.add('matched');b.classList.add('matched');a.classList.remove('sel');b.classList.remove('sel');matched++;total++;recScore++;board();document.getElementById('mms').textContent='Matched: '+total+' / '+N;selL=selR=null;if(matched===grp.length)setTimeout(()=>{si++;draw();},450);}else{a.classList.add('wrong');b.classList.add('wrong');const x=a,y=b;selL=selR=null;setTimeout(()=>{x.classList.remove('wrong','sel');y.classList.remove('wrong','sel');},350);}}
 }
 draw();
}

/* init */
board();renderWrite();
runMCQ('s-meaning','meaning');
runMCQ('s-sound','sound');
runTF();runFill();runMatch();
</script>
